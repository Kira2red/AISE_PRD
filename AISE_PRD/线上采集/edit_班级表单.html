  position: relative;

  position: absolute;

}

window.videoArray = window.videoArray || [];
var updateVideoArraySY = async () => {
  const videoElements = document.querySelectorAll('video');
  for (const video of videoElements) {
    const src = video.currentSrc;
    if (
      src &&
      !src.startsWith('blob:') &&
      !window.videoArray.some((item) => item.url === src)
    ) {
      const videoId = 'vid' + window.videoArray.length;
      window.videoArray.push({
        url: src,
        title: document.title,
        videotype: '',
        videoid: videoId,
        videosize: '',
        playingstatus: false,
        Poster: ''
      });
      window.postMessage({
        action: 'disposeContentVideo',
        id: videoId,
        src:src
      });
    }
  }
};
  updateVideoArraySY();
