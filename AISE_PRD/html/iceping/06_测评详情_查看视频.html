<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测评详情 - 查看视频</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 针对视频卡片悬浮出现的播放遮罩效果 */
        .video-card:hover .play-overlay {
            opacity: 1;
        }
        .play-overlay {
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-blue-50/50 text-gray-800 font-sans min-h-screen">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm flex items-center justify-between px-8 py-3">
        <div class="flex items-center space-x-2">
            <span class="text-[#f26522] font-bold text-2xl tracking-tighter">Ai</span>
            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-purple-600">爱测评</span>
            <span class="text-purple-600 border border-purple-600 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold ml-1">e</span>
        </div>
        
        <nav class="flex space-x-12 text-[15px] text-gray-600 font-medium">
            <a href="#" class="hover:text-blue-600">首页</a>
            <a href="#" class="hover:text-blue-600">测评管理</a>
            <a href="#" class="hover:text-blue-600">测评报告</a>
        </nav>

        <div class="flex items-center space-x-2 cursor-pointer">
            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-sm font-bold shadow-sm">
                管
            </div>
            <span class="text-sm font-medium">AISE管理员</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="max-w-[1400px] mx-auto mt-6 px-4 pb-12">
        <!-- 标题栏区 -->
        <div class="bg-white rounded-lg shadow-sm px-6 py-4 mb-6">
            <h1 class="text-lg font-semibold text-gray-800">录屏视频 / 摄像头视频</h1>
        </div>

        <!-- 视频列表网格：4列布局 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <!-- 渲染 8 个视频占位卡片 -->
            <!-- 视频1 -->
            <div class="video-card group bg-white rounded-lg p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="openVideoModal('1、录屏视频-2026-01-24 14:02:45')">
                <div class="relative w-full aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1542831371-29b0f74f9713?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="监控截图" class="w-full h-full object-cover">
                    <!-- 悬浮播放蒙层 -->
                    <div class="play-overlay absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0">
                        <svg class="w-12 h-12 text-white opacity-90 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    </div>
                </div>
                <div class="mt-3 text-sm text-gray-700 font-medium px-1 truncate">
                    1、录屏视频-2026-01-24 14:02:45
                </div>
            </div>

            <!-- 视频2 -->
            <div class="video-card group bg-white rounded-lg p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="openVideoModal('2、录屏视频-2026-01-24 14:03:47')">
                <div class="relative w-full aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="监控截图" class="w-full h-full object-cover">
                    <div class="play-overlay absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0">
                        <svg class="w-12 h-12 text-white opacity-90 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    </div>
                </div>
                <div class="mt-3 text-sm text-gray-700 font-medium px-1 truncate">
                    2、录屏视频-2026-01-24 14:03:47
                </div>
            </div>

            <!-- 视频3 -->
            <div class="video-card group bg-white rounded-lg p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="openVideoModal('3、录屏视频-2026-01-24 14:04:47')">
                <div class="relative w-full aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="监控截图" class="w-full h-full object-cover">
                    <div class="play-overlay absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0">
                        <svg class="w-12 h-12 text-white opacity-90 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    </div>
                </div>
                <div class="mt-3 text-sm text-gray-700 font-medium px-1 truncate">
                    3、录屏视频-2026-01-24 14:04:47
                </div>
            </div>

            <!-- 视频4 -->
            <div class="video-card group bg-white rounded-lg p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="openVideoModal('4、录屏视频-2026-01-24 14:05:47')">
                <div class="relative w-full aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="监控截图" class="w-full h-full object-cover">
                    <div class="play-overlay absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0">
                        <svg class="w-12 h-12 text-white opacity-90 drop-shadow-md" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    </div>
                </div>
                <div class="mt-3 text-sm text-gray-700 font-medium px-1 truncate">
                    4、录屏视频-2026-01-24 14:05:47
                </div>
            </div>

            <!-- 再次复制 4 个伪造占位版式 -->
             <div class="video-card group bg-white rounded-lg p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="openVideoModal('5、录屏视频-2026-01-24 14:06:47')">
                <div class="relative w-full aspect-video bg-gray-100 rounded border border-gray-200 overflow-hidden flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1542831371-29b0f74f9713?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover">
                    <div class="play-overlay absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0">
                        <svg class="w-12 h-12 text-white opacity-90" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    </div>
                </div>
                <div class="mt-3 text-sm text-gray-700 font-medium px-1 truncate">
                    5、录屏视频-2026-01-24 14:06:47
                </div>
            </div>

            <!-- 可以继续添加更多 -->

        </div>
    </main>

    <!-- 全屏视频播放弹窗 (Modal) -->
    <div id="videoModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- 黑色半透明遮罩层 -->
        <div class="absolute inset-0 bg-black bg-opacity-80 backdrop-blur-sm" onclick="closeVideoModal()"></div>
        
        <!-- 视频容器本体 -->
        <div class="relative z-10 w-11/12 max-w-6xl aspect-video bg-black rounded-lg shadow-2xl overflow-hidden flex flex-col">
            
            <!-- 头部说明 & 关闭按键 -->
            <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/70 to-transparent flex justify-between items-center z-20 pointer-events-none">
                <h2 id="modalTitle" class="text-white text-lg font-medium drop-shadow-md">视频播放</h2>
                <button onclick="closeVideoModal()" class="text-white hover:text-gray-300 transition-colors pointer-events-auto bg-black/30 hover:bg-black/50 rounded-full p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- 核心视频播放器（使用原生 controls 提供最全的 拖拽进度、倍速 和 全屏能力）-->
            <!-- 现代多数浏览器如 Chrome 基于 controls 均能自带 playbackRate (原生右下角三点菜单内的播放速度选项) -->
            <video id="player" class="w-full h-full object-contain" controls preload="metadata">
                <!-- 这里使用一个公共的宽屏视频用于展示效果 -->
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                您的浏览器不支持 HTML5 video 标签。
            </video>
        </div>
    </div>

    <!-- 交互脚本 -->
    <script>
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('player');
        const modalTitle = document.getElementById('modalTitle');

        // 打开弹窗并自动播放
        function openVideoModal(title) {
            modalTitle.innerText = title;
            modal.classList.remove('hidden');
            // 如果遇到跨域或自动播放限制可能捕获异常
            player.currentTime = 0; 
            player.play().catch(e => console.log('Autoplay prevented', e));
        }

        // 关闭弹窗并停播
        function closeVideoModal() {
            modal.classList.add('hidden');
            player.pause();
        }

        // 支持 ESC 键关闭弹窗
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && !modal.classList.contains('hidden')) {
                closeVideoModal();
            }
        });
    </script>
</body>
</html>
