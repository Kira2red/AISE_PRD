<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱测评 - 日常作业</title>
<link rel="stylesheet" href="爱测评线上样式.css">
<style>
html, body { margin: 0; padding: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }

/* 线上容器：浅蓝渐变背景，左右顶满 */
.container {
  min-width: 1280px !important;
  background: linear-gradient(0deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.4) 100%), radial-gradient(158.01% 139.35% at 0% 0%, #D9F2FF 0%, #F2F0FC 27.87%, #BFD8FF 100%);
  min-height: 100vh;
}
/* 线上顶栏：透明+毛玻璃，64px，满宽 */
.header { height: 64px; width: 100%; position: sticky; top: 0; left: 0; backdrop-filter: blur(10px); background: rgba(0,0,0,0); }

/* 侧边栏 */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 200px; background: #fff; border-right: 1px solid #e8e8e8; padding-top: 76px; z-index: 10; }
.sidebar .ant-menu-inline { border-right: none; }

/* 内容区 */
.main-content-area { margin-left: 200px; padding: 24px; }
.common-radius { border-radius: 8px; }
.table-page-search-wrapper { background: #fff; }
.table-page-search-wrapper .title { font-size: 18px; font-weight: 600; color: #323335; margin: 0; }
.table-operator { margin-bottom: 16px; }

/* 表格 */
.ant-table { width: 100%; border-collapse: collapse; }
.ant-table th { background: #fafafa; font-size: 13px; font-weight: 600; color: #64666B; text-align: left; padding: 10px 12px; border-bottom: 1px solid #e8e8e8; }
.ant-table td { font-size: 13px; color: #323335; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
.req-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #64666B; }
.op-link { color: #2A55E5; cursor: pointer; font-size: 13px; }
.op-link:hover { text-decoration: underline; }
.divider-v { display: inline-block; width: 1px; height: 12px; background: #e8e8e8; margin: 0 8px; vertical-align: middle; }
.status-dot { white-space: nowrap; }
.status-dot.green { color: rgb(0, 148, 62); }
.status-dot.red { color: rgb(227, 73, 73); }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 16px; font-size: 13px; color: #64666B; }
.pagination .page-btn { min-width: 28px; height: 28px; line-height: 28px; text-align: center; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; background: #fff; padding: 0 6px; }
.pagination .page-btn.active { border-color: #2A55E5; color: #2A55E5; }
.pagination .page-btn:hover { border-color: #2A55E5; color: #2A55E5; }
.pagination .page-btn.disabled { color: rgba(0,0,0,.25); cursor: not-allowed; }

/* 布置作业弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: none; }
.modal-box { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 560px; background: #fff; border-radius: 4px; }
.modal-title-row { padding: 16px 24px; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; }
.modal-title-row .t { font-size: 16px; font-weight: 600; color: #323335; }
.modal-title-row .x { cursor: pointer; color: #969AA0; }
.modal-body { padding: 24px; }
.form-row { display: flex; align-items: center; margin-bottom: 16px; }
.form-row .fl { flex-shrink: 0; width: 76px; text-align: right; padding-right: 12px; font-size: 14px; color: #323335; }
.form-row .fv { flex: 1; }
.form-row .ant-input { width: 100%; height: 32px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; font-size: 14px; }
.form-row textarea.ant-input { height: 84px; padding: 6px 8px; resize: none; line-height: 20px; }
.form-row .ant-select { position: relative; cursor: pointer; }
.opt-dropdown { position: absolute; top: 34px; left: 0; z-index: 200; background: #fff; border: 1px solid #e8e8e8; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15); min-width: 100%; max-height: 260px; overflow: auto; display: none; }
.opt-dropdown .kp-opt { padding: 7px 14px; font-size: 13px; color: #323335; cursor: pointer; }
.opt-dropdown .kp-opt:hover, .opt-dropdown .kp-opt.active { background: #E5F5FF; color: #2A55E5; }
.modal-footer { padding: 10px 16px; border-top: 1px solid #e8e8e8; text-align: right; }
.demo-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 14px; z-index: 9999; display: none; }
</style>
</head>
<body>
<div class="demo-toast" id="demoToast"></div>
<div class="container" id="app">
  <!-- ===== 顶部导航 ===== -->
  <div style="position: sticky; top: 0; z-index: 999;">
    <div class="header">
      <div class="ant-row-flex ant-row-flex-middle" style="display:flex;align-items:center;">
        <div class="brand ant-col" style="flex: 0 0 300px; display:flex; align-items:center; padding-left:24px;">
          <img src="assets/logo.png" alt="logo" style="height:36px;">
          <div role="separator" class="ant-divider ant-divider-vertical"></div>
          <div class="levelLogo"><img src="assets/level-logo.png" alt="" style="height:30px;"></div>
        </div>
        <div class="menu ant-col" style="flex: 1 1 0%;">
          <ul role="menu" class="ant-menu ant-menu-horizontal ant-menu-root ant-menu-light">
            <li role="menuitem" class="ant-menu-item"><a href="13_管理首页.html"><span>首页</span></a></li>
            <li role="menuitem" class="ant-menu-submenu ant-menu-submenu-horizontal ant-menu-submenu-selected"><div class="ant-menu-submenu-title"><span style="display:flex;align-items:center;cursor:pointer;"><span>测评管理</span></span><i class="ant-menu-submenu-arrow"></i></div></li>
            <li role="menuitem" class="ant-menu-item"><a href="25_测评报告.html"><span>测评报告</span></a></li>
          </ul>
        </div>
        <div style="padding-right:24px; display:flex; align-items:center; gap:8px;">
          <span class="ant-avatar" style="background:#2A55E5;">A</span>
          <span style="font-size:14px;color:#323335;">AISE管理员</span>
          <i class="anticon anticon-down" style="color:#999;">▾</i>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <button type="button" class="ant-btn ant-btn-primary" style="border-radius:8px;background:rgb(42,85,229);width:184px;height:44px;margin:0 auto 12px;display:block;"><span>创建考试</span></button>
    <ul role="menu" class="ant-menu ant-menu-inline ant-menu-root ant-menu-light" style="width:calc(100% - 16px);margin-left:8px;">
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="13_管理首页.html"><i class="iconfont">🏠</i>首页</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="01_题目管理.html"><i class="iconfont">📋</i>题目管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="03_试卷编辑_列表.html"><i class="iconfont">📄</i>试卷管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="12_考试管理_候考配置.html"><i class="iconfont">📝</i>考试管理</a></li>
      <li role="menuitem" class="ant-menu-item ant-menu-item-selected" style="padding-left:24px;"><a href="18_日常作业.html"><i class="iconfont">📚</i>日常作业</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">🏫</i>班级管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">👨‍🏫</i>教师管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">🧑‍🎓</i>学生管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">🏢</i>组织管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">🗑</i>回收站</a></li>
    </ul>
  </aside>

  <!-- ===== 主内容 ===== -->
  <main class="ant-layout-content main-content-area">
    <div class="common-radius table-page-search-wrapper ant-card" style="padding:24px;">
      <h2 class="title">日常作业</h2>
      <div class="table-operator">
        <button type="button" class="ant-btn ant-btn-primary" style="margin-top:7px;" onclick="openModal()"><i class="anticon anticon-plus" style="margin-right:6px;">＋</i><span>布置作业</span></button>
      </div>

      <!-- 作业表格 -->
      <table class="ant-table">
        <thead>
          <tr>
            <th style="width:60px;min-width:60px;">序号</th>
            <th style="width:240px;min-width:240px;">作业名称</th>
            <th>作业要求</th>
            <th style="width:120px;min-width:120px;">布置时间</th>
            <th style="width:90px;min-width:90px;">作业进度</th>
            <th style="width:60px;min-width:60px;">状态</th>
            <th style="width:240px;min-width:240px;">操作</th>
          </tr>
        </thead>
        <tbody id="hwBody"></tbody>
      </table>

      <!-- 分页 -->
      <div class="pagination">
        <span id="pageInfo">1-4 共4条</span>
        <span class="page-btn disabled">‹</span>
        <span class="page-btn active">1</span>
        <span class="page-btn disabled">›</span>
        <span>10 条/页</span>
      </div>
    </div>
  </main>
</div>

<!-- 布置作业弹窗 -->
<div class="modal-mask" id="hwModal">
  <div class="modal-box">
    <div class="modal-title-row"><span class="t">布置作业</span><span class="x" onclick="closeModal()">✕</span></div>
    <div class="modal-body">
      <div class="form-row">
        <span class="fl">作业名称</span>
        <div class="fv"><input type="text" class="ant-input" id="hwName" placeholder="请输入作业名称"></div>
      </div>
      <div class="form-row">
        <span class="fl">选择班级</span>
        <div class="fv">
          <div class="ant-select" style="width:100%;height:32px;line-height:30px;border:1px solid #d9d9d9;border-radius:4px;" onclick="toggleDropdown('clsDropdown')">
            <div class="ant-select-selection ant-select-selection--single" style="border:none;height:30px;line-height:30px;">
              <div class="ant-select-selection__rendered" style="line-height:30px;padding:0 8px;"><div class="ant-select-selection__placeholder" id="clsVal" style="color:#bfbfbf;font-size:14px;">请选择班级</div></div>
            </div><span class="ant-select-arrow" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#bfbfbf;font-size:12px;">▾</span>
            <div class="opt-dropdown" id="clsDropdown">
              <div class="kp-opt active" onclick="pickCls(this)">请选择班级</div>
              <div class="kp-opt" onclick="pickCls(this)">AI创新实验1班</div>
              <div class="kp-opt" onclick="pickCls(this)">Scratch趣味编程班</div>
              <div class="kp-opt" onclick="pickCls(this)">Python进阶班</div>
              <div class="kp-opt" onclick="pickCls(this)">C++竞赛集训班</div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-row">
        <span class="fl">作业要求</span>
        <div class="fv"><textarea class="ant-input" id="hwReq" placeholder="请输入作业要求"></textarea></div>
      </div>
      <div class="form-row">
        <span class="fl">截止时间</span>
        <div class="fv"><input type="datetime-local" class="ant-input" id="hwDeadline"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="ant-btn" onclick="closeModal()">取 消</button>
      <button type="button" class="ant-btn ant-btn-primary" style="margin-left:8px;" onclick="submitHw()">确 定</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ Mock 数据（线上页面为演示数据） ============ */
var HWS = [
  { name: '图形化编程练习：小猫动画', req: '用Scratch制作一个包含背景切换与角色移动的小动画，提交.sb3文件', time: '2026-08-18 10:00', progress: '3/12', status: '进行中' },
  { name: 'Python基础练习：100以内质数', req: '编写程序输出100以内所有质数，提交代码与运行截图', time: '2026-08-15 09:30', progress: '12/12', status: '已结束' },
  { name: 'Scratch作品：迷宫小游戏', req: '制作一个可玩的迷宫游戏，包含计分与失败重开', time: '2026-08-12 14:00', progress: '12/12', status: '已结束' },
  { name: '编程OJ练习：判断闰年', req: '完成平台OJ题「判断闰年」，在线提交代码', time: '2026-08-26 16:00', progress: '1/20', status: '进行中' }
];

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('demoToast');
  t.textContent = msg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }

/* ============ 表格渲染 ============ */
function renderTable() {
  var html = '';
  for (var i = 0; i < HWS.length; i++) {
    var h = HWS[i];
    var green = h.status === '进行中';
    html += '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + esc(h.name) + '</td>' +
      '<td><div class="req-cell" title="' + esc(h.req) + '">' + esc(h.req) + '</div></td>' +
      '<td>' + esc(h.time) + '</td>' +
      '<td>' + esc(h.progress) + '</td>' +
      '<td><span class="status-dot ' + (green ? 'green' : 'red') + '">● ' + esc(h.status) + '</span></td>' +
      '<td><span class="op-link" onclick="toast(\'📋 查看作业「' + esc(h.name) + '」详情（演示）\')">详情</span><span class="divider-v"></span><span class="op-link" onclick="delHw(' + i + ')">删除</span></td>' +
      '</tr>';
  }
  document.getElementById('hwBody').innerHTML = html || '<tr><td colspan="7" style="text-align:center;color:#bfbfbf;padding:32px;">暂无数据</td></tr>';
  document.getElementById('pageInfo').textContent = HWS.length ? ('1-' + HWS.length + ' 共' + HWS.length + '条') : '0 条';
}
function delHw(i) {
  toast('🗑 已删除作业「' + esc(HWS[i].name) + '」（演示）');
  HWS.splice(i, 1);
  renderTable();
}

/* ============ 布置作业弹窗 ============ */
function openModal() { document.getElementById('hwModal').style.display = ''; }
function closeModal() { document.getElementById('hwModal').style.display = 'none'; }
function toggleDropdown(id) {
  var dd = document.getElementById(id);
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
function pickCls(el) {
  var val = document.getElementById('clsVal');
  val.textContent = el.textContent;
  val.style.color = el.textContent === '请选择班级' ? '#bfbfbf' : '#323335';
  document.getElementById('clsDropdown').querySelectorAll('.kp-opt').forEach(function (o) { o.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('clsDropdown').style.display = 'none';
}
document.addEventListener('click', function (e) {
  if (!e.target.closest('.ant-select')) {
    document.querySelectorAll('.opt-dropdown').forEach(function (d) { d.style.display = 'none'; });
  }
});
function submitHw() {
  var name = document.getElementById('hwName').value.trim();
  var req = document.getElementById('hwReq').value.trim();
  var cls = document.getElementById('clsVal').textContent;
  var deadline = document.getElementById('hwDeadline').value;
  if (!name) { toast('请输入作业名称'); return; }
  if (cls === '请选择班级') { toast('请选择班级'); return; }
  var now = new Date();
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  var timeStr = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
  HWS.unshift({ name: name, req: req || '完成作业要求内容', time: timeStr, progress: '0/12', status: '进行中' });
  renderTable();
  closeModal();
  document.getElementById('hwName').value = '';
  document.getElementById('hwReq').value = '';
  document.getElementById('hwDeadline').value = '';
  toast('📚 已向「' + cls + '」布置作业「' + esc(name) + '」（演示）');
}

/* ============ 初始化 ============ */
renderTable();
</script>
</body>
</html>
