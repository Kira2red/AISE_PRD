<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实践题批改 - 测评管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #EFF4FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-6 md:p-8">

    <div class="max-w-[1100px] mx-auto space-y-6">
        
        <!-- 顶部统计卡片 -->
        <div class="bg-white rounded-xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] p-8 text-center">
            <h1 class="text-2xl font-bold mb-6 text-slate-800 tracking-wide">Kira2026编程题test</h1>
            <div class="flex items-center justify-center gap-8 text-[13px] text-slate-600">
                <span>考生：kiratest25000575</span>
                <span>得分：<span class="font-mono">0</span></span>
                <span>限时：100分钟</span>
                <span>总分：50分</span>
                <span>批改状态：<span class="text-red-500">0题未批改</span></span>
            </div>
        </div>
        
        <!-- 下方批改主面板 -->
        <div class="bg-white rounded-xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden flex flex-col p-6 md:p-8 space-y-6">
            
            <!-- 题型 Title 通栏 -->
            <div class="bg-slate-50/70 px-8 py-5 -mx-8 -mt-8 mb-4 border-b border-slate-100">
                <h2 class="text-base font-bold text-slate-800">三、实践题(共1题；共计0分)</h2>
            </div>
            
            <!-- 题目区 -->
            <div class="mb-4">
                <h3 class="font-bold flex gap-1 mb-4 text-[15px]"><span class="font-black">4.</span> 实践题(0分)</h3>
                <p class="text-slate-700 text-sm leading-relaxed">我是一个实践题</p>
            </div>

            <!-- 数据作答区（包含新增的预览机制） -->
            <div class="bg-[#F8FAFD] rounded-xl p-8 border border-blue-50">
                <div class="text-red-500 mb-6 text-sm font-medium">回答错误</div>
                
                <div class="flex items-start text-sm">
                    <div class="font-bold text-slate-800 shrink-0">【答案】:无</div>
                    
                    <div class="flex items-start ml-8">
                        <div class="font-bold text-slate-800 shrink-0">你的答案是：</div>
                        <div class="flex flex-col ml-4 space-y-3 pt-0.5">
                            
                            <!-- 附件 1 可预览的 md 后缀 -->
                            <div class="flex items-center group">
                                <div class="font-bold text-slate-700 w-64 truncate">圣杯战争游戏测试_5轮模拟.md</div>
                                <div class="flex items-center gap-5 ml-4">
                                    <button class="text-blue-700 font-bold italic hover:underline hover:text-blue-800 cursor-pointer">下载</button>
                                    <!-- 新增：富媒体预览入口 -->
                                    <button onclick="openPreview('圣杯战争游戏测试_5轮模拟.md', 'md')" class="text-blue-700 font-bold italic hover:underline hover:text-blue-800 cursor-pointer flex items-center gap-1">
                                        <svg class="w-4 h-4 not-italic -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                        预览
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 附件 2 可预览的 HTML 后缀 -->
                            <div class="flex items-center group">
                                <div class="font-bold text-slate-700 w-64 truncate">ai-agent-capabilities.html</div>
                                <div class="flex items-center gap-5 ml-4">
                                    <button class="text-blue-700 font-bold italic hover:underline hover:text-blue-800 cursor-pointer">下载</button>
                                    <!-- 新增：富媒体预览入口 -->
                                    <button onclick="openPreview('ai-agent-capabilities.html', 'html')" class="text-blue-700 font-bold italic hover:underline hover:text-blue-800 cursor-pointer flex items-center gap-1">
                                        <svg class="w-4 h-4 not-italic -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                        预览
                                    </button>
                                </div>
                            </div>

                            <!-- 附件 3 不可直接预览的格式，仅作展示无预览按钮 -->
                            <div class="flex items-center group">
                                <div class="font-bold text-slate-700 w-64 truncate">最终项目打包代码源码.zip</div>
                                <div class="flex items-center gap-5 ml-4">
                                    <button class="text-blue-700 font-bold italic hover:underline hover:text-blue-800 cursor-pointer">下载</button>
                                    <span class="text-slate-400 text-xs italic opacity-60">格式暂不支持预览</span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                
                <div class="mt-10 font-bold text-sm text-slate-800">
                    【解析】
                </div>
            </div>

            <!-- 底部：教师判分区 -->
            <div class="flex gap-16 pt-8 pb-4">
                
                <!-- 左侧打分 -->
                <div class="space-y-6 shrink-0 w-[420px]">
                    <div class="flex items-center gap-6">
                        <div class="text-sm font-bold text-slate-700">最终得分： <span class="text-red-600 text-2xl px-1">0</span> <span class="font-normal text-slate-500">分</span></div>
                        <div class="w-px h-5 bg-slate-200"></div>
                        <div class="text-sm font-bold text-slate-700">系统判分： <span class="text-red-600 text-2xl px-1">0</span> <span class="font-normal text-slate-500">分/0分</span></div>
                    </div>
                    
                    <div class="flex items-center gap-4 text-sm font-bold text-slate-700">
                        <span>你的判分：</span>
                        <input type="text" class="border border-slate-300 rounded focus:border-blue-500 outline-none px-3 py-1.5 w-24 tabular-nums font-mono">
                        <input type="radio" class="w-4 h-4 ml-1 cursor-pointer border border-slate-300 rounded-full appearance-none checked:border-blue-500 checked:border-[5px] transition-all">
                    </div>
                    
                    <div class="flex items-center gap-3 pt-6">
                        <button class="bg-[#3B6FF4] hover:bg-blue-700 text-white px-7 py-1.5 rounded transition shadow-sm text-sm">保存</button>
                        <button class="bg-white border border-slate-200 border-dashed hover:border-slate-300 hover:bg-slate-50 text-slate-600 px-7 py-1.5 rounded transition text-sm">重置</button>
                    </div>
                </div>
                
                <!-- 右侧评语 -->
                <div class="flex-1 flex flex-col justify-end">
                    <textarea placeholder="评语" class="w-full h-full min-h-[140px] bg-white border border-slate-100 hover:border-slate-200 focus:border-blue-300 rounded shadow-[inset_0_2px_6px_rgba(0,0,0,0.01)] py-3 px-4 text-sm text-slate-700 outline-none transition resize-none"></textarea>
                </div>
            </div>
        </div>

    </div>

    <!-- 弹窗：文件预览查阅 Modal -->
    <div id="previewModal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
        <!-- 半透明遮罩层 -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px]" onclick="closePreview()"></div>
        
        <!-- 弹窗主体 -->
        <div class="relative w-11/12 max-w-5xl h-[85vh] bg-white rounded-xl shadow-2xl flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="previewModalBody">
            
            <!-- 弹窗 Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-white z-10 shrink-0">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    <h3 class="text-base font-bold text-slate-800" id="previewTitle">预览文件</h3>
                </div>
                
                <div class="flex items-center gap-4">
                    <button class="text-blue-600 text-sm font-bold flex items-center gap-1.5 hover:text-blue-800 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        下载源文件
                    </button>
                    <div class="w-px h-4 bg-slate-200"></div>
                    <button class="text-slate-400 hover:text-slate-700 transition" onclick="closePreview()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <!-- 数据阅读视区 -->
            <div class="flex-1 bg-slate-50 overflow-y-auto w-full custom-scroll relative p-6 flex flex-col" id="previewContent">
                <!-- 内部使用根据不同文件类型渲染不同的 Mock 占位视图 -->
                <div class="w-full flex-1 bg-white rounded shadow-sm border border-slate-200 p-8 font-mono text-sm text-slate-700 whitespace-pre-wrap flex items-center justify-center">
                    正在在线解析并加载安全预览视图...
                </div>
            </div>

        </div>
    </div>

    <!-- 交互脚本 -->
    <script>
        const modal = document.getElementById('previewModal');
        const modalBody = document.getElementById('previewModalBody');
        const previewTitle = document.getElementById('previewTitle');
        const previewContent = document.getElementById('previewContent');

        // 打开预览模态框
        function openPreview(fileName, type) {
            previewTitle.innerText = `[阅览] ${fileName}`;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // 触发动画
            setTimeout(() => {
                modalBody.classList.remove('scale-95', 'opacity-0');
                modalBody.classList.add('scale-100', 'opacity-100');
            }, 10);

            // 根据类型 Mock 不同的视图效果
            let mockHtml = '';
            if(type === 'md') {
                mockHtml = `
                    <div class="w-full bg-white rounded shadow-sm border border-slate-200 p-10 font-mono text-sm text-slate-700 mx-auto max-w-4xl">
                        <h1 class="text-2xl font-bold mb-4">🏆 圣杯战争游戏测试_5轮模拟</h1>
                        <p class="mb-4">以下是AI生成的第1-5轮角色出牌及对抗演算逻辑：</p>
                        <pre class="bg-gray-800 text-green-400 p-4 rounded mb-4 overflow-x-auto">
// Round 1 Trace Log
> Player Saber generated act: [Excalibur_Strike]
> Enemy Archer used: [Dodge]
[System] Roll dice: 8. Hit missed.</pre>
                        <ul class="list-disc pl-5 space-y-2 mb-4">
                           <li>模拟耗时: 124ms</li>
                           <li>核心内存: 34MB</li>
                        </ul>
                        <p class="text-slate-400 italic">-- 模拟分析结尾 --</p>
                    </div>`;
            } else if (type === 'html') {
                mockHtml = `
                    <div class="h-full w-full bg-white rounded shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                        <div class="bg-slate-100 h-8 border-b flex items-center px-4 shrink-0 text-xs text-slate-500 font-mono">
                            <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                            Secure iframe sandbox rendering
                        </div>
                        <div class="flex-1 flex items-center justify-center flex-col text-slate-400 space-y-4 bg-slate-50">
                            <svg class="w-16 h-16 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                            <p>这是一个 HTML 文档的内嵌渲染测试区域</p>
                        </div>
                    </div>`;
            } else {
                mockHtml = `
                    <div class="w-full flex-1 bg-white rounded shadow-sm border border-slate-200 p-8 font-mono text-sm text-slate-700 flex items-center justify-center">
                        在线解析视图加载成功
                    </div>`;
            }
            
            previewContent.innerHTML = mockHtml;
        }

        // 关闭预览模态框
        function closePreview() {
            modalBody.classList.remove('scale-100', 'opacity-100');
            modalBody.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
                previewContent.innerHTML = ''; // 清空内容降低内存占用
            }, 200); // 等待动画完成
        }

        // 支持 ESC 键关闭大弹窗
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && !modal.classList.contains('hidden')) {
                closePreview();
            }
        });
    </script>
</body>
</html>
