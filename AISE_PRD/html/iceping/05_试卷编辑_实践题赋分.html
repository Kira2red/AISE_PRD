<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱测评 - 试卷编辑 - 实践题赋分</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --bg-color: #F3F4F6;
            --surface-color: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --text-tertiary: #9CA3AF;
            --border-color: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Top Title Bar ===== */
        .title-bar {
            height: 56px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 20;
            flex-shrink: 0;
        }

        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .site-name {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-nav {
            display: flex;
            gap: 4px;
        }

        .top-nav-item {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .top-nav-item:hover {
            background-color: #F9FAFB;
            color: var(--text-primary);
        }

        .top-nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .title-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            background-color: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== Layout Body ===== */
        .layout-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-title {
            padding: 20px 20px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-list {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .nav-item {
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 2px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background-color: #F9FAFB;
        }

        .nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 80px;
        }

        button.btn {
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            gap: 6px;
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        button.btn-primary:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        button.btn-outline {
            border-color: var(--border-color);
            background-color: white;
            color: var(--text-secondary);
        }

        button.btn-outline:hover {
            border-color: var(--text-tertiary);
            color: var(--text-primary);
        }

        button.btn-sm {
            height: 30px;
            padding: 4px 12px;
            font-size: 0.8rem;
        }

        button.btn-danger-text {
            background: transparent;
            color: var(--danger);
        }

        button.btn-danger-text:hover {
            background: #FEF2F2;
        }

        /* ===== Paper Header ===== */
        .paper-header {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .paper-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .paper-name {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .paper-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .paper-meta-item {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .paper-meta-item span {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ===== Question Section ===== */
        .section-card {
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .section-header {
            padding: 16px 24px;
            background-color: #F9FAFB;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .section-score {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* ===== Question Item ===== */
        .q-item {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: background-color 0.15s;
        }

        .q-item:hover {
            background-color: #FAFBFC;
        }

        .q-item:last-child {
            border-bottom: none;
        }

        .q-number {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .q-body {
            flex: 1;
            min-width: 0;
        }

        .q-stem {
            font-size: 0.875rem;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .q-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .q-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .q-badge-type {
            background-color: #DBEAFE;
            color: #1E40AF;
        }

        .q-score {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
        }

        .q-actions {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            align-items: center;
        }

        .q-action-link {
            font-size: 0.875rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            font-weight: 500;
        }

        .q-action-link:hover {
            text-decoration: underline;
        }

        /* ===== Score Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            width: 600px;
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #F9FAFB;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .modal-body {
            padding: 24px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background-color: #F9FAFB;
        }

        /* Modal Internals */
        .score-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
        }

        .s-info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .s-info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .s-info-value {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .s-info-value.dynamic {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .form-input.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 2px #FEE2E2;
        }

        /* Dimensions */
        .dim-section {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
        }

        .dim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #F9FAFB;
            border-bottom: 1px solid var(--border-color);
        }

        .dim-title {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .dim-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dim-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .dim-row input.dim-name {
            flex: 1;
        }

        .dim-row input.dim-score {
            width: 100px;
            text-align: center;
        }

        .dim-summary {
            padding: 12px 16px;
            background: #F8FAFC;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .dim-warning {
            color: var(--danger);
            font-size: 0.8rem;
            display: none;
            margin-top: 8px;
        }

        .dim-warning.show {
            display: block;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.875rem;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <header class="title-bar">
        <div class="title-bar-left">
            <div class="site-name">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#4F46E5" />
                    <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#4F46E5" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                爱测评
            </div>
            <nav class="top-nav">
                <a class="top-nav-item" href="#">首页</a>
                <a class="top-nav-item active" href="#">测评管理</a>
                <a class="top-nav-item" href="#">测评报告</a>
            </nav>
        </div>
        <div class="title-bar-right">
            <div class="avatar">我</div>
        </div>
    </header>

    <div class="layout-body">
        <aside class="sidebar">
            <div class="sidebar-title">测评管理</div>
            <ul class="nav-list">
                <li class="nav-item"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg> 题目管理</li>
                <li class="nav-item active"><svg width="18" height="18" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg> 试卷库</li>
                <li class="nav-item"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg> 考试任务</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="content-body" id="scrollContainer">
                <div class="paper-header">
                    <div class="paper-title-row">
                        <div class="paper-name">2024 秋季招聘 - 综合能力卷（含实操）</div>
                        <div><button class="btn btn-primary btn-sm">保存</button></div>
                    </div>
                    <div class="paper-meta">
                        <div class="paper-meta-item">总分：<span id="pTotalScore">100</span> 分</div>
                        <div class="paper-meta-item">题目数量：<span>2</span> 道</div>
                    </div>
                </div>

                <div id="paperSections"></div>
            </div>
        </main>
    </div>

    <!-- Score Modal -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title">题目赋分</div>
            </div>
            <div class="modal-body">
                <!-- Data Display Grid -->
                <div class="score-info-grid">
                    <div class="s-info-item">
                        <span class="s-info-label">建议分值</span>
                        <span class="s-info-value" id="mSuggested">0</span>
                    </div>
                    <div class="s-info-item">
                        <span class="s-info-label">当前分值</span>
                        <span class="s-info-value" id="mCurrentInfo">0</span>
                    </div>
                    <div class="s-info-item"></div> <!-- spacer -->

                    <div class="s-info-item">
                        <span class="s-info-label">当前本题型总分</span>
                        <span class="s-info-value" id="mTypeCurrent">0</span>
                    </div>
                    <div class="s-info-item">
                        <span class="s-info-label">修改后本题型总分</span>
                        <span class="s-info-value dynamic" id="mTypeModified">0</span>
                    </div>
                    <div class="s-info-item"></div>

                    <div class="s-info-item">
                        <span class="s-info-label">当前试卷总分</span>
                        <span class="s-info-value" id="mPaperCurrent">0</span>
                    </div>
                    <div class="s-info-item">
                        <span class="s-info-label">修改后试卷总分</span>
                        <span class="s-info-value dynamic" id="mPaperModified">0</span>
                    </div>
                </div>

                <!-- Input -->
                <div class="form-group">
                    <label class="form-label">设定分值</label>
                    <input type="number" id="inputScore" class="form-input" min="0" oninput="handleScoreInput()">
                </div>

                <!-- Dimensions Section (Only for Practical Questions) -->
                <div id="dimensionsContainer" style="display: none;">
                    <label class="form-label">打分维度配置</label>
                    <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px;">
                        针对本道实践题，您可以拆解多个打分维度，各维度分值之和必须等于设定的本题分值。
                    </div>

                    <div class="dim-section">
                        <div class="dim-header">
                            <span class="dim-title">打分项列表</span>
                            <button class="btn btn-outline btn-sm" onclick="addDimension()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4"></path>
                                </svg>
                                添加维度
                            </button>
                        </div>
                        <div class="dim-list" id="dimList"></div>
                        <div class="dim-summary">
                            <span id="dimSumStatus">当前各维度总和：0 分</span>
                            <span id="dimTargetStatus">目标：0 分</span>
                        </div>
                    </div>
                    <div class="dim-warning" id="dimWarning">⚠️ 提示：各维度分值加和不等于设定的总分值。</div>
                </div>

            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="btnSave" onclick="saveScore()">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const MOCK_DATA = {
            paperTotal: 100,
            sections: [
                {
                    id: 's1',
                    title: '一、单选题',
                    questions: [
                        { id: 101, type: '单选题', stem: '测试单选', suggestedScore: 5, score: 5, isPractical: false }
                    ]
                },
                {
                    id: 's2',
                    title: '二、实践题',
                    questions: [
                        {
                            id: 102, type: '实践题',
                            stem: '请编写一段程序，实现冒泡排序，并写出时间和空间复杂度分析。',
                            suggestedScore: 30, score: 30, isPractical: true,
                            dimensions: [
                                { id: 'd1', name: '代码逻辑正确性', score: 15 },
                                { id: 'd2', name: '边界条件处理', score: 5 },
                                { id: 'd3', name: '复杂度分析准确性', score: 10 }
                            ]
                        }
                    ]
                }
            ]
        };

        // State for Modal
        let activeQ = null;
        let activeSection = null;
        let tempScore = 0;
        let tempDimensions = [];

        function renderPaper() {
            const container = document.getElementById('paperSections');
            container.innerHTML = '';
            let pTotal = 0;

            MOCK_DATA.sections.forEach((sec, sIdx) => {
                let secTotal = sec.questions.reduce((sum, q) => sum + q.score, 0);
                pTotal += secTotal;

                const card = document.createElement('div');
                card.className = 'section-card';

                let qHtml = sec.questions.map((q, qIdx) => `
                    <div class="q-item">
                        <div class="q-number">${qIdx + 1}</div>
                        <div class="q-body">
                            <div class="q-stem">${q.stem}</div>
                            <div class="q-info">
                                <span class="q-badge q-badge-type">${q.type}</span>
                                <span class="q-score">${q.score} 分</span>
                                ${q.isPractical && q.dimensions ? `<span style="font-size:0.75rem; color:var(--text-tertiary); margin-left:8px;">[包含 ${q.dimensions.length} 个打分维度]</span>` : ''}
                            </div>
                        </div>
                        <div class="q-actions">
                            <a class="q-action-link" onclick="openScoreModal('${sec.id}', ${q.id})">赋分</a>
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="section-header">
                        <div class="section-title">${sec.title}</div>
                        <div class="section-score">本大题总分 ${secTotal} 分</div>
                    </div>
                    ${qHtml}
                `;
                container.appendChild(card);
            });

            document.getElementById('pTotalScore').textContent = pTotal;
            MOCK_DATA.paperTotal = pTotal;
        }

        // ===== Modal Logic =====
        const modal = document.getElementById('scoreModal');
        const inputScore = document.getElementById('inputScore');
        const dimContainer = document.getElementById('dimensionsContainer');
        const dimList = document.getElementById('dimList');
        const btnSave = document.getElementById('btnSave');

        function getSectionTotal(secId) {
            const sec = MOCK_DATA.sections.find(s => s.id === secId);
            return sec.questions.reduce((sum, q) => sum + q.score, 0);
        }

        function openScoreModal(secId, qId) {
            activeSection = MOCK_DATA.sections.find(s => s.id === secId);
            activeQ = activeSection.questions.find(q => q.id === qId);

            tempScore = activeQ.score;

            // Set statics
            document.getElementById('mSuggested').textContent = activeQ.suggestedScore;
            document.getElementById('mCurrentInfo').textContent = activeQ.score;

            const currTypeTotal = getSectionTotal(secId);
            const currPaperTotal = MOCK_DATA.paperTotal;

            document.getElementById('mTypeCurrent').textContent = currTypeTotal;
            document.getElementById('mPaperCurrent').textContent = currPaperTotal;

            // Set input
            inputScore.value = tempScore;

            // Setup dimensions if practical
            if (activeQ.isPractical) {
                dimContainer.style.display = 'block';
                // Clone array
                tempDimensions = activeQ.dimensions ? activeQ.dimensions.map(d => ({ ...d })) : [];
                if (tempDimensions.length === 0) {
                    tempDimensions.push({ id: Date.now().toString(), name: '默认维度', score: tempScore });
                }
                renderDimensions();
            } else {
                dimContainer.style.display = 'none';
            }

            updateModalCalculations();
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            activeQ = null; activeSection = null;
        }

        function handleScoreInput() {
            const val = parseInt(inputScore.value) || 0;
            tempScore = val;
            updateModalCalculations();
        }

        function updateModalCalculations() {
            if (!activeQ) return;
            const diff = tempScore - activeQ.score;

            const currTypeTotal = getSectionTotal(activeSection.id);
            const currPaperTotal = MOCK_DATA.paperTotal;

            document.getElementById('mTypeModified').textContent = currTypeTotal + diff;
            document.getElementById('mPaperModified').textContent = currPaperTotal + diff;

            validateSave();
        }

        // ===== Dimensions Logic =====
        function renderDimensions() {
            dimList.innerHTML = '';
            tempDimensions.forEach((dim, index) => {
                const row = document.createElement('div');
                row.className = 'dim-row';
                row.innerHTML = `
                    <input type="text" class="form-input dim-name" value="${dim.name}" placeholder="维度名称" oninput="updateDimName('${dim.id}', this.value)">
                    <input type="number" class="form-input dim-score" value="${dim.score}" min="0" oninput="updateDimScore('${dim.id}', this.value)">
                    <button class="btn btn-sm btn-danger-text" onclick="removeDimension('${dim.id}')" ${tempDimensions.length === 1 ? 'disabled' : ''}>
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                dimList.appendChild(row);
            });
            validateSave();
        }

        function addDimension() {
            tempDimensions.push({ id: Date.now().toString(), name: '新维度', score: 0 });
            renderDimensions();
        }

        function removeDimension(id) {
            if (tempDimensions.length <= 1) return;
            tempDimensions = tempDimensions.filter(d => d.id !== id);
            renderDimensions();
        }

        function updateDimName(id, val) {
            const dim = tempDimensions.find(d => d.id === id);
            if (dim) dim.name = val;
            validateSave();
        }

        function updateDimScore(id, val) {
            const dim = tempDimensions.find(d => d.id === id);
            if (dim) dim.score = parseInt(val) || 0;
            validateSave();
        }

        function validateSave() {
            let isValid = true;
            const targetScore = parseInt(inputScore.value) || 0;

            // Validate score input
            if (targetScore <= 0) {
                isValid = false;
                inputScore.classList.add('error');
            } else {
                inputScore.classList.remove('error');
            }

            // Validate dimensions if practical
            if (activeQ && activeQ.isPractical) {
                const sum = tempDimensions.reduce((s, d) => s + d.score, 0);

                document.getElementById('dimSumStatus').textContent = `当前各维度总和：${sum} 分`;
                document.getElementById('dimTargetStatus').textContent = `目标：${targetScore} 分`;

                const warning = document.getElementById('dimWarning');

                // Check if all names are filled
                const allNamesFilled = tempDimensions.every(d => d.name.trim() !== '');

                if (sum !== targetScore || !allNamesFilled) {
                    isValid = false;
                    document.getElementById('dimSumStatus').style.color = 'var(--danger)';
                    warning.classList.add('show');
                    if (!allNamesFilled) {
                        warning.textContent = '⚠️ 提示：请填写完整所有维度的名称。';
                    } else {
                        warning.textContent = '⚠️ 提示：各维度分值加和不等于设定的总分值。';
                    }
                } else {
                    document.getElementById('dimSumStatus').style.color = 'var(--text-primary)';
                    warning.classList.remove('show');
                }
            }

            btnSave.disabled = !isValid;
        }

        function saveScore() {
            if (btnSave.disabled) return;

            activeQ.score = tempScore;
            if (activeQ.isPractical) {
                // Ensure array clone
                activeQ.dimensions = tempDimensions.map(d => ({ ...d }));
            }

            renderPaper();
            closeModal();
            showToast('赋分保存成功');
        }

        // Toast
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        // Init
        renderPaper();
    </script>
</body>

</html>
