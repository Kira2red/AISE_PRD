<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱测评 - 题目管理 - 题目详情</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --bg-color: #F3F4F6;
            --surface-color: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --text-tertiary: #9CA3AF;
            --border-color: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --process-blue: #0ea5e9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Top Title Bar ===== */
        .title-bar {
            height: 56px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 20;
            flex-shrink: 0;
        }

        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .site-name {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-nav {
            display: flex;
            gap: 4px;
        }

        .top-nav-item {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .top-nav-item:hover {
            background-color: #F9FAFB;
            color: var(--text-primary);
        }

        .top-nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .title-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            background-color: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== Layout Body ===== */
        .layout-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-title {
            padding: 20px 20px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-list {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .nav-item {
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 2px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background-color: #F9FAFB;
        }

        .nav-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 24px 32px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .breadcrumb {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 80px;
        }

        /* ===== Editor Card ===== */
        .editor-card {
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            max-width: 900px;
            margin: 0 auto;
        }

        .editor-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #F9FAFB;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .editor-title {
            font-weight: 600;
            font-size: 1.125rem;
        }

        .editor-body {
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .editor-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background-color: #F9FAFB;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* Forms */
        .form-row {
            display: flex;
            gap: 24px;
        }

        .form-group {
            flex: 1;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .form-label span.req {
            color: var(--danger);
            margin-left: 4px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            background-color: #fff;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .helper-text {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-top: 6px;
            line-height: 1.5;
        }

        /* Rich Text Mock */
        .rich-text-toolbar {
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            padding: 8px 12px;
            background: #F8FAFC;
            display: flex;
            gap: 8px;
        }

        .rt-btn {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .rt-btn:hover {
            background: #E2E8F0;
            color: var(--text-primary);
        }

        .rich-text-editor {
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            min-height: 120px;
            padding: 12px;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .rich-text-editor:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        /* Special TTS Section */
        .tts-section {
            background: #F0F9FF;
            border: 1px solid #BAE6FD;
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        .tts-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--process-blue);
            opacity: 0.5;
        }

        .tts-section .form-label {
            color: #0369A1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tts-section .form-textarea {
            border-color: #BAE6FD;
            min-height: 80px;
        }

        .tts-section .form-textarea:focus {
            border-color: var(--process-blue);
            box-shadow: 0 0 0 2px #E0F2FE;
        }

        .tts-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btn-play-tts {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--surface-color);
            border: 1px solid #BAE6FD;
            color: var(--process-blue);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-play-tts:hover {
            background-color: #E0F2FE;
            border-color: var(--process-blue);
        }

        /* Buttons */
        button.btn {
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            gap: 6px;
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        button.btn-outline {
            border-color: var(--border-color);
            background-color: white;
            color: var(--text-secondary);
        }

        button.btn-outline:hover {
            border-color: var(--text-tertiary);
            color: var(--text-primary);
        }

        /* Options Mock */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .opt-char {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .opt-item.is-correct .opt-char {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        svg.icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
    </style>
</head>

<body>

    <header class="title-bar">
        <div class="title-bar-left">
            <div class="site-name">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#4F46E5" />
                    <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#4F46E5" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                爱测评
            </div>
            <nav class="top-nav">
                <a class="top-nav-item" href="#">首页</a>
                <a class="top-nav-item active" href="#">测评管理</a>
                <a class="top-nav-item" href="#">测评报告</a>
            </nav>
        </div>
        <div class="title-bar-right">
            <div class="avatar">我</div>
        </div>
    </header>

    <div class="layout-body">
        <aside class="sidebar">
            <div class="sidebar-title">测评管理</div>
            <ul class="nav-list">
                <li class="nav-item active"><svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg> 题目管理</li>
                <li class="nav-item"><svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg> 试卷库</li>
                <li class="nav-item"><svg class="icon" viewBox="0 0 24 24">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg> 考试任务</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <div class="breadcrumb">
                    <a href="#">题目管理</a> <svg style="width:12px;height:12px;" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg> <span>题目详情</span>
                </div>
            </div>

            <div class="content-body">

                <div class="editor-card">
                    <div class="editor-header">
                        <div class="editor-title">编辑题目 (ID: 10245)</div>
                    </div>

                    <div class="editor-body">

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">题型<span class="req">*</span></label>
                                <select class="form-select" disabled>
                                    <option>单选题</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">难度<span class="req">*</span></label>
                                <select class="form-select">
                                    <option>中等</option>
                                    <option>困难</option>
                                    <option>简单</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">所属知识点</label>
                                <input type="text" class="form-input" value="计算机基础 / 操作系统">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">题干内容<span class="req">*</span></label>
                            <div>
                                <div class="rich-text-toolbar">
                                    <button class="rt-btn"><b>B</b></button>
                                    <button class="rt-btn"><i>I</i></button>
                                    <button class="rt-btn"><u>U</u></button>
                                    <div style="width:1px; background:var(--border-color); margin:0 4px;"></div>
                                    <button class="rt-btn"><svg class="icon">
                                            <path
                                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                                            </path>
                                        </svg></button>
                                    <button class="rt-btn"><svg class="icon">
                                            <path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                                        </svg></button>
                                </div>
                                <div class="rich-text-editor" contenteditable="true">
                                    在早期的计算机系统中，哪一项资源的分配策略容易导致被进程“饿死”（Starvation）现象？
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">选项配置<span class="req">*</span></label>
                            <div class="options-list">
                                <div class="opt-item is-correct">
                                    <div class="opt-char">A</div>
                                    <input type="text" class="form-input" value="SJF 短作业优先调度"
                                        style="border-color: var(--success); box-shadow: 0 0 0 1px var(--success);">
                                </div>
                                <div class="opt-item">
                                    <div class="opt-char">B</div>
                                    <input type="text" class="form-input" value="FCFS 先来先服务">
                                </div>
                                <div class="opt-item">
                                    <div class="opt-char">C</div>
                                    <input type="text" class="form-input" value="RR 时间片轮转">
                                </div>
                                <div class="opt-item">
                                    <div class="opt-char">D</div>
                                    <input type="text" class="form-input" value="HRRN 高响应比优先">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">解析说明</label>
                            <textarea class="form-textarea"
                                placeholder="填写解析详情...">短作业优先（SJF）调度算法虽然能使得平均周转时间最短，但如果系统中不断有短作业到来，会导致长作业长时间得不到调度，从而产生“饥饿”或“饿死”现象。</textarea>
                        </div>

                        <!-- 读题文本 (TTS) -->
                        <div class="form-group">
                            <label class="form-label"
                                style="display: flex; align-items: center; justify-content: space-between;">
                                <span>读题文本配置 (TTS)</span>
                                <button class="rt-btn" onclick="alert('🎧 [系统正在调用语音合成测试播放...]')"
                                    style="font-size: 0.8rem; font-weight: normal; color: var(--primary); display: flex; align-items: center; gap: 4px;">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path d="M7 4v16l13 -8z" fill="currentColor" />
                                    </svg>
                                    试听发音
                                </button>
                            </label>
                            <textarea class="form-textarea"
                                placeholder="请在此输入系统朗读的文案，如果不填则默认直接朗读原题干文本。如果题干中有图片或代码，建议填写针对听觉优化的转述文案。">同学们请听题，在早期的计算机系统中，哪一项资源的分配策略，容易导致被进程“饿死”现象？A选项，短作业优先调度算法。B选项，先来先服务算法...</textarea>
                            <p class="helper-text">学生在考试端点击“播放读题”时，系统将通过语音合成引擎朗读上方配置的纯文本内容。</p>
                        </div>

                    </div>

                    <div class="editor-footer">
                        <button class="btn btn-outline">取消并返回</button>
                        <button class="btn btn-primary" onclick="alert('题目保存成功！')">保存题目</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

</body>

</html>
