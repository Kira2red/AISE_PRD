<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱测评 - 教师管理</title>
<link rel="stylesheet" href="爱测评线上样式.css">
<style>
html, body { margin: 0; padding: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }

/* 线上容器：浅蓝渐变背景，左右顶满 */
.container {
  min-width: 1280px !important;
  background: linear-gradient(0deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.4) 100%), radial-gradient(158.01% 139.35% at 0% 0%, #D9F2FF 0%, #F2F0FC 27.87%, #BFD8FF 100%);
  min-height: 100vh;
}
/* 线上顶栏：透明+毛玻璃，64px，满宽 */
.header { height: 64px; width: 100%; position: sticky; top: 0; left: 0; backdrop-filter: blur(10px); background: rgba(0,0,0,0); }

/* 侧边栏 */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 200px; background: #fff; border-right: 1px solid #e8e8e8; padding-top: 76px; z-index: 10; }
.sidebar .ant-menu-inline { border-right: none; }

/* 内容区 */
.main-content-area { margin-left: 200px; padding: 24px; }
.common-radius { border-radius: 8px; }
.table-page-search-wrapper { background: #fff; }
.table-page-search-wrapper .cardHeader { display: flex; justify-content: space-between; align-items: center; }
.table-page-search-wrapper .cardHeader .title { font-size: 18px; font-weight: 600; color: #323335; margin: 0; }
.list-card { margin-top: 16px; }

/* 操作按钮行（线上 .table-operator） */
.table-operator { margin-bottom: 16px; display: flex; align-items: center; }
.op-divider { display: inline-block; width: 1px; height: 20px; background: #e8e8e8; margin: 0 12px; }

/* 表格 */
.ant-table { width: 100%; border-collapse: collapse; }
.ant-table th { background: #fafafa; font-size: 13px; font-weight: 600; color: #64666B; text-align: left; padding: 10px 12px; border-bottom: 1px solid #e8e8e8; }
.ant-table td { font-size: 13px; color: #323335; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2A55E5; cursor: pointer; vertical-align: middle; margin: 0; }
.op-link { color: #2A55E5; cursor: pointer; font-size: 13px; }
.op-link:hover { text-decoration: underline; }
.op-link-danger { color: #FF4D4F; cursor: pointer; font-size: 13px; }
.op-link-danger:hover { text-decoration: underline; }
.vd { display: inline-block; width: 1px; height: 12px; background: #e8e8e8; margin: 0 8px; vertical-align: middle; }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 16px; font-size: 13px; color: #64666B; }
.pagination .page-btn { min-width: 28px; height: 28px; line-height: 28px; text-align: center; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; background: #fff; padding: 0 6px; }
.pagination .page-btn.active { border-color: #2A55E5; color: #2A55E5; }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: none; }
.modal-box { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 480px; background: #fff; border-radius: 4px; }
.modal-title-row { padding: 16px 24px; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; }
.modal-title-row .t { font-size: 16px; font-weight: 600; color: #323335; }
.modal-title-row .x { cursor: pointer; color: #969AA0; }
.modal-body { padding: 24px; }
.form-item { display: flex; align-items: center; margin-bottom: 16px; }
.form-item .form-label { width: 90px; text-align: right; padding-right: 12px; font-size: 14px; color: #323335; flex-shrink: 0; }
.form-item .form-label .req { color: #f5222d; margin-right: 2px; }
.form-item .ant-input { flex: 1; height: 32px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; font-size: 14px; outline: none; }
.form-item .ant-input:focus { border-color: #2A55E5; }
.form-item .ant-select { flex: 1; position: relative; cursor: pointer; }
.modal-footer { padding: 10px 16px; border-top: 1px solid #e8e8e8; text-align: right; }
.demo-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 14px; z-index: 9999; display: none; }
</style>
</head>
<body>
<div class="demo-toast" id="demoToast"></div>
<div id="app" class="container">
  <!-- ===== 顶部导航 ===== -->
  <div style="position: sticky; top: 0; z-index: 999;">
    <div class="header">
      <div class="ant-row-flex ant-row-flex-middle" style="display:flex;align-items:center;">
        <div class="brand ant-col" style="flex: 0 0 300px; display:flex; align-items:center; padding-left:24px;">
          <img src="assets/logo.png" alt="logo" style="height:36px;">
          <div role="separator" class="ant-divider ant-divider-vertical"></div>
          <div class="levelLogo"><img src="assets/level-logo.png" alt="" style="height:30px;"></div>
        </div>
        <div class="menu ant-col" style="flex: 1 1 0%;">
          <ul role="menu" class="ant-menu ant-menu-horizontal ant-menu-root ant-menu-light">
            <li role="menuitem" class="ant-menu-item"><a href="#"><span>首页</span></a></li>
            <li role="menuitem" class="ant-menu-submenu ant-menu-submenu-horizontal ant-menu-submenu-selected"><div class="ant-menu-submenu-title"><span style="display:flex;align-items:center;cursor:pointer;"><span>测评管理</span></span><i class="ant-menu-submenu-arrow"></i></div></li>
            <li role="menuitem" class="ant-menu-item"><a href="#"><span>测评报告</span></a></li>
          </ul>

          <span style="font-size:14px;color:#323335;">AISE管理员</span>
          <i class="anticon anticon-down" style="color:#999;">▾</i>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <button type="button" class="ant-btn ant-btn-primary" style="border-radius:8px;background:rgb(42,85,229);width:184px;height:44px;margin:0 auto 12px;display:block;"><span>创建考试</span></button>
    <ul role="menu" class="ant-menu ant-menu-inline ant-menu-root ant-menu-light" style="width:calc(100% - 16px);margin-left:8px;">
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">🏠</i>首页</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="01_题目管理.html"><i class="iconfont">📋</i>题目管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">📄</i>试卷管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">📝</i>考试管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">📚</i>日常作业</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="#"><i class="iconfont">🏫</i>班级管理</a></li>
      <li role="menuitem" class="ant-menu-item ant-menu-item-selected" style="padding-left:24px;"><a href="21_教师管理.html"><i class="iconfont">👨‍🏫</i>教师管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="22_学生管理.html"><i class="iconfont">🧑‍🎓</i>学生管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="23_组织管理.html"><i class="iconfont">🏢</i>组织管理</a></li>
      <li role="menuitem" class="ant-menu-item" style="padding-left:24px;"><a href="24_回收站.html"><i class="iconfont">🗑</i>回收站</a></li>
    </ul>
  </aside>

  <!-- ===== 主内容 ===== -->
  <main class="ant-layout-content main-content-area">
    <div class="common-radius table-page-search-wrapper ant-card" style="padding:24px;">
      <div class="cardHeader"><h2 class="title">教师管理</h2></div>
    </div>

    <div class="common-radius list-card ant-card" style="padding:24px;background:#fff;">
      <!-- 操作按钮 -->
      <div class="table-operator">
        <button type="button" class="ant-btn ant-btn-primary" onclick="openTeacherModal()"><span>＋ 新增教师</span></button>
        <div role="separator" class="op-divider"></div>
        <button type="button" class="ant-btn ant-btn-danger" id="batchDelBtn" disabled onclick="batchDelete()"><span>批量删除</span></button>
      </div>

      <!-- 表格 -->
      <table class="ant-table">
        <thead>
          <tr>
            <th style="width:4%;"><input type="checkbox" id="chkAll" onchange="toggleAll(this)"></th>
            <th style="width:20%;">教师ID</th>
            <th style="width:10%;">教师姓名</th>
            <th style="width:18%;">手机号</th>
            <th style="width:12%;">登录账号</th>
            <th style="width:22%;">所属组织</th>
            <th style="width:8%;">角色</th>
            <th style="width:14%;text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>

      <!-- 分页 -->
      <div class="pagination">
        <span id="pageInfo">1-10 共10条</span>
        <span class="page-btn">‹</span>
        <span class="page-btn active">1</span>
        <span class="page-btn">›</span>
        <span>10 条/页</span>

<!-- 新增/编辑教师弹窗 -->
<div class="modal-mask" id="teacherModal">
  <div class="modal-box">
    <div class="modal-title-row"><span class="t" id="tmTitle">新增教师</span><span class="x" onclick="closeTeacherModal()">✕</span></div>
    <div class="modal-body">
      <div class="form-item"><span class="form-label"><span class="req">*</span>教师姓名</span><input type="text" class="ant-input" id="tmName" placeholder="请输入教师姓名"></div>
      <div class="form-item"><span class="form-label">手机号</span><input type="text" class="ant-input" id="tmPhone" placeholder="请输入手机号"></div>
      <div class="form-item"><span class="form-label"><span class="req">*</span>登录账号</span><input type="text" class="ant-input" id="tmAccount" placeholder="请输入登录账号"></div>
      <div class="form-item"><span class="form-label">角色</span>
        <div class="ant-select" onclick="toggleDropdown('roleDropdown')">
          <div class="ant-select-selection ant-select-selection--single">
            <div class="ant-select-selection__rendered"><div class="ant-select-selection__placeholder" id="roleVal">超级管理员</div></div>
          </div><span class="ant-select-arrow">▾</span>
          <div class="opt-dropdown" id="roleDropdown">
            <div class="kp-opt active" onclick="pickRole(this,'超级管理员')">超级管理员</div>
            <div class="kp-opt" onclick="pickRole(this,'老师')">老师</div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="ant-btn" onclick="closeTeacherModal()">取 消</button>
      <button type="button" class="ant-btn ant-btn-primary" style="margin-left:8px;" onclick="saveTeacher()">确 定</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ Mock 数据（基于线上真实列表） ============ */
var ROWS = [
  { id: '2078052878902693890', name: '签发中心账号', phone: '2078052878151405570', account: 'GSv9xQ494', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2071792493132320770', name: 'UXAX34', phone: '2071792492796272641', account: 'wslUH5483', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2071781682506698754', name: '刘伟', phone: '2071781682204205057', account: 'S56DfT482', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2071529024130715650', name: 'adminCert', phone: '2071529023425568769', account: 'IHY0WE481', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2070062812838301698', name: 's_123', phone: '2070062812628074497', account: 'm86amn480', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2070062719254990849', name: '原创s营', phone: '2070062718864408578', account: 'p7jauq479', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '1997854772056100865', name: 'aica管理者', phone: '', account: 'aicaAdmin', org: 'AISE青少年人工智能应用创新能力测评', role: '老师' },
  { id: '2057365244660486146', name: 'xiaoluadmin', phone: '2057365242030149634', account: 'gtnoIw92', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2057365023842963458', name: '小驴', phone: '2057365021279735809', account: 'BxHW8n91', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' },
  { id: '2043616522806038530', name: '测试api', phone: '2043616520704184322', account: 'Cn1EJc85', org: 'AISE青少年人工智能应用创新能力测评', role: '超级管理员' }
];

var editId = null;
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('demoToast');
  t.textContent = msg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }

/* ============ 表格渲染 ============ */
function renderTable() {
  var html = '';
  for (var i = 0; i < ROWS.length; i++) {
    var r = ROWS[i];
    html += '<tr data-id="' + esc(r.id) + '">' +
      '<td><input type="checkbox" class="row-chk" value="' + esc(r.id) + '" onchange="syncChk()"></td>' +
      '<td>' + esc(r.id) + '</td>' +
      '<td>' + esc(r.name) + '</td>' +
      '<td>' + (r.phone ? esc(r.phone) : '<span style="color:#bfbfbf;">-</span>') + '</td>' +
      '<td>' + esc(r.account) + '</td>' +
      '<td>' + esc(r.org) + '</td>' +
      '<td>' + esc(r.role) + '</td>' +
      '<td style="text-align:center;white-space:nowrap;">' +
        '<span class="op-link" onclick="openTeacherModal(\'' + esc(r.id) + '\')">编辑</span><span class="vd"></span>' +
        '<span class="op-link" onclick="toast(\'查看班级（演示）\')">查看班级</span><span class="vd"></span>' +
        '<span class="op-link" onclick="toast(\'查看学生（演示）\')">查看学生</span><span class="vd"></span>' +
        '<span class="op-link-danger" onclick="delRow(\'' + esc(r.id) + '\')">删除</span>' +
      '</td>' +
      '</tr>';
  }
  document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="8" style="text-align:center;color:#bfbfbf;padding:32px;">暂无数据</td></tr>';
  document.getElementById('pageInfo').textContent = ROWS.length ? ('1-' + ROWS.length + ' 共' + ROWS.length + '条') : '0 条';
  document.getElementById('chkAll').checked = false;
  syncChk();
}

/* ============ 选择 / 批量删除 ============ */
function toggleAll(el) {
  var boxes = document.querySelectorAll('.row-chk');
  for (var i = 0; i < boxes.length; i++) boxes[i].checked = el.checked;
  syncChk();
}
function syncChk() {
  var boxes = document.querySelectorAll('.row-chk');
  var n = 0;
  for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) n++;
  var btn = document.getElementById('batchDelBtn');
  btn.disabled = n === 0;
  btn.classList.toggle('ant-btn-disabled', n === 0);
  document.getElementById('chkAll').checked = boxes.length > 0 && n === boxes.length;
}
function batchDelete() {
  var boxes = document.querySelectorAll('.row-chk');
  var ids = [];
  for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) ids.push(boxes[i].value);
  if (!ids.length) return;
  ROWS = ROWS.filter(function (r) { return ids.indexOf(r.id) < 0; });
  renderTable();
  toast('已删除 ' + ids.length + ' 位教师（演示）');
}
function delRow(id) {
  ROWS = ROWS.filter(function (r) { return r.id !== id; });
  renderTable();
  toast('删除成功（演示）');
}

/* ============ 新增/编辑弹窗 ============ */
function toggleDropdown(id) {
  document.querySelectorAll('.opt-dropdown').forEach(function (d) { if (d.id !== id) d.style.display = 'none'; });
  var dd = document.getElementById(id);
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
function pickRole(el, val) {
  document.getElementById('roleVal').textContent = val;
  document.getElementById('roleVal').style.color = '#323335';
  var dd = document.getElementById('roleDropdown');
  dd.querySelectorAll('.kp-opt').forEach(function (o) { o.classList.remove('active'); });
  el.classList.add('active');
  dd.style.display = 'none';
}
document.addEventListener('click', function (e) {
  if (!e.target.closest('.ant-select')) {
    document.querySelectorAll('.opt-dropdown').forEach(function (d) { d.style.display = 'none'; });
  }
});
function openTeacherModal(id) {
  editId = id || null;
  var r = id ? ROWS.filter(function (x) { return x.id === id; })[0] : null;
  document.getElementById('tmTitle').textContent = r ? '编辑教师' : '新增教师';
  document.getElementById('tmName').value = r ? r.name : '';
  document.getElementById('tmPhone').value = r ? r.phone : '';
  document.getElementById('tmAccount').value = r ? r.account : '';
  var role = r ? r.role : '超级管理员';
  document.getElementById('roleVal').textContent = role;
  document.getElementById('roleVal').style.color = '#323335';
  document.getElementById('teacherModal').style.display = '';
}
function closeTeacherModal() { document.getElementById('teacherModal').style.display = 'none'; }
function saveTeacher() {
  var name = document.getElementById('tmName').value.trim();
  var account = document.getElementById('tmAccount').value.trim();
  if (!name) { toast('请输入教师姓名'); return; }
  if (!account) { toast('请输入登录账号'); return; }
  var role = document.getElementById('roleVal').textContent;
  if (editId) {
    var r = ROWS.filter(function (x) { return x.id === editId; })[0];
    r.name = name; r.phone = document.getElementById('tmPhone').value.trim(); r.account = account; r.role = role;
    toast('修改成功（演示）');
  } else {
    ROWS.unshift({ id: '209' + String(Date.now()), name: name, phone: document.getElementById('tmPhone').value.trim(), account: account, org: 'AISE青少年人工智能应用创新能力测评', role: role });
    toast('新增教师成功（演示）');
  }
  closeTeacherModal();
  renderTable();
}

/* ============ 初始化 ============ */
renderTable();
</script>
</body>
</html>
