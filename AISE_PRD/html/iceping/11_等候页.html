<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>候考等候页 - 爱测评</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #e8f0ec;
            background-image: radial-gradient(circle, rgba(100,140,120,0.12) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .wait-wrap { width: 720px; max-width: 100%; }
        .card {
            background: #fff; border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            padding: 36px 44px;
        }

        .exam-name {
            font-size: 22px; font-weight: 700; color: #1f2329;
            text-align: center; margin-bottom: 6px;
        }
        .exam-sub {
            text-align: center; color: #8a8f99; font-size: 13px; margin-bottom: 26px;
        }

        /* 状态标识 */
        .status-row {
            display: flex; justify-content: center; gap: 24px; margin-bottom: 30px;
        }
        .status-item {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 13px; color: #374151; font-weight: 500;
        }
        .status-item .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; position: relative;
        }
        .status-item .dot::after {
            content: ''; position: absolute; inset: -4px;
            border-radius: 50%; border: 1px solid #22c55e; opacity: 0.5;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.6; } 70% { transform: scale(1.4); opacity: 0; } 100% { opacity: 0; } }

        /* 倒计时 */
        .countdown-box {
            text-align: center; padding: 22px 0 26px;
            border-top: 1px dashed #e5e7eb; border-bottom: 1px dashed #e5e7eb;
            margin-bottom: 24px;
        }
        .countdown-label { font-size: 13px; color: #8a8f99; margin-bottom: 10px; }
        .countdown-num {
            font-size: 56px; font-weight: 300; color: #1f2329;
            font-variant-numeric: tabular-nums; letter-spacing: 2px;
        }
        .countdown-num .unit { font-size: 22px; color: #9ca3af; margin-left: 4px; font-weight: 400; }
        .start-time { font-size: 13px; color: #6b7280; margin-top: 10px; }

        /* 考试信息 */
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px;
            margin-bottom: 20px;
        }
        .info-item { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
        .info-item .k { color: #9ca3af; flex-shrink: 0; }
        .info-item .v { color: #374151; font-weight: 500; }

        /* 考生须知 */
        .notice {
            background: #f8fafc; border: 1px solid #eef2f7;
            border-radius: 10px; padding: 14px 16px; margin-bottom: 20px;
        }
        .notice .t { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .notice ul { padding-left: 18px; }
        .notice li { font-size: 12px; color: #6b7280; line-height: 1.9; }
        .notice li.warn { color: #b45309; }

        /* 离开提示 */
        .leave-tip {
            text-align: center; font-size: 12px; color: #b45309;
            background: #fffbeb; border: 1px solid #fde68a;
            border-radius: 8px; padding: 8px 12px; margin-bottom: 22px;
        }

        /* 开始考试按钮 */
        .start-btn {
            display: none; width: 100%;
            padding: 14px 0; border: none; border-radius: 10px;
            background: #2563eb; color: #fff;
            font-size: 17px; font-weight: 600; cursor: pointer;
            box-shadow: 0 6px 20px rgba(37,99,235,0.35);
            transition: background 0.2s;
        }
        .start-btn:hover { background: #1d4ed8; }
        .start-btn.show { display: block; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 等待提示 */
        .waiting-tip {
            display: block; text-align: center;
            font-size: 13px; color: #9ca3af; margin-top: 14px;
        }
        .waiting-tip.hide { display: none; }

        /* 演示控制条 */
        .demo-bar {
            position: fixed; bottom: 16px; right: 16px; z-index: 200;
            background: rgba(15,23,42,0.85); color: #e2e8f0;
            border-radius: 10px; padding: 10px 14px;
            font-size: 12px; display: flex; align-items: center; gap: 10px;
        }
        .demo-bar button {
            background: rgba(255,255,255,0.15); color: #fff;
            border: 1px solid rgba(255,255,255,0.25); border-radius: 6px;
            padding: 4px 10px; font-size: 12px; cursor: pointer;
        }
        .demo-bar button:hover { background: rgba(255,255,255,0.3); }
        /* 窄屏适配 */
        @media (max-width: 640px) {
            .card { padding: 24px 20px; }
            .countdown-num { font-size: 40px; }
            .info-grid { grid-template-columns: 1fr; }
            .status-row { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="wait-wrap">
        <div class="card">

            <div class="exam-name">0730 test</div>
            <div class="exam-sub">2026 夏季 · 一级等级测评 · 考场 A</div>

            <div class="status-row">
                <div class="status-item"><span class="dot"></span>设备检测已通过</div>
                <div class="status-item"><span class="dot"></span>检录已完成</div>
            </div>

            <div class="countdown-box">
                <div class="countdown-label">距离开考还有</div>
                <div class="countdown-num"><span id="cd-num">09:59</span></div>
                <div class="start-time">考试开始时间：2026-08-09 20:00:00</div>
            </div>

            <div class="info-grid">
                <div class="info-item"><span class="k">考试时长</span><span class="v">60 分钟</span></div>
                <div class="info-item"><span class="k">交卷限制</span><span class="v">开考 15 分钟后可交卷</span></div>
            </div>

            <div class="notice">
                <div class="t">考生须知</div>
                <ul>
                    <li>考试期间请保持摄像头和录屏开启，不要离开答题页面</li>
                    <li>开考后点击「开始考试」直接进入答题，无需重复检测设备</li>
                    <li>如遇设备异常，请及时联系客服处理</li>
                </ul>
            </div>

            <div class="leave-tip">
                <i class="fa-solid fa-triangle-exclamation"></i>
                请勿关闭或刷新本页面，离开后需重新进入候考流程
            </div>

            <button class="start-btn" id="start-btn" onclick="startExam()">
                <i class="fa-solid fa-arrow-right"></i> 开始考试
            </button>
            <div class="waiting-tip" id="waiting-tip">等待开考，请勿离开</div>

        </div>
    </div>

    <div class="demo-bar">
        <span>演示控制：</span>
        <button onclick="jump(60)">快进 1 分钟</button>
        <button onclick="jump(600)">快进 10 分钟</button>
        <button onclick="resetTimer()">重置倒计时</button>
    </div>

    <script>
        // 倒计时：模拟 10 分钟（正式环境由服务端下发剩余秒数）
        var totalSeconds = 10 * 60;
        var timer = null;
        var examStarted = false;

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function render() {
            var m = Math.floor(totalSeconds / 60);
            var s = totalSeconds % 60;
            document.getElementById('cd-num').textContent = pad(m) + ':' + pad(s);
        }

        function tick() {
            if (totalSeconds <= 0) {
                clearInterval(timer);
                examStarted = true;
                document.getElementById('cd-num').textContent = '00:00';
                document.getElementById('start-btn').classList.add('show');
                document.getElementById('waiting-tip').classList.add('hide');
                return;
            }
            totalSeconds--;
            render();
        }

        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(tick, 1000);
        }

        function jump(sec) {
            if (examStarted) return;
            totalSeconds = Math.max(0, totalSeconds - sec);
            render();
            if (totalSeconds <= 0) tick();
        }

        function resetTimer() {
            examStarted = false;
            totalSeconds = 10 * 60;
            document.getElementById('start-btn').classList.remove('show');
            document.getElementById('waiting-tip').classList.remove('hide');
            render();
            startTimer();
        }

        function startExam() { location.href = '../exam/03_答题页_选择填空判断.html'; }

        render();
        startTimer();
    </script>
</body>
</html>
