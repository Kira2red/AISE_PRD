<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { brand: { 50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8' } },
    boxShadow: { 'card':'0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px 0 rgba(0,0,0,.06)','popover':'0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05)' }
} } }
</script>
<style>
body { background-color:#F8FAFC; }
.custom-scroll::-webkit-scrollbar{width:6px;height:6px}
.custom-scroll::-webkit-scrollbar-thumb{background-color:#cbd5e1;border-radius:3px}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:24px;background-color:#3b82f6;border-radius:0 4px 4px 0}
tr.hover-row:hover td{background-color:#f8fafc}
.modal-enter{animation:modalFadeIn .2s ease-out forwards}
@keyframes modalFadeIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500;line-height:16px;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
input[type=checkbox].cb{width:15px;height:15px;accent-color:#2563eb;cursor:pointer}
.tag-chip{display:inline-block;background:#eff6ff;color:#2563eb;padding:1px 6px;border-radius:4px;font-size:10px;margin-right:2px}
#toastBox{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.lock-ico{color:#f59e0b}
</style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800 font-sans">

<aside class="w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-20">
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
        <div class="w-8 h-8 bg-gradient-to-br from-brand-600 to-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg mr-3 shadow-sm">A</div>
        <span class="font-bold text-lg text-slate-800 tracking-tight">AISE Admin</span>
    </div>
    <nav class="flex-1 overflow-y-auto py-4 space-y-1 custom-scroll">
        <a href="03_测评活动列表.html" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative"><i class="fa-solid fa-graduation-cap w-5 text-center"></i><span class="font-medium text-sm">测评管理</span></a>
        <a href="32_活动管理.html" class="nav-item active flex items-center gap-3 px-6 py-3 text-brand-600 bg-brand-50 transition relative"><i class="fa-solid fa-calendar-days w-5 text-center"></i><span class="font-medium text-sm">活动管理</span></a>
        <a href="13_标签配置.html" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative"><i class="fa-solid fa-tags w-5 text-center"></i><span class="font-medium text-sm">标签配置</span></a>
        <a href="06_测评组管理.html" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i><span class="font-medium text-sm">测评组管理</span></a>
        <div class="px-6 py-2 mt-4 text-xs font-bold text-slate-400 uppercase tracking-wider">运营中心</div>
        <a href="02_渠道管理.html" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative"><i class="fa-solid fa-handshake w-5 text-center"></i><span class="font-medium text-sm">渠道管理</span></a>
        <div class="px-6 py-2 mt-4 text-xs font-bold text-slate-400 uppercase tracking-wider">考务与用户</div>
        <a href="12_考生管理.html" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative"><i class="fa-solid fa-users w-5 text-center"></i><span class="font-medium text-sm">考生管理</span></a>
        <a href="19_消息中心.html" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative"><i class="fa-solid fa-bell w-5 text-center"></i><span class="font-medium text-sm">消息中心</span></a>
    </nav>
</aside>

<main class="flex-1 flex flex-col min-w-0 bg-slate-50/50 relative overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-10">
        <div class="flex items-center gap-3 min-w-0">
            <a href="32_活动管理.html" class="text-slate-400 hover:text-brand-600"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800 truncate" id="hName">活动详情</h1>
            <span class="text-xs text-slate-400 font-mono" id="hId"></span>
            <span class="text-xs text-slate-500" id="hMeta"></span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="exportCsv()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-download mr-1"></i>导出当前结果</button>
            <button onclick="openBatchCreate()" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition flex items-center gap-2"><i class="fa-solid fa-layer-plus"></i> 批量创建考试</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="px-8 pt-6 flex-shrink-0"><div class="grid grid-cols-5 gap-4" id="statCards"></div></div>
        <div class="px-8 py-4 flex-shrink-0">
            <div class="bg-white rounded-xl shadow-card border border-slate-100 p-4 flex flex-wrap gap-3 items-center">
                <select id="fChannel" onchange="fillGroups();renderTable()" class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 bg-white focus:border-brand-500 outline-none"></select>
                <select id="fGroup" onchange="renderTable()" class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 bg-white focus:border-brand-500 outline-none"></select>
                <select id="fStatus" onchange="renderTable()" class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 bg-white focus:border-brand-500 outline-none">
                    <option value="">爱测评状态：全部</option><option>已创建</option><option>创建中</option><option>未关联</option><option>创建失败</option>
                </select>
                <select id="fExam" onchange="renderTable()" class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 bg-white focus:border-brand-500 outline-none">
                    <option value="">考试进度：全部</option><option value="notstart">未开考</option><option value="ongoing">进行中</option><option value="ended">已结束</option>
                </select>
                <button onclick="resetFilter()" class="text-sm text-slate-400 hover:text-brand-600 px-2"><i class="fa-solid fa-rotate-left mr-1"></i>重置</button>
            </div>
        </div>
        <div class="px-8 pb-6 flex-1 flex flex-col overflow-hidden min-h-0">
            <div class="bg-white rounded-xl shadow-card border border-slate-100 flex-1 flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-slate-500">已选 <b class="text-brand-600" id="selCount">0</b> 行</span>
                        <button id="btnBatch" onclick="openBatchModal()" disabled class="bg-brand-600 disabled:bg-slate-300 disabled:cursor-not-allowed hover:bg-brand-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-2"><i class="fa-solid fa-pen-to-square"></i> 批量修改</button>
                        <span class="text-xs text-slate-400">单条能改的字段均可批量改；考试开始/结束后锁定考试要素，已有报名禁改起止时间</span>
                    </div>
                </div>
                <div class="flex-1 overflow-auto custom-scroll">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50/80 sticky top-0 z-10 text-xs text-slate-500">
                            <tr class="border-b border-slate-200">
                                <th class="py-3 px-3 w-10"><input type="checkbox" class="cb" id="cbAll" onchange="toggleAll(this.checked)"></th>
                                <th class="py-3 px-3 text-left font-semibold">渠道</th>
                                <th class="py-3 px-3 text-left font-semibold">分组</th>
                                <th class="py-3 px-3 text-left font-semibold">考试</th>
                                <th class="py-3 px-3 text-left font-semibold">关联试卷</th>
                                <th class="py-3 px-3 text-left font-semibold sortable" onclick="sortBy('examStart')">考试时间 <i class="fa-solid fa-sort text-slate-300"></i></th>
                                <th class="py-3 px-3 text-left font-semibold">时长</th>
                                <th class="py-3 px-3 text-left font-semibold">交卷限制</th>
                                <th class="py-3 px-3 text-left font-semibold sortable" onclick="sortBy('fee')">报名费 <i class="fa-solid fa-sort text-slate-300"></i></th>
                                <th class="py-3 px-3 text-left font-semibold">前端展示时间</th>
                                <th class="py-3 px-3 text-left font-semibold">展示</th>
                                <th class="py-3 px-3 text-left font-semibold">监考配置</th>
                                <th class="py-3 px-3 text-left font-semibold">模拟考</th>
                                <th class="py-3 px-3 text-left font-semibold">爱测评状态</th>
                                <th class="py-3 px-3 text-left font-semibold sortable" onclick="sortBy('enrolled')">报名量 <i class="fa-solid fa-sort text-slate-300"></i></th>
                                <th class="py-3 px-3 text-left font-semibold">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div class="px-4 py-2 border-t border-slate-100 text-xs text-slate-400 flex-shrink-0 flex justify-between" id="footInfo"></div>
            </div>
        </div>
    </div>
</main>
<div id="toastBox"></div>
<div id="modalRoot"></div>
<script src="exam_board_data.js"></script>
<script>
/* ============ 活动上下文 ============ */
let ACT_ID = null;
const act = () => { if(!ACT_ID){ loadData(); ACT_ID = new URLSearchParams(location.search).get('act') || acts[0].id; } return acts.find(a=>a.id===ACT_ID) || acts[0]; };
function actRows(){ return rows.filter(r=>r.actId===act().id); }
const $ = id => document.getElementById(id);

/* ============ 头部与统计 ============ */
function renderHead(){
  const a = act();
  $('hName').textContent = a.name; $('hId').textContent = a.id;
  const ph = {notstart:'未开始',ongoing:'进行中',ended:'已结束'}[actPhase(a)];
  $('hMeta').textContent = a.start+' ~ '+a.end+' · '+ph;
}
function renderStats(){
  const rs = actRows();
  const chs = new Set(rs.map(r=>r.cid)).size, enrolled = rs.reduce((s,r)=>s+(+r.enrolled||0),0);
  const cards = [
    {label:'考试场次', v:rs.length, sub:'关联行数', c:'text-slate-800'},
    {label:'已创建', v:rs.filter(r=>r.status==='已创建').length, sub:'爱测评就绪', c:'text-emerald-600'},
    {label:'创建中/未关联', v:rs.filter(r=>r.status==='创建中').length+'/'+rs.filter(r=>r.status==='未关联').length, sub:'待完成链路', c:'text-amber-600'},
    {label:'参与渠道', v:chs, sub:'有考试关联', c:'text-brand-600'},
    {label:'报名量', v:enrolled, sub:'本活动累计', c:'text-emerald-600'},
  ];
  $('statCards').innerHTML = cards.map(c=>`<div class="bg-white rounded-xl shadow-card border border-slate-100 p-4">
    <div class="text-xs text-slate-400 mb-1">${c.label}</div><div class="text-2xl font-bold ${c.c}">${c.v}</div><div class="text-xs text-slate-400 mt-1">${c.sub}</div></div>`).join('');
}

/* ============ 筛选/排序/表格 ============ */
function fillChannel(){
  $('fChannel').innerHTML = '<option value="">全部渠道</option>' + CHANNEL_LIST.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'（'+c.id+'）</option>').join('');
}
function fillGroups(){
  const c = $('fChannel').value, cur = $('fGroup').value;
  const gs = [...new Set(actRows().filter(r=>!c||r.cid===c).map(r=>r.group))];
  $('fGroup').innerHTML = '<option value="">全部分组</option>'+gs.map(g=>'<option>'+esc(g)+'</option>').join('');
  if(gs.includes(cur)) $('fGroup').value = cur;
}
let sortKey=null, sortDir=1;
function sortBy(k){ if(sortKey===k){sortDir*=-1;}else{sortKey=k;sortDir=1;} renderTable(); }
function filterRows(){
  const fc=$('fChannel').value, fg=$('fGroup').value, fs=$('fStatus').value, fe=$('fExam').value;
  return actRows().filter(r=>{
    if(fc&&r.cid!==fc) return false;
    if(fg&&r.group!==fg) return false;
    if(fs&&r.status!==fs) return false;
    if(fe&&examPhase(r)!==fe) return false;
    return true;
  });
}
function renderTable(){
  let list = filterRows();
  if(sortKey==='examStart') list=[...list].sort((a,b)=>sortDir*(a.examStart<b.examStart?-1:1));
  if(sortKey==='fee') list=[...list].sort((a,b)=>sortDir*((+a.fee)-(+b.fee)));
  if(sortKey==='enrolled') list=[...list].sort((a,b)=>sortDir*((+a.enrolled)-(+b.enrolled)));
  $('tbody').innerHTML = list.map(r=>{
    const k=esc(r._k), phase=examPhase(r);
    const phasePill = phase==='ended'?'<span class="pill bg-slate-100 text-slate-400">已结束</span>':phase==='ongoing'?'<span class="pill bg-blue-50 text-blue-600">进行中</span>':'';
    const tags=(r.tags||[]).map(t=>'<span class="tag-chip">'+esc(t)+'</span>').join('');
    return '<tr class="border-b border-slate-100 hover-row">'
      +'<td class="py-2.5 px-3"><input type="checkbox" class="cb rowcb" data-k="'+k+'" onchange="onRowCb()"></td>'
      +'<td class="py-2.5 px-3">'+esc(chName(r.cid))+'<div class="text-xs text-slate-400 font-mono">'+esc(r.cid)+'</div></td>'
      +'<td class="py-2.5 px-3">'+(r.group==='默认'?'<span class="pill bg-slate-100 text-slate-500">默认</span>':esc(r.group))+'</td>'
      +'<td class="py-2.5 px-3 font-medium">'+esc(r.name)+'<div class="text-xs text-slate-400 font-mono">'+esc(r.aid)+'</div><div class="mt-0.5">'+tags+'</div></td>'
      +'<td class="py-2.5 px-3">'+(r.paper?esc(r.paper):'<span class="text-slate-300">未关联</span>')+'</td>'
      +'<td class="py-2.5 px-3 text-xs">'+fmtExamTime(r)+' '+phasePill+'</td>'
      +'<td class="py-2.5 px-3">'+r.duration+'分</td>'
      +'<td class="py-2.5 px-3">'+r.submitLimit+'分</td>'
      +'<td class="py-2.5 px-3 font-medium">¥'+r.fee+'</td>'
      +'<td class="py-2.5 px-3 text-xs">'+fmtShowTime(r)+'</td>'
      +'<td class="py-2.5 px-3">'+(r.show?'<span class="pill bg-emerald-50 text-emerald-600">展示中</span>':'<span class="pill bg-slate-100 text-slate-500">隐藏</span>')+'</td>'
      +'<td class="py-2.5 px-3 text-xs max-w-[220px]"><div class="truncate" title="'+esc(proBrief(r.pro))+'">'+esc(proBrief(r.pro))+'</div></td>'
      +'<td class="py-2.5 px-3 text-xs">'+mockBrief(r.mock)+'</td>'
      +'<td class="py-2.5 px-3">'+statusPill(r.status)+(r.status==='创建失败'?'<div class="text-xs text-red-400 mt-0.5">'+esc(r.failReason||'')+'</div>':'')+'</td>'
      +'<td class="py-2.5 px-3">'+(r.enrolled>0?'<b>'+r.enrolled+'</b>':'<span class="text-slate-300">0</span>')+'</td>'
      +'<td class="py-2.5 px-3 whitespace-nowrap">'
        +(r.status==='创建失败'?'<button onclick="retryRow(\''+k+'\')" class="text-brand-600 hover:text-brand-700 text-xs font-medium mr-2"><i class="fa-solid fa-rotate-right"></i> 重试</button>':'')
        +(r.status==='未关联'?'<button onclick="linkPaper(\''+k+'\')" class="text-brand-600 hover:text-brand-700 text-xs font-medium mr-2"><i class="fa-solid fa-link"></i> 补关联</button>':'')
        +'<button onclick="viewRow(\''+k+'\')" class="text-slate-500 hover:text-brand-600 text-xs mr-2"><i class="fa-solid fa-eye"></i> 详情</button>'
      +'</td></tr>';
  }).join('') || '<tr><td colspan="16" class="text-center text-slate-400 py-12">本活动暂无考试，点击右上角「批量创建考试」开始配置</td></tr>';
  $('footInfo').innerHTML = '<span>共 '+list.length+' 行（本活动 '+actRows().length+' 行）</span><span>已选 <b id="footSel">'+selKeys().length+'</b> 行</span>';
  syncSelState();
}
function resetFilter(){ $('fChannel').value=''; fillGroups(); $('fStatus').value=''; $('fExam').value=''; renderTable(); }
function renderAll(){ renderHead(); renderStats(); fillChannel(); fillGroups(); renderTable(); }

/* ============ 勾选 ============ */
function selKeys(){ const out=[]; document.querySelectorAll('.rowcb').forEach(c=>{ if(c.checked) out.push(c.dataset.k); }); return out; }
function onRowCb(){ syncSelState(); }
function syncSelState(){ const n=selKeys().length; $('selCount').textContent=n; $('btnBatch').disabled=n===0; const f=$('footSel'); if(f) f.textContent=n; }
function toggleAll(v){ document.querySelectorAll('.rowcb').forEach(c=>c.checked=v); syncSelState(); }

/* ============ 行操作 ============ */
function retryRow(k){ const r=rows.find(x=>x._k===k); if(!r) return; r.status='创建中'; saveData(); renderAll();
  setTimeout(()=>{ r.status='已创建'; delete r.failReason; saveData(); renderAll(); toast('重试成功：爱测评考试已创建（'+r.name+'）'); }, 1600); }
function linkPaper(k){ const r=rows.find(x=>x._k===k); if(!r) return;
  openModalHtml('<div class="max-w-md w-full bg-white rounded-xl shadow-popover modal-enter p-6"><div class="font-bold mb-4">补关联爱测评试卷</div>'
   +'<div class="text-sm text-slate-500 mb-3">'+esc(r.name)+'<span class="text-xs font-mono text-slate-400 ml-2">'+esc(r.aid)+'</span></div>'
   +'<select id="lpPaper" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-4">'+PAPER_LIST.map(p=>'<option>'+p+'</option>').join('')+'</select>'
   +'<div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">取消</button>'
   +'<button onclick="doLinkPaper(\''+k+'\')" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white">保存并自动创建</button></div></div>'); }
function doLinkPaper(k){ const r=rows.find(x=>x._k===k); r.paper=$('lpPaper').value; r.status='创建中'; saveData(); renderAll(); closeModal();
  setTimeout(()=>{ r.status='已创建'; saveData(); renderAll(); toast('补关联成功：爱测评考试已创建'); }, 1600); }
function viewRow(k){
  const r=rows.find(x=>x._k===k); if(!r) return;
  const lock=lockSetOf(r);
  const li=(lab,val,field)=>{ const lk=lock.has(field); return '<div class="flex items-start gap-2 py-1.5 text-sm"><span class="text-slate-400 w-28 flex-shrink-0">'+lab+'</span><span class="flex-1">'+val+'</span>'+(lk?' <i class="fa-solid fa-lock text-amber-500 text-xs" title="考试已开始/结束或已有报名，该字段不可修改"></i>':'')+'</div>'; };
  $('modalRoot').innerHTML='<div class="fixed inset-0 z-50 flex justify-end">'
   +'<div class="absolute inset-0 bg-slate-900/40" onclick="closeModal()"></div>'
   +'<div class="relative w-[560px] bg-white h-full shadow-popover modal-enter flex flex-col">'
   +'<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"><div class="font-bold">'+esc(r.name)+'<span class="text-xs text-slate-400 font-mono ml-2">'+esc(r.aid)+'</span></div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>'
   +'<div class="flex-1 overflow-y-auto custom-scroll px-6 py-4 space-y-5">'
     +'<div><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">渠道关联</div>'
       +li('渠道', esc(chName(r.cid))+'（'+esc(r.cid)+'）')+li('所属分组', r.group==='默认'?'默认（系统分组）':esc(r.group))+li('报名费','¥ '+r.fee)+li('前端展示时间', fmtShowTime(r))+li('前端展示开关', r.show?'展示中':'隐藏','show')+'</div>'
     +'<div><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">考试要素</div>'
       +li('关联试卷', r.paper?esc(r.paper):'未关联','paper')+li('考试时间', fmtExamTime(r),'examStart')+li('时长 / 交卷限制', r.duration+' 分钟 / '+r.submitLimit+' 分钟','duration')
       +li('标签', (r.tags||[]).map(t=>'<span class="tag-chip">'+esc(t)+'</span>').join(' ')||'—','tags')

function bsegPick(btn){

  box.querySelectorAll('button').forEach(b => b.className = 'px-2.5 py-1.5 rounded-md text-xs border border-slate-200 text-slate-600 hover:border-brand-400');
  btn.className = 'px-2.5 py-1.5 rounded-md text-xs border bg-brand-600 text-white border-brand-600';
  box.dataset.v = btn.dataset.o; box.dataset.touched = '1';
}
function bfTogglePermanent(cb){ const inp = $('bfShowEnd'); if(cb.checked){ inp.value=''; inp.disabled=true; inp.classList.add('opacity-50'); } else { inp.disabled=false; inp.classList.remove('opacity-50'); } }
function bfCollect(){
  const sets = {};
  document.querySelectorAll('.bf-ctrl').forEach(el => {
    const f = el.dataset.f; if(!f) return;
    if(f === 'showEnd' && $('bfPermanent') && $('bfPermanent').checked){ sets.showEnd = 'permanent'; return; }
    if(el.disabled) return;
    const v = el.value;
    if(v === '' || v == null) return;
    sets[f] = v;
  });
  if(sets.certDate === '__custom__'){
    const d = (document.querySelector('.bf-ctrl[data-f="certDateCustom"]')||{}).value;
    sets.certDate = d || undefined; if(!d) delete sets.certDate;
  }
  if('pro_guide' in sets && sets.pro_guide === '') delete sets.pro_guide;
  document.querySelectorAll('.bf-ctrl-static').forEach(el => { sets[el.dataset.f] = el.checked; });
  document.querySelectorAll('.bseg').forEach(box => {
    if(!box.dataset.touched) return;
    const f = box.dataset.f, v = box.dataset.v;
    if(f === 'mock_on'){ if(v === '是') sets.mock_on = true; else if(v === '否') sets.mock_on = false; }
    else if(f === 'mpro_mode'){ if(v === 'follow') sets.mpro_follow = true; else if(v === 'custom') sets.mpro_follow = false; }
    else { if(v) sets[f] = v; }
  });
  return sets;
}
function bfUpdateSummary(){
  const sets = bfCollect();
  const map = {group:'分组', fee:'报名费', showStart:'展示开始', showEnd:'展示结束/永久', show:'展示开关', name:'名称', paper:'试卷', examStart:'考试开始', examEnd:'考试结束', duration:'时长', submitLimit:'交卷限制', tags:'标签', desc:'测评描述', certDate:'证书落款', pro_cam:'摄像头', pro_rec:'录屏', pro_photo:'检录照片', pro_wait:'候考时长', pro_guide:'检录引导文案', pro_pic:'检录示意图', pro_phone:'手机监考', pro_score:'成绩', pro_detail:'分数', pro_read:'读题', mock_on:'模拟考开关', mock_paper:'模拟卷', mock_start:'模拟考开始', mock_end:'模拟考结束', mock_limit:'模拟考次数', mock_submitLimit:'模拟考交卷限制', mpro_mode:'模拟监考口径', mpro_cam:'模拟摄像头', mpro_rec:'模拟录屏', mpro_photo:'模拟检录照片', mpro_wait:'模拟候考', mpro_phone:'模拟手机监考', mpro_score:'模拟成绩', mpro_detail:'模拟分数', mpro_read:'模拟读题'};
  const BL = batchBaseline();
  const parts = [];
  Object.entries(sets).forEach(([f,v]) => {
    if(f in BL && String(v) === String(BL[f])) return;
    if(map[f]) parts.push(map[f]);
  });
  const el = $('bfSummary');
  if(el) el.textContent = parts.length ? '将修改：' + [...new Set(parts)].join('、') : '未填写修改项';
}

  const ks = selKeys();
  const sets = bfCollect();
  const BASELINE = batchBaseline();
  const touchedF = Object.keys(sets).filter(f => !(f in BASELINE) || String(sets[f]) !== String(BASELINE[f]));
  if(!touchedF.length){ toast('未填写任何修改项','error'); return; }
  let applied = 0, skipped = 0;
  ks.forEach(k => {
    const r = rows.find(x => x._k === k); if(!r) return;
    const lock = lockSetOf(r); let touched = false;
    const setF = (f, fn) => { if(lock.has(f)) return; fn(); touched = true; };
    if('group' in sets && sets.group) setF('group', () => r.group = sets.group);
    if('fee' in sets && sets.fee !== '') { r.fee = +sets.fee; touched = true; }
    if('showStart' in sets) { r.showStart = sets.showStart; touched = true; }
    if(sets.showEnd === 'permanent'){ r.showEnd=''; r.permanent=true; touched=true; }
    else if('showEnd' in sets && sets.showEnd){ r.showEnd = sets.showEnd; touched = true; }
    if('show' in sets && sets.show !== ''){ r.show = sets.show === '1'; touched = true; }
    if('name' in sets && sets.name) setF('name', () => r.name = sets.name);
    if('paper' in sets && sets.paper) setF('paper', () => { r.paper = sets.paper; if(r.status==='未关联') r.status='创建中'; });
    if('examStart' in sets) setF('examStart', () => r.examStart = sets.examStart.replace('T',' '));
    if('examEnd' in sets) setF('examEnd', () => r.examEnd = sets.examEnd.replace('T',' '));
    if('duration' in sets && sets.duration) setF('duration', () => r.duration = +sets.duration);
    if('submitLimit' in sets && sets.submitLimit) setF('submitLimit', () => r.submitLimit = +sets.submitLimit);
    if('tags' in sets && sets.tags) setF('tags', () => r.tags = sets.tags.split(/[,，]/).map(x=>x.trim()).filter(Boolean));
    if('desc' in sets && sets.desc) setF('desc', () => r.desc = sets.desc);
    if('certDate' in sets && sets.certDate) setF('certDate', () => r.certDate = sets.certDate);
    const proTouched = ['pro_cam','pro_rec','pro_photo','pro_wait','pro_phone','pro_score','pro_detail','pro_read','pro_guide','pro_pic'].filter(f => touchedF.includes(f));
    if(proTouched.length) setF('pro', () => {
      r.pro = {...r.pro};
      if('pro_cam' in sets) r.pro.cam = sets.pro_cam;
      if('pro_rec' in sets) r.pro.rec = sets.pro_rec;
      if('pro_photo' in sets) r.pro.photo = sets.pro_photo;
      if('pro_wait' in sets) r.pro.wait = Math.max(0, Math.min(120, +sets.pro_wait || 0));
      if('pro_guide' in sets && sets.pro_guide !== '') r.pro.guide = sets.pro_guide;
      if(sets.pro_pic === '__reset__') r.pro.pic = '';
      if('pro_phone' in sets) r.pro.phone = sets.pro_phone;
      if('pro_score' in sets) r.pro.score = sets.pro_score;
      if('pro_detail' in sets) r.pro.detail = sets.pro_detail;
      if('pro_read' in sets) r.pro.read = sets.pro_read;
    });
    const mockTouched = ['mock_on','mock_paper','mock_start','mock_end','mock_limit','mock_submitLimit','mpro_follow','mpro_cam','mpro_rec','mpro_photo','mpro_wait','mpro_phone','mpro_score','mpro_detail','mpro_read'].filter(f => touchedF.includes(f));
    if(mockTouched.length) setF('mock', () => {
      r.mock = {...r.mock, pro: r.mock.pro || null};
      if(sets.mock_on === true) r.mock.on = true;
      if(sets.mock_on === false){ r.mock.on = false; r.mock.pro = null; }
      if('mock_paper' in sets && sets.mock_paper) r.mock.paper = sets.mock_paper;
      if('mock_start' in sets) r.mock.start = sets.mock_start.replace('T',' ');
      if('mock_end' in sets) r.mock.end = sets.mock_end.replace('T',' ');
      if('mock_limit' in sets && sets.mock_limit) r.mock.limit = sets.mock_limit;
      if('mock_submitLimit' in sets) r.mock.submitLimit = sets.mock_submitLimit;
      if(touchedF.includes('mpro_follow') && sets.mpro_follow === true) r.mock.pro = null;
      if((touchedF.includes('mpro_follow') && sets.mpro_follow === false) || ['mpro_cam','mpro_rec','mpro_photo','mpro_wait','mpro_phone','mpro_score','mpro_detail','mpro_read'].some(f=>touchedF.includes(f))){
        const cur = r.mock.pro || {cam:r.pro.cam, rec:r.pro.rec, phone:r.pro.phone, photo:r.pro.photo, score:r.pro.score, detail:r.pro.detail, read:r.pro.read, wait:r.pro.wait, guide:'', pic:''};
        r.mock.pro = {...cur};
        if('mpro_cam' in sets && sets.mpro_cam) r.mock.pro.cam = sets.mpro_cam;
        if('mpro_rec' in sets && sets.mpro_rec) r.mock.pro.rec = sets.mpro_rec;
        if('mpro_photo' in sets && sets.mpro_photo) r.mock.pro.photo = sets.mpro_photo;
        if('mpro_wait' in sets) r.mock.pro.wait = Math.max(0, Math.min(120, +sets.mpro_wait || 0));
        if('mpro_phone' in sets) r.mock.pro.phone = sets.mpro_phone;
        if('mpro_score' in sets) r.mock.pro.score = sets.mpro_score;
        if('mpro_detail' in sets) r.mock.pro.detail = sets.mpro_detail;
        if('mpro_read' in sets) r.mock.pro.read = sets.mpro_read;
      }
    });
    if(touched) applied++; else skipped++;
  });
  saveData(); renderAll(); closeModal();
  toast('批量修改完成：' + applied + ' 行已应用' + (skipped ? '，' + skipped + ' 行因锁定字段被跳过' : ''));
}

/* ============ 批量创建考试（线上表单） ============ */
let bcRows = [];
function openBatchCreate(){
  bcRows = [ bcRow(), bcRow() ];
  renderBatchCreate();
}
function bcRow(){ return {name:'', start:'', end:''}; }
function renderBatchCreate(){

  const examRows = bcRows.map((r,i)=>'<tr class="border-b border-slate-100">'
    +'<td class="py-2 px-2 text-xs text-slate-400">'+(i+1)+'</td>'
    +'<td class="py-2 px-2"><input data-i="'+i+'" data-f="name" value="'+esc(r.name)+'" oninput="bcUp(this)" placeholder="如：Python一级·第1场" class="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-sm"></td>'

  // 渠道关联行（支持多选分组）
  const chRows = CHANNEL_LIST.map(c=>{
    const sel = window._bcCh && window._bcCh[c.id];
    const gs = (GROUPS[c.id]||[]).concat('默认');
    const gcbs = gs.map(g=>'<label class="flex items-center gap-1 text-xs text-slate-600 bg-white border border-slate-200 rounded px-1.5 py-0.5"><input type="checkbox" class="cb" data-ch="'+c.id+'" data-g="'+g+'" onchange="bcChGroup(this)" '+(sel&&sel.groups.includes(g)?'checked':'')+'> '+g+'</label>').join('');
    return '<tr class="border-b border-slate-100">'
      +'<td class="py-2 px-2"><label class="flex items-center gap-2 text-sm"><input type="checkbox" class="cb" onchange="bcChToggle(\''+c.id+'\',this.checked)" '+(sel?'checked':'')+'><b>'+esc(c.name)+'</b><span class="text-xs text-slate-400 font-mono">'+c.id+'</span></label></td>'
      +'<td class="py-2 px-2"><div class="flex flex-wrap gap-1">'+gcbs+'</div></td>'
      +'<td class="py-2 px-2 w-28"><input type="number" min="0" value="'+(sel?sel.fee:'')+'" placeholder="报名费" onchange="bcChFee(\''+c.id+'\',this.value)" class="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-sm" '+(sel?'':'disabled')+'></td>'
      +'<td class="py-2 px-2 text-center"><span class="pill '+(sel?'bg-brand-50 text-brand-600':'bg-slate-100 text-slate-400')+'">'+(sel?sel.groups.length+' 个分组':'未选')+'</span></td></tr>';
  }).join('');
  openModalHtml('<div class="bg-white rounded-xl shadow-popover modal-enter w-[1080px] max-w-[96vw] max-h-[92vh] flex flex-col">'
   +'<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between flex-shrink-0"><div class="font-bold text-base">批量创建考试 <span class="text-sm font-normal text-slate-400">活动：'+esc(act().name)+'</span></div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button></div>'
   +'<div class="flex-1 overflow-y-auto custom-scroll px-6 py-4">'
   +'<div class="flex items-center gap-2 mb-3"><i class="fa-solid fa-gear text-brand-500"></i><span class="text-sm font-bold text-slate-700">公共配置</span><span class="text-xs text-slate-400">全部考试共享，填一次</span></div>'
   +'<div class="grid grid-cols-4 gap-3 p-4 bg-slate-50/60 border border-slate-100 rounded-lg">'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">关联试卷 *</div><select id="bcPaper" class="'+IN+'"><option value="">请选择</option>'+PAPER_LIST.map(p=>'<option>'+p+'</option>').join('')+'</select></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">时长（分钟）*</div><input type="number" min="1" id="bcDur" class="'+IN+'" value="120"></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">交卷限制（分钟）*</div><input type="number" min="1" id="bcSub" class="'+IN+'" value="100"></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">标签（逗号分隔）</div><input id="bcTags" class="'+IN+'" placeholder="如：Python,1级"></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">摄像头监考</div><select id="bcCam" class="'+IN+'"><option>强制开启</option><option>非强制开启</option><option>不开启</option></select></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">录屏监考</div><select id="bcRec" class="'+IN+'"><option>强制开启</option><option>非强制开启</option><option>不开启</option></select></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">检录照片</div><select id="bcPhoto" class="'+IN+'"><option>非强制开启</option><option>强制开启</option><option>不开启</option></select></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">候考时长（0=不开启）</div><input type="number" min="0" max="120" id="bcWait" class="'+IN+'" value="0"></div>'
     +'<div class="col-span-2"><div class="text-xs font-medium text-slate-500 mb-1">开关组</div><div class="flex flex-wrap gap-x-4 gap-y-1.5 pt-1.5">'
       +'<label class="flex items-center gap-1.5 text-xs text-slate-600"><input type="checkbox" class="cb" id="bcPhone"> 手机监考</label>'
       +'<label class="flex items-center gap-1.5 text-xs text-slate-600"><input type="checkbox" class="cb" id="bcScore" checked> 成绩开关</label>'
       +'<label class="flex items-center gap-1.5 text-xs text-slate-600"><input type="checkbox" class="cb" id="bcDetail" checked> 分数开关</label>'
       +'<label class="flex items-center gap-1.5 text-xs text-slate-600"><input type="checkbox" class="cb" id="bcRead" checked> 读题开关</label></div></div>'
     +'<div><div class="text-xs font-medium text-slate-500 mb-1">开启模拟考</div><select id="bcMock" class="'+IN+'" onchange="renderBatchCreate()"><option value="否">否</option><option value="是">是</option></select></div>'
     +($('bcMock') && $('bcMock').value==='是'
        ? '<div><div class="text-xs font-medium text-slate-500 mb-1">模拟卷</div><select id="bcMockPaper" class="'+IN+'"><option value="">请选择</option>'+mockOpts.map(p=>'<option>'+p+'</option>').join('')+'</select></div>'
          +'<div><div class="text-xs font-medium text-slate-500 mb-1">模拟考交卷限制（空=不限）</div><input type="number" min="0" id="bcMockSub" class="'+IN+'"></div>'
        : '')
   +'</div>'
   +'<div class="flex items-center gap-2 mt-5 mb-3"><i class="fa-solid fa-list-ol text-brand-500"></i><span class="text-sm font-bold text-slate-700">考试行（差异项）</span><span class="text-xs text-slate-400">每行一场考试：名称与起止时间；公共配置外仅这些不同</span></div>'
   +'<table class="w-full text-sm border border-slate-100 rounded-lg overflow-hidden"><thead class="bg-slate-50 text-xs text-slate-500"><tr>'
     +'<th class="py-2 px-2 w-8">#</th><th class="py-2 px-2 text-left">考试名称 *</th><th class="py-2 px-2 text-left">开始时间 *</th><th class="py-2 px-2 text-left">结束时间 *</th><th class="py-2 px-2 w-20">操作</th>'
   +'</tr></thead><tbody>'+examRows+'</tbody></table>'
   +'<button onclick="bcAdd()" class="mt-2 text-sm text-brand-600 hover:text-brand-700 font-medium"><i class="fa-solid fa-plus mr-1"></i>添加一行</button>'
   +'<div class="flex items-center gap-2 mt-5 mb-3"><i class="fa-solid fa-handshake text-brand-500"></i><span class="text-sm font-bold text-slate-700">渠道关联</span><span class="text-xs text-slate-400">勾选渠道 → 勾选该渠道的分组（可多选）→ 填统一报名费；勾选的每场考试将关联到所选渠道的所选分组</span></div>'
   +'<table class="w-full text-sm border border-slate-100 rounded-lg overflow-hidden"><thead class="bg-slate-50 text-xs text-slate-500"><tr>'
     +'<th class="py-2 px-2 text-left">渠道</th><th class="py-2 px-2 text-left">分组（可多选）</th><th class="py-2 px-2 text-left">报名费（元）*</th><th class="py-2 px-2 text-center">已选分组</th>'
   +'</tr></thead><tbody>'+chRows+'</tbody></table>'
   +'<div id="bcErr" class="hidden mt-3 bg-red-50 border border-red-100 text-red-600 text-xs rounded-lg px-3 py-2"></div>'
   +'</div>'
   +'<div class="px-6 py-3 border-t border-slate-100 flex items-center justify-between flex-shrink-0">'
   +'<span class="text-xs text-slate-400">创建后自动创建爱测评考试（失败行存「未关联」可补建）</span>'
   +'<div class="flex gap-2"><button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">取消</button>'
   +'<button onclick="doBatchCreate()" class="px-5 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">创建 '+bcRows.length+' 场考试</button></div></div>'
   +'</div>');
}
function bcUp(inp){ bcRows[+inp.dataset.i][inp.dataset.f] = inp.value; }
function bcAdd(){ bcRows.push(bcRow()); renderBatchCreate(); }
function bcDel(i){ if(bcRows.length<=1){ toast('至少保留一行考试','error'); return; } bcRows.splice(i,1); renderBatchCreate(); }
function bcCopy(i){ const r = JSON.parse(JSON.stringify(bcRows[i])); bcRows.splice(i+1, 0, r); renderBatchCreate(); }
function bcChToggle(cid, on){
  if(!window._bcCh) window._bcCh = {};
  if(on){ const gs = (GROUPS[cid]||[]); window._bcCh[cid] = {groups: gs.length?[]:[], fee:''}; }
  else delete window._bcCh[cid];
  renderBatchCreate();
}
function bcChGroup(cb){
  const cid = cb.dataset.ch, g = cb.dataset.g;
  const sel = window._bcCh[cid]; if(!sel) return;
  if(cb.checked){ if(!sel.groups.includes(g)) sel.groups.push(g); } else { sel.groups = sel.groups.filter(x=>x!==g); }
  renderBatchCreate();
}
function bcChFee(cid, v){ const sel = window._bcCh[cid]; if(sel) sel.fee = v; }
function doBatchCreate(){
  const errs = [];
  const paper = $('bcPaper').value, dur = +$('bcDur').value, sub = +$('bcSub').value;
  if(!paper) errs.push('公共配置：关联试卷必填');
  if(!dur || dur < 1) errs.push('公共配置：时长必填');
  if(!sub || sub < 1) errs.push('公共配置：交卷限制必填');
  if(dur && sub && dur < sub) errs.push('公共配置：时长（'+dur+'分钟）不能小于交卷限制（'+sub+'分钟）');
  const mockOn = $('bcMock') && $('bcMock').value === '是';
  if(mockOn && !$('bcMockPaper').value) errs.push('公共配置：开启模拟考时模拟卷必填');
  bcRows.forEach((r,i)=>{
    if(!r.name) errs.push('第'+(i+1)+'行：考试名称必填');
    if(!r.start || !r.end) errs.push('第'+(i+1)+'行：起止时间必填');
    else if(r.end <= r.start) errs.push('第'+(i+1)+'行：结束时间需晚于开始时间');
  });
  const chs = Object.entries(window._bcCh || {});
  if(!chs.length) errs.push('渠道关联：至少勾选一个渠道');
  chs.forEach(([cid, sel])=>{
    if(!sel.groups.length) errs.push('渠道「'+chName(cid)+'」：至少勾选一个分组');
    if(sel.fee === '' || isNaN(+sel.fee)) errs.push('渠道「'+chName(cid)+'」：报名费必填');
  });
  if(errs.length){ const e = $('bcErr'); e.classList.remove('hidden'); e.innerHTML = '<b>无法创建，请修正以下问题：</b><br>'+errs.map(x=>'· '+esc(x)).join('<br>'); return; }
  // 执行：每场考试 × 每渠道×每分组 生成关联行
  let baseIdx = 10;
  const newRows = [];
  bcRows.forEach((r, i)=>{
    const aid = 'HD26' + String(10 + i);
    chs.forEach(([cid, sel])=>{
      sel.groups.forEach(g=>{
        newRows.push({ actId: act().id, aid, name: r.name, cid, group: g, paper,
          examStart: r.start.replace('T',' '), examEnd: r.end.replace('T',' '), duration: dur, submitLimit: sub,
          fee: +sel.fee, showStart: '', showEnd: '', show: true, permanent: false, certDate: '首次查看',
          desc: '', tags: ($('bcTags').value||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),
          pro: {cam:$('bcCam').value, rec:$('bcRec').value, photo:$('bcPhoto').value, phone:$('bcPhone').checked, score:$('bcScore').checked, detail:$('bcDetail').checked, read:$('bcRead').checked, wait:Math.min(120,+$('bcWait').value||0), guide:'', pic:''},
          mock: mockOn ? {on:true, paper:$('bcMockPaper').value, start:'', end:'', limit:'无限次', submitLimit:($('bcMockSub')&&$('bcMockSub').value)||'', pro:null} : {on:false,paper:'',start:'',end:'',limit:'',submitLimit:'',pro:null},
          status: '创建中', enrolled: 0, _k: aid + '|' + cid + '|' + g });
      });
    });
  });
  rows.push(...newRows);
  window._bcCh = null;
  saveData(); renderAll(); closeModal();
  toast('已创建 '+bcRows.length+' 场考试 × '+newRows.length+' 条渠道关联，正在自动创建爱测评考试');
  setTimeout(()=>{ newRows.forEach(r=>r.status='已创建'); saveData(); renderAll(); }, 2000);
}

/* ============ 导出 ============ */
function dl(name, content){ const b = new Blob(['\ufeff'+content], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); }
function csvCell(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCsv(){
  const head = ['活动ID','活动名称','渠道ID','渠道名称','分组','考试ID','考试名称','关联试卷','考试开始','考试结束','时长','交卷限制','报名费','展示时间','展示','爱测评状态','报名量','摄像头','录屏','手机监考','检录照片','候考','模拟考','模拟考交卷限制'];
  const data = filterRows().map(r=>[act().id, act().name, r.cid, chName(r.cid), r.group, r.aid, r.name, r.paper||'', r.examStart, r.examEnd, r.duration, r.submitLimit, r.fee, r.permanent?(r.showStart||'')+'~永久':(r.showStart||'')+'~'+(r.showEnd||''), r.show?'是':'否', r.status, r.enrolled, r.pro.cam, r.pro.rec, r.pro.phone?'开':'关', r.pro.photo, r.pro.wait, r.mock.on?'是':'否', r.mock.submitLimit||'']);
  dl('活动考试配置_'+act().id+'.csv', [head,...data].map(r=>r.map(csvCell).join(',')).join('\n'));
  toast('已导出当前结果：'+data.length+' 行');
}

loadData(); renderAll();
