                </div>

                    <span class="text-sm font-medium text-slate-700">启用状态</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>

                </div>

            <div class="mt-8 pt-4 border-t border-slate-100 flex justify-end gap-3">

                <button onclick="closeModal('modal-attr')" class="px-6 py-2 bg-brand-600 text-white text-sm font-bold rounded-lg hover:bg-brand-700 transition shadow-sm">保存</button>

                        <label class="cursor-pointer relative">
                            <input type="radio" name="tag-color" value="purple" class="sr-only color-radio">

    <!-- ==================== 弹窗：合并标签 ==================== -->
    <div id="modal-merge" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl shadow-xl w-[500px] p-6 transform scale-95 transition-transform" id="modal-merge-content">
            <div class="flex justify-between items-center mb-6">

            <div class="mt-8 pt-4 border-t border-slate-100 flex justify-end gap-3">
                <button onclick="closeModal('modal-merge')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 rounded-lg transition">取消</button>
                <button onclick="closeModal('modal-merge')" class="px-6 py-2 bg-amber-500 text-white text-sm font-bold rounded-lg hover:bg-amber-600 transition shadow-sm">确认合并</button>

    <!-- ==================== 弹窗：关联子标签（新增） ==================== -->
    <div id="modal-assoc" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl shadow-xl w-[800px] max-h-[85vh] flex flex-col p-6 transform scale-95 transition-transform" id="modal-assoc-content">
            <div class="flex justify-between items-center mb-4 flex-shrink-0">
                <div>
                    <h3 class="font-bold text-slate-800 text-lg" id="assoc-title">标签关联管理</h3>

                </div>
                <button onclick="closeModal('modal-assoc')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>

            </div>

            <div class="mt-4 pt-3 border-t border-slate-100 flex justify-end gap-3 flex-shrink-0">

                { id: 't8', name: '二级', color: 'green', count: 0 },
                { id: 't9', name: '三级', color: 'orange', count: 0 },
                { id: 't10', name: '四级', color: 'purple', count: 0 },
                { id: 't11', name: '五级', color: 'red', count: 0 },
                { id: 't12', name: '六级', color: 'slate', count: 0 },
                { id: 't13', name: '七级', color: 'blue', count: 0 },
                { id: 't14', name: '八级', color: 'green', count: 0 },
                { id: 't15', name: '九级', color: 'orange', count: 0 },
                { id: 't16', name: '十级', color: 'purple', count: 0 },
                { id: 't17', name: '十一级', color: 'red', count: 0 },
            ],
            attr6: [
                { id: 't18', name: 'Python', color: 'blue', count: 0 },
                { id: 't19', name: 'C++', color: 'green', count: 0 },
                { id: 't20', name: 'Scratch', color: 'orange', count: 0 },
            ],
            attr7: [
                { id: 't21', name: '标准证书模板', color: 'blue', count: 0 },
                { id: 't22', name: '高级证书模板', color: 'purple', count: 0 },
                { id: 't23', name: '专项证书模板', color: 'green', count: 0 },
            ],
        };

        // 标签关联数据：{ 父标签id: [子标签id列表] }
        const associations = {
            t5: ['t7', 't8', 't9'],    // 智能工具实操 → 一级、二级、三级
            t6: ['t7', 't8', 't10'],    // 青年编程 → 一级、二级、四级
        };

        // 当前选中的属性 ID
        let currentAttrId = 'attr4';

        // 关联弹窗上下文
        let assocParentTagId = null;
        let assocParentAttrId = null;

        // ==================== 渲染层 ====================

        // 颜色 class 映射
        const colorClasses = {
            blue:   'bg-blue-50 text-blue-700 border-blue-200',
            green:  'bg-green-50 text-green-700 border-green-200',
            orange: 'bg-orange-50 text-orange-700 border-orange-200',
            purple: 'bg-purple-50 text-purple-700 border-purple-200',
            red:    'bg-red-50 text-red-700 border-red-200',
            slate:  'bg-slate-100 text-slate-600 border-slate-200',
        };

        function tagColorClass(color) {
            return colorClasses[color] || colorClasses.blue;
        }

        function renderAttrList() {
            const container = document.getElementById('attr-list');
            container.innerHTML = attributes.map(a => {
                const isActive = a.id === currentAttrId;
                const baseClass = isActive
                    ? 'bg-brand-50 text-brand-700 border-brand-100 shadow-sm'
                    : 'hover:bg-slate-50 text-slate-600 border-transparent hover:border-slate-100';
                const folderIcon = isActive
                    ? '<i class="fa-solid fa-folder-open text-brand-500 text-sm"></i>'
                    : '<i class="fa-regular fa-folder text-slate-400 text-sm group-hover:text-slate-500"></i>';
                return `
                <div class="group flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer border transition ${baseClass}"
                     onclick="selectAttr('${a.id}')">
                    <div class="flex items-center gap-2 overflow-hidden">
                        ${folderIcon}
                        <span class="${isActive ? 'font-bold' : 'font-medium'} text-sm truncate">${a.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs ${isActive ? 'bg-white/60 text-brand-600' : 'bg-slate-100 text-slate-400'} px-1.5 py-0.5 rounded font-mono">${a.tagCount}</span>
                        <button onclick="event.stopPropagation(); openAttrModal('${a.id}')"
                            class="w-6 h-6 flex items-center justify-center rounded hover:bg-brand-200 text-brand-400 hover:text-brand-600 ${isActive ? '' : 'opacity-0 group-hover:opacity-100'} transition" title="编辑属性">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        ${isActive ? '<button onclick="event.stopPropagation(); deleteAttr(\'' + a.id + '\')" class="w-6 h-6 flex items-center justify-center rounded hover:bg-red-100 text-slate-400 hover:text-red-500 transition" title="删除属性"><i class="fa-solid fa-trash-can text-xs"></i></button>' : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function selectAttr(attrId) {
            currentAttrId = attrId;
            renderAttrList();
            renderTagHeader();
            renderTagTable();
        }

        function renderTagHeader() {
            const attr = attributes.find(a => a.id === currentAttrId);
            if (!attr) return;
            const modeLabel = attr.mode === 'multi' ? '多选模式' : '单选模式';
            document.getElementById('tag-header').innerHTML = `
                <div>
                    <div class="flex items-center gap-3">
                        <h2 class="text-lg font-bold text-slate-800">${attr.name}</h2>
                        <span class="px-2 py-0.5 rounded bg-green-50 text-green-700 border border-green-200 text-xs font-bold">启用中</span>
                        <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-200 text-xs">${modeLabel}</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-1">${attr.desc}</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="openMergeModal()" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm font-medium rounded-lg shadow-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-code-merge"></i> 合并标签
                    </button>
                    <button onclick="openTagModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-lg shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> 新增标签
                    </button>
                </div>`;
        }

        function renderTagTable() {
            const tbody = document.getElementById('tag-tbody');
            const tagList = tags[currentAttrId] || [];
            tbody.innerHTML = tagList.map((t, i) => {
                // 计算该标签已关联的子标签数
                const childIds = associations[t.id] || [];
                const childCount = childIds.length;
                return `
                <tr class="hover-row transition">
                    <td class="p-4 pl-6 text-slate-400 font-mono">${i + 1}</td>
                    <td class="p-4 font-bold">${t.name}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-bold border ${tagColorClass(t.color)}">
                            ${t.name}
                        </span>
                    </td>
                    <td class="p-4 font-mono text-slate-500">${t.count.toLocaleString()}</td>
                    <td class="p-4 text-right pr-6">
                        <button onclick="openTagModal('${t.id}')" class="text-slate-400 hover:text-brand-600 text-xs font-bold mr-3 transition">编辑</button>
                        <button onclick="openAssocModal('${t.id}')" class="text-slate-400 hover:text-indigo-600 text-xs font-bold mr-3 transition">关联子标签</button>
                        <button onclick="deleteTag('${t.id}')" class="text-slate-400 hover:text-red-500 text-xs font-bold transition">删除</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function deleteTag(tagId) {
            const children = associations[tagId] || [];
            if (children.length > 0) {
                alert('该标签已关联了 ' + children.length + ' 个子标签，请先在「关联子标签」中解除关联后再删除。');
                return;
            }
            // 检查是否被其他标签关联为子标签
            const parents = Object.entries(associations).filter(([pid, cids]) => cids.includes(tagId));
            if (parents.length > 0) {
                alert('该标签已被 ' + parents.length + ' 个标签关联为子标签，请先解除关联后再删除。');
                return;
            }
            if (confirm('确定删除标签？此操作不可撤销。')) {
                // 模拟删除
                const tagList = tags[currentAttrId];
                const idx = tagList.findIndex(t => t.id === tagId);
                if (idx >= 0) tagList.splice(idx, 1);
                const attr = attributes.find(a => a.id === currentAttrId);
                attr.tagCount = tagList.length;
                renderAttrList();
                renderTagTable();
            }
        }

        function deleteAttr(attrId) {
            // 检查该属性下的标签是否有被关联的
            const tagList = tags[attrId] || [];
            const hasChildAssoc = tagList.some(t => Object.values(associations).some(cids => cids.includes(t.id)));
            if (hasChildAssoc) {
                alert('该属性下有标签被其他属性的标签关联为子标签，请先解除关联后再删除属性。');
                return;
            }
            if (confirm('确定删除属性「' + (attributes.find(a=>a.id===attrId)?.name||'') + '」？该属性下的所有标签将被删除。')) {
                const idx = attributes.findIndex(a => a.id === attrId);
                if (idx >= 0) attributes.splice(idx, 1);
                delete tags[attrId];
                delete associations[attrId];
                currentAttrId = attributes[0]?.id || '';
                renderAttrList();
                renderTagHeader();
                renderTagTable();
            }
        }

        // ==================== 关联子标签弹窗（新增核心逻辑） ====================

        function openAssocModal(tagId) {
            assocParentTagId = tagId;
            // 找到该标签所属属性
            let parentAttrId = null;
            for (const [aid, tagList] of Object.entries(tags)) {
                if (tagList.some(t => t.id === tagId)) {
                    parentAttrId = aid;
                    break;
                }
            }
            assocParentAttrId = parentAttrId;

            const tag = Object.values(tags).flat().find(t => t.id === tagId);
            const attr = attributes.find(a => a.id === parentAttrId);
            document.getElementById('assoc-title').innerText = '标签关联管理 —— ' + (tag?.name || '');
            document.getElementById('assoc-subtitle').innerText = '所属属性：' + (attr?.name || '') + ' | 为当前标签关联其他属性下的标签作为子标签';

            // 渲染所有属性分组
            renderAssocAllAttrs();
            updateAssocSummary();

            openModal('modal-assoc', 'modal-assoc-content');
        }

        function renderAssocAllAttrs() {
            const container = document.getElementById('assoc-all-attrs');
            const currentAssoc = associations[assocParentTagId] || [];

            // 排除当前标签所属属性、排除无标签的属性
            const otherAttrs = attributes.filter(a => a.id !== assocParentAttrId);

            if (otherAttrs.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 py-8 text-center">没有其他属性可供关联</p>';
                return;
            }

            container.innerHTML = otherAttrs.map(attr => {
                const tagList = tags[attr.id] || [];
                const hasTags = tagList.length > 0;

                if (!hasTags) {
                    return `
                    <div class="opacity-50">
                        <div class="flex items-center gap-2 mb-2 pb-2 border-b border-slate-100">
                            <i class="fa-regular fa-folder text-slate-300 text-sm"></i>
                            <span class="text-sm font-medium text-slate-400">${attr.name}</span>
                            <span class="text-xs text-slate-300 ml-1">（0个标签，无可用关联）</span>
                        </div>
                    </div>`;
                }

                const checkedCount = tagList.filter(t => currentAssoc.includes(t.id)).length;
                const tagsHtml = tagList.map(t => {
                    const checked = currentAssoc.includes(t.id) ? 'checked' : '';
                    return `
                    <label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-white cursor-pointer transition border border-transparent hover:border-slate-200">
                        <input type="checkbox" value="${t.id}" ${checked} class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 assoc-checkbox" onchange="updateAssocSummary()">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold border ${tagColorClass(t.color)}">${t.name}</span>
                    </label>`;
                }).join('');

                return `
                <div>
                    <div class="flex items-center gap-2 mb-2 pb-2 border-b border-slate-100">
                        <i class="fa-solid fa-folder-open text-brand-500 text-sm"></i>
                        <span class="text-sm font-bold text-slate-700">${attr.name}</span>
                        <span class="text-xs text-slate-400">（${tagList.length}个标签${checkedCount > 0 ? '，已关联' + checkedCount + '个' : ''}）</span>
                    </div>
                    <div class="flex flex-wrap gap-2 pl-2">
                        ${tagsHtml}
                    </div>
                </div>`;
            }).join('');
        }

        function updateAssocSummary() {
            const summaryTags = document.getElementById('assoc-summary-tags');
            // 从当前弹窗所有 checkbox 收集勾选的
            const checkboxes = document.querySelectorAll('.assoc-checkbox');
            const selectedIds = [];
            checkboxes.forEach(cb => { if (cb.checked) selectedIds.push(cb.value); });

            if (selectedIds.length === 0) {
                summaryTags.innerHTML = '<span class="text-xs text-brand-400">暂无关联</span>';
                return;
            }

            const allSelected = [...new Set(selectedIds)];

            summaryTags.innerHTML = allSelected.map(tid => {
                const t = Object.values(tags).flat().find(tg => tg.id === tid);
                if (!t) return '';
                const attrEntry = Object.entries(tags).find(([aid, tl]) => tl.some(tg => tg.id === tid));
                const attrName = attributes.find(a => a.id === attrEntry?.[0])?.name || '未知属性';
                return `<span class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-bold border ${tagColorClass(t.color)} cursor-pointer hover:opacity-80 transition group" onclick="removeAssocTag('${tid}')" title="点击取消关联">
                    ${t.name}
                    <span class="text-[10px] opacity-60">(${attrName})</span>
                    <i class="fa-solid fa-xmark text-[10px] ml-0.5 opacity-40 group-hover:opacity-100 transition"></i>
                </span>`;
            }).join('');
        }

        function removeAssocTag(tagId) {
            // 找到对应的 checkbox 并取消勾选
            const cb = document.querySelector(`.assoc-checkbox[value="${tagId}"]`);
            if (cb) {
                cb.checked = false;
                updateAssocSummary();
            }
        }

        function saveAssociation() {
            const checkboxes = document.querySelectorAll('.assoc-checkbox');
            const selectedIds = [];
            checkboxes.forEach(cb => { if (cb.checked) selectedIds.push(cb.value); });

            if (selectedIds.length === 0) {
                delete associations[assocParentTagId];
            } else {
                associations[assocParentTagId] = selectedIds;
            }

            closeModal('modal-assoc');
            renderTagTable();

            const tag = Object.values(tags).flat().find(t => t.id === assocParentTagId);
            showToast('「' + (tag?.name || '') + '」的关联已更新（共 ' + selectedIds.length + ' 个子标签）');
        }

        // Toast 提示
        function showToast(msg) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed bottom-6 right-6 z-[100] flex flex-col gap-2';
                document.body.appendChild(container);
            }
            const el = document.createElement('div');
            el.className = 'bg-slate-800 text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 modal-enter';
            el.innerHTML = '<i class="fa-solid fa-circle-check text-green-400"></i> ' + msg;
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        // ==================== 弹窗通用 ====================

        function openModal(id, contentId) {
            const modal = document.getElementById(id);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.add('modal-enter'); }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            const content = document.getElementById(id + '-content');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); content.classList.remove('modal-enter'); }, 200);
        }

        function openAttrModal(attrId) {
            const title = document.getElementById('modal-attr-title');
            const input = document.getElementById('attr-name');
            if (attrId) {
                const attr = attributes.find(a => a.id === attrId);
                title.innerText = '编辑属性';
                input.value = attr ? attr.name : '';
            } else {
                title.innerText = '新增标签属性';
                input.value = '';
            }
            openModal('modal-attr', 'modal-attr-content');
        }

        function openTagModal(tagId) {
            const title = document.getElementById('modal-tag-title');
            const input = document.getElementById('tag-name');
            const attrInput = document.getElementById('tag-attr-name');
            const attr = attributes.find(a => a.id === currentAttrId);
            attrInput.value = attr ? attr.name : '';

            if (tagId) {
                title.innerText = '编辑标签';
                const tag = Object.values(tags).flat().find(t => t.id === tagId);
                input.value = tag ? tag.name : '';
            } else {
                title.innerText = '新增标签';
                input.value = '';
            }
            openModal('modal-tag', 'modal-tag-content');
        }

        function openMergeModal() {
            openModal('modal-merge', 'modal-merge-content');
        }

        // ==================== 初始化 ====================

        renderAttrList();
        renderTagHeader();
        renderTagTable();

        // 默认选中参测模块
        selectAttr('attr4');
    </script>
</body>
</html>
