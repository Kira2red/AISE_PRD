<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证书流程管理 - 2025春季 Python 一级 (迭代版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } },
                    boxShadow: { 'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        /* Stepper Styles */
        .step-item.completed .step-circle { background-color: #3b82f6; border-color: #3b82f6; color: white; }
        .step-item.completed .step-line { background-color: #3b82f6; }
        .step-item.active .step-circle { border-color: #3b82f6; color: #3b82f6; background-color: #eff6ff; box-shadow: 0 0 0 4px #dbeafe; }
        .step-item.active .step-label { color: #1e293b; font-weight: 700; }
        .step-line { transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen text-slate-800 font-sans flex flex-col relative">

    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="javascript:window.close()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="h-6 w-px bg-slate-200"></div>
            <div>
                <h1 class="text-lg font-bold text-slate-800 leading-tight">2025春季 Python 一级等级测评</h1>
                <p class="text-xs text-slate-400 font-mono">ID: 1001</p>
            </div>
            <span class="ml-2 px-2 py-0.5 bg-amber-50 text-amber-700 text-xs font-bold rounded border border-amber-100">批改中</span>
        </div>
        <div class="flex items-center gap-3">
             <button class="text-slate-500 hover:text-brand-600 text-sm font-medium transition flex items-center gap-2">
                <i class="fa-regular fa-circle-question"></i> 帮助
             </button>
        </div>
    </header>

    <main class="flex-1 max-w-[1400px] w-full mx-auto px-6 py-8 space-y-6">

        <section class="bg-white rounded-xl shadow-card border border-slate-200 p-8">
            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-8">证书生命周期进度</h2>
            <div class="flex items-center justify-between w-full px-4 relative">
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-slate-100 -z-10 rounded-full"></div>

                <div class="step-item active flex flex-col items-center gap-3 bg-white px-2 z-10">
                    <div class="step-circle w-10 h-10 rounded-full border-2 border-slate-300 bg-white flex items-center justify-center text-slate-400 font-bold transition-all relative z-10">
                        <i class="fa-solid fa-pen-nib"></i>
                    </div>
                    <span class="step-label text-xs font-medium text-slate-400">批改中</span>
                </div>
                
                <div class="flex-1 h-1 bg-slate-100"></div>

                <div class="step-item flex flex-col items-center gap-3 bg-white px-2 z-10">
                    <div class="step-circle w-10 h-10 rounded-full border-2 border-slate-200 bg-white flex items-center justify-center text-slate-300 font-bold transition-all">
                        <i class="fa-solid fa-clipboard-check"></i>
                    </div>
                    <span class="step-label text-xs font-medium text-slate-400">待复核</span>
                </div>

                <div class="flex-1 h-1 bg-slate-100"></div>

                <div class="step-item flex flex-col items-center gap-3 bg-white px-2 z-10">
                    <div class="step-circle w-10 h-10 rounded-full border-2 border-slate-200 bg-white flex items-center justify-center text-slate-300 font-bold transition-all">
                        <i class="fa-solid fa-chart-simple"></i>
                    </div>
                    <span class="step-label text-xs font-medium text-slate-400">成绩公示</span>
                </div>

                <div class="flex-1 h-1 bg-slate-100"></div>

                <div class="step-item flex flex-col items-center gap-3 bg-white px-2 z-10">
                    <div class="step-circle w-10 h-10 rounded-full border-2 border-slate-200 bg-white flex items-center justify-center text-slate-300 font-bold transition-all">
                        <i class="fa-solid fa-bullhorn"></i>
                    </div>
                    <span class="step-label text-xs font-medium text-slate-400">证书公示</span>
                </div>

                <div class="flex-1 h-1 bg-slate-100"></div>

                <div class="step-item flex flex-col items-center gap-3 bg-white px-2 z-10">
                    <div class="step-circle w-10 h-10 rounded-full border-2 border-slate-200 bg-white flex items-center justify-center text-slate-300 font-bold transition-all">
                        <i class="fa-solid fa-print"></i>
                    </div>
                    <span class="step-label text-xs font-medium text-slate-400">制作中</span>
                </div>

                <div class="flex-1 h-1 bg-slate-100"></div>

                <div class="step-item flex flex-col items-center gap-3 bg-white px-2 z-10">
                    <div class="step-circle w-10 h-10 rounded-full border-2 border-slate-200 bg-white flex items-center justify-center text-slate-300 font-bold transition-all">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>
                    <span class="step-label text-xs font-medium text-slate-400">已寄送</span>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <section class="lg:col-span-2 bg-white rounded-xl shadow-card border border-slate-200 p-6 flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-brand-500"></i> 等级与证书规则配置
                    </h2>
                    
                    <div class="bg-slate-100 p-1 rounded-lg flex text-xs font-bold">
                        <button class="px-3 py-1.5 rounded-md text-slate-500 hover:text-slate-700">按分数划线</button>
                        <button class="px-3 py-1.5 rounded-md bg-white text-brand-600 shadow-sm">按比例划线 (%)</button>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6 h-full">
                    <div class="flex-1 space-y-3">
                        <div class="flex justify-between text-xs font-bold text-slate-400 px-2 uppercase">
                            <span>排名前 %</span>
                            <span class="pl-12">等级名称</span>
                            <span>发放证书</span>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center gap-3 text-sm">
                            <span class="font-mono text-xs font-bold text-slate-400 w-8">TOP</span>
                            <input type="number" value="15" class="w-20 px-2 py-1.5 rounded border border-slate-200 text-slate-700 font-bold focus:border-brand-500 outline-none">
                            <span class="text-slate-400 w-6">%</span>
                            <i class="fa-solid fa-arrow-right text-slate-300 text-xs"></i>
                            <input type="text" value="一等奖" class="flex-1 px-2 py-1.5 rounded border border-slate-200 text-slate-700 focus:border-brand-500 outline-none">
                            
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-2 py-1 rounded border border-slate-200 hover:border-brand-300">
                                <input type="checkbox" checked class="accent-brand-600 w-4 h-4">
                            </label>

                            <button class="text-slate-400 hover:text-red-500 w-6"><i class="fa-solid fa-trash"></i></button>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center gap-3 text-sm">
                            <span class="font-mono text-xs font-bold text-slate-400 w-8">TOP</span>
                            <input type="number" value="45" class="w-20 px-2 py-1.5 rounded border border-slate-200 text-slate-700 font-bold focus:border-brand-500 outline-none">
                            <span class="text-slate-400 w-6">%</span>
                            <i class="fa-solid fa-arrow-right text-slate-300 text-xs"></i>
                            <input type="text" value="二等奖" class="flex-1 px-2 py-1.5 rounded border border-slate-200 text-slate-700 focus:border-brand-500 outline-none">
                            
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-2 py-1 rounded border border-slate-200 hover:border-brand-300">
                                <input type="checkbox" checked class="accent-brand-600 w-4 h-4">
                            </label>

                            <button class="text-slate-400 hover:text-red-500 w-6"><i class="fa-solid fa-trash"></i></button>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 flex items-center gap-3 text-sm">
                            <span class="font-mono text-xs font-bold text-slate-400 w-8">TOP</span>
                            <input type="number" value="80" class="w-20 px-2 py-1.5 rounded border border-slate-200 text-slate-700 font-bold focus:border-brand-500 outline-none">
                            <span class="text-slate-400 w-6">%</span>
                            <i class="fa-solid fa-arrow-right text-slate-300 text-xs"></i>
                            <input type="text" value="参与奖" class="flex-1 px-2 py-1.5 rounded border border-slate-200 text-slate-700 focus:border-brand-500 outline-none">
                            
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-2 py-1 rounded border border-slate-200 hover:border-brand-300">
                                <input type="checkbox" class="accent-brand-600 w-4 h-4">
                            </label>

                            <button class="text-slate-400 hover:text-red-500 w-6"><i class="fa-solid fa-trash"></i></button>
                        </div>

                        <button class="text-xs text-brand-600 font-medium hover:text-brand-700 bg-brand-50 px-3 py-2 rounded w-full border border-dashed border-brand-200 hover:border-brand-300 transition-colors">
                            <i class="fa-solid fa-plus mr-1"></i> 添加新等级
                        </button>
                        
                        <div class="bg-amber-50 text-amber-800 text-[10px] p-2 rounded border border-amber-100 flex items-start gap-2">
                            <i class="fa-solid fa-circle-info mt-0.5"></i>
                            <p>按比例划线规则：若学生分数正好卡在分割点上，按照“同分同权”原则，该学生及其同分者均归入**上一档（更高等级）**。</p>
                        </div>
                    </div>

                    <div class="w-full md:w-64 border-l border-slate-100 pl-0 md:pl-6 flex flex-col gap-3">
                        <div class="p-3 bg-brand-50 rounded-lg border border-brand-100">
                            <div class="flex justify-between items-baseline mb-1">
                                <span class="text-xs font-bold text-brand-700">一等奖</span>
                                <span class="text-xs font-mono text-brand-500">16.2%</span>
                            </div>
                            <div class="flex justify-between text-[10px] text-brand-400">
                                <span>201人 <i class="fa-solid fa-certificate ml-1"></i></span>
                                <span>分数线 ≥ 92</span>
                            </div>
                        </div>
                        <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                            <div class="flex justify-between items-baseline mb-1">
                                <span class="text-xs font-bold text-blue-700">二等奖</span>
                                <span class="text-xs font-mono text-blue-500">30.5%</span>
                            </div>
                            <div class="flex justify-between text-[10px] text-blue-400">
                                <span>378人 <i class="fa-solid fa-certificate ml-1"></i></span>
                                <span>分数线 ≥ 78</span>
                            </div>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 opacity-60">
                            <div class="flex justify-between items-baseline mb-1">
                                <span class="text-xs font-bold text-slate-600">参与奖</span>
                                <span class="text-xs font-mono text-slate-400">33.3%</span>
                            </div>
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span>412人 <i class="fa-solid fa-ban ml-1 text-red-400"></i></span>
                                <span>分数线 ≥ 60</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-100 text-right">
                    <button class="text-sm font-bold text-brand-600 hover:text-brand-700">保存并重新计算 <i class="fa-solid fa-rotate ml-1"></i></button>
                </div>
            </section>

            <section class="bg-gradient-to-br from-indigo-600 to-brand-600 rounded-xl shadow-card p-6 text-white flex flex-col justify-between relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl">
                    <i class="fa-solid fa-shuffle"></i>
                </div>
                
                <div>
                    <h2 class="text-sm font-bold uppercase tracking-wider opacity-80 mb-1">状态流转控制</h2>
                    <p class="text-xl font-bold mb-6">批改中 <i class="fa-solid fa-arrow-right mx-2 opacity-50 text-sm"></i> 待复核</p>
                    
                    <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4 border border-white/20 mb-4">
                        <label class="block text-[10px] font-bold uppercase opacity-70 mb-2">设定自动流转时间 (可选)</label>
                        <input type="datetime-local" class="w-full bg-white/20 border border-white/30 rounded px-3 py-2 text-sm text-white placeholder-white/50 outline-none focus:bg-white/30">
                    </div>
                </div>

                <div class="space-y-3">
                    <button class="w-full bg-white text-brand-600 font-bold py-2.5 rounded-lg hover:bg-brand-50 transition shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-regular fa-clock"></i> 设定定时流转
                    </button>
                    <button class="w-full bg-brand-700/50 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg border border-brand-500 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> 立即流转至下一步
                    </button>
                    <button class="w-full bg-transparent hover:bg-black/10 text-white/80 hover:text-white font-medium py-2 rounded-lg border border-white/20 transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-rotate-left"></i> 返回上一步 (撤销)
                    </button>
                </div>
            </section>
        </div>

    </main>

</body>
</html>
