<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生证书管理 - AISE 后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } },
                    boxShadow: { 'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)' },
                    animation: { 'fade-in-down': 'fadeInDown 0.3s ease-out forwards' },
                    keyframes: {
                        fadeInDown: { '0%': { opacity: '0', transform: 'translateY(-20px) translateX(-50%)' }, '100%': { opacity: '1', transform: 'translateY(0) translateX(-50%)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; }
        .nav-item.active::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 4px; height: 24px; background-color: #3b82f6; border-radius: 0 4px 4px 0;
        }
        tr.hover-row:hover td { background-color: #f8fafc; }
        /* Custom Scrollbar for table container */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800 font-sans relative">

    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg z-[100] flex items-center gap-3 hidden opacity-0 transition-all">
        <i class="fa-solid fa-circle-info text-blue-400"></i>
        <span class="text-sm font-medium">正在导出，请稍后在「消息中心」查看下载</span>
    </div>

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-gradient-to-br from-brand-600 to-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg mr-3 shadow-sm">A</div>
            <span class="font-bold text-lg text-slate-800 tracking-tight">AISE Admin</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 space-y-1">
            <a href="#" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative">
                <i class="fa-solid fa-graduation-cap w-5 text-center"></i><span class="font-medium text-sm">测评管理</span>
            </a>
            <a href="#" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative">
                <i class="fa-solid fa-certificate w-5 text-center"></i><span class="font-medium text-sm">证书管理</span>
            </a>
            <a href="#" class="nav-item active flex items-center gap-3 px-6 py-3 text-brand-600 bg-brand-50 transition relative">
                <i class="fa-solid fa-user-graduate w-5 text-center"></i><span class="font-medium text-sm">学生证书管理</span>
            </a>
            <div class="px-6 py-2 mt-4 text-xs font-bold text-slate-400 uppercase tracking-wider">系统与消息</div>
            <a href="#" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative">
                <i class="fa-solid fa-bell w-5 text-center"></i><span class="font-medium text-sm">消息中心</span>
            </a>
            <a href="#" class="nav-item flex items-center gap-3 px-6 py-3 text-slate-500 hover:bg-slate-50 hover:text-brand-600 transition relative">
                <i class="fa-solid fa-users w-5 text-center"></i><span class="font-medium text-sm">用户管理</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50/50 relative">

        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-10">
            <h1 class="text-xl font-bold text-slate-800">学生证书管理</h1>
            <div class="flex items-center gap-2 text-xs text-slate-500 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                <i class="fa-solid fa-shield-halved text-brand-600"></i>
                <span>管理员：Admin</span>
            </div>
        </header>

        <div class="px-8 py-6">
            <div class="bg-white rounded-xl shadow-card border border-slate-100 p-5">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-regular fa-user"></i></span>
                        <input type="text" placeholder="学生姓名" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:border-brand-500 outline-none bg-white transition shadow-sm">
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-phone"></i></span>
                        <input type="text" placeholder="手机号" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:border-brand-500 outline-none bg-white transition shadow-sm">
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-regular fa-id-card"></i></span>
                        <input type="text" placeholder="身份证号" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:border-brand-500 outline-none bg-white transition shadow-sm">
                    </div>
                    
                    <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:border-brand-500 outline-none shadow-sm text-slate-600 cursor-pointer">
                        <option value="">渠道 (名称/编号) - 可多选</option>
                        <option value="1">编程猫北京中心 (CH-BJ-001)</option>
                        <option value="2">童程童美上海 (CH-SH-002)</option>
                        <option value="3">AISE 直营 (CH-OFFICIAL)</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:border-brand-500 outline-none shadow-sm text-slate-600 cursor-pointer">
                        <option value="">证书状态 (全部)</option>
                        <option value="processing">批改中</option>
                        <option value="completed">批改完成</option>
                        <option value="publicity">公示中</option>
                        <option value="making">制作中</option>
                        <option value="sent">已寄送</option>
                    </select>

                    <div class="flex gap-2">
                        <select class="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:border-brand-500 outline-none shadow-sm text-slate-600 cursor-pointer">
                            <option value="">测评结果</option>
                            <option value="优秀">优秀</option>
                            <option value="良好">良好</option>
                            <option value="合格">合格</option>
                        </select>
                        <div class="flex items-center gap-1 flex-[1.5]">
                            <input type="number" placeholder="分" class="w-full px-2 py-2 text-sm border border-slate-200 rounded-lg focus:border-brand-500 outline-none bg-white shadow-sm text-center">
                            <span class="text-slate-300">-</span>
                            <input type="number" placeholder="分" class="w-full px-2 py-2 text-sm border border-slate-200 rounded-lg focus:border-brand-500 outline-none bg-white shadow-sm text-center">
                        </div>
                    </div>

                    <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:border-brand-500 outline-none shadow-sm text-slate-600 cursor-pointer">
                        <option value="">模块 (可多选)</option>
                        <option value="Python">Python</option>
                        <option value="C++">C++</option>
                    </select>
                    
                    <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:border-brand-500 outline-none shadow-sm text-slate-600 cursor-pointer">
                        <option value="">级别 (可多选)</option>
                        <option value="1">一级</option>
                        <option value="2">二级</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-50">
                    <button class="px-6 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 text-sm font-medium rounded-lg transition">重置</button>
                    <button id="btn-export" onclick="exportData()" class="px-5 py-2 bg-green-50 hover:bg-green-100 border border-green-200 text-green-700 text-sm font-bold rounded-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> <span>导出数据</span>
                    </button>
                    <button class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-lg shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> 查询数据
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-hidden px-8 pb-8">
            <div class="bg-white rounded-xl shadow-card border border-slate-200 h-full flex flex-col">
                <div class="flex-1 overflow-auto custom-scroll">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 z-10">
                            <tr class="border-b border-slate-100 bg-slate-50 text-xs uppercase text-slate-500 font-bold">
                                <th class="p-4 pl-6 whitespace-nowrap">学生姓名</th>
                                <th class="p-4 whitespace-nowrap">照片</th>
                                <th class="p-4 whitespace-nowrap">手机号</th>
                                <th class="p-4 whitespace-nowrap">身份证号</th>
                                <th class="p-4 whitespace-nowrap">渠道信息</th>
                                <th class="p-4 whitespace-nowrap text-right">成绩</th>
                                <th class="p-4 whitespace-nowrap">测评结果</th>
                                <th class="p-4 whitespace-nowrap">证书状态</th>
                                <th class="p-4 whitespace-nowrap">模块</th>
                                <th class="p-4 whitespace-nowrap">级别</th>
                                <th class="p-4 whitespace-nowrap text-center bg-slate-50 sticky right-0 shadow-[-4px_0_8px_-4px_rgba(0,0,0,0.05)]">操作</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm text-slate-700 divide-y divide-slate-100">
                            <tr class="hover-row transition group hover:bg-slate-50">
                                <td class="p-4 pl-6 font-bold text-slate-800 whitespace-nowrap">张小明</td>
                                <td class="p-4">
                                    <div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden border border-slate-100 shadow-sm shrink-0">
                                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ZhangXiaoming" alt="Avatar" class="w-full h-full object-cover">
                                    </div>
                                </td>
                                <td class="p-4 font-mono text-slate-500 whitespace-nowrap">138****8888</td>
                                <td class="p-4 font-mono text-slate-500 whitespace-nowrap">110101********1234</td>
                                <td class="p-4 whitespace-nowrap">
                                    <p class="text-xs font-medium text-slate-700">编程猫北京中心</p>
                                    <p class="text-[10px] font-mono text-slate-400 mt-0.5">CH-BJ-001</p>
                                </td>
                                <td class="p-4 font-mono font-bold text-slate-800 text-right whitespace-nowrap">92</td>
                                <td class="p-4 whitespace-nowrap">
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-bold bg-brand-50 text-brand-700 border border-brand-100">优秀</span>
                                </td>
                                <td class="p-4 whitespace-nowrap">
                                    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-xs font-bold bg-green-50 text-green-700 border border-green-100">
                                        <i class="fa-solid fa-truck-fast text-[10px]"></i> 已寄送
                                    </span>
                                </td>
                                <td class="p-4 text-xs whitespace-nowrap">Python</td>
                                <td class="p-4 text-xs whitespace-nowrap"><span class="bg-slate-100 text-slate-600 px-1.5 rounded">一级</span></td>
                                <td class="p-4 text-center whitespace-nowrap bg-white sticky right-0 shadow-[-4px_0_8px_-4px_rgba(0,0,0,0.05)] group-hover:bg-slate-50 transition-colors">
                                    <div class="flex items-center justify-center gap-2">
                                        <button class="text-xs font-medium text-brand-600 hover:text-brand-800 hover:bg-brand-50 px-2 py-1 rounded transition">管理证书</button>
                                        <div class="w-px h-3 bg-slate-200"></div>
                                        <button class="text-xs font-medium text-slate-500 hover:text-brand-600 hover:bg-slate-50 px-2 py-1 rounded transition">查看证书</button>
                                        <div class="w-px h-3 bg-slate-200"></div>
                                        <button class="text-xs font-medium text-slate-500 hover:text-blue-600 hover:bg-slate-50 px-2 py-1 rounded transition">修改信息</button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                    </table>
                </div>
                
                <div class="p-4 mt-auto border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 bg-white rounded-b-xl">
                    <div class="flex items-center gap-2">
                        <span>每页显示</span>
                        <select class="border border-slate-200 rounded px-2 py-1 bg-white focus:border-brand-500 outline-none cursor-pointer hover:border-slate-300 transition">
                            <option value="20">20 条</option>
                            <option value="50">50 条</option>
                            <option value="100">100 条</option>
                        </select>
                        <span>共 5,682 条记录</span>
                    </div>
                    
                    <div class="flex gap-1">
                        <button class="px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 disabled:opacity-50 transition" disabled>上一页</button>
                        <button class="px-2 py-1 bg-brand-50 text-brand-600 font-bold border border-brand-100 rounded transition">1</button>
                        <button class="px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 transition">2</button>
                        <button class="px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 transition">3</button>
                        <span class="px-2 py-1">...</span>
                        <button class="px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 transition">10</button>
                        <button class="px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 transition">下一页</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function exportData() {
            const btn = document.getElementById('btn-export');
            const originalContent = '<i class="fa-solid fa-file-excel"></i> <span>导出数据</span>';
            const loadingContent = '<i class="fa-solid fa-spinner fa-spin"></i> <span>正在导出...</span>';
            const toast = document.getElementById('toast');

            // 1. Change Button State
            btn.innerHTML = loadingContent;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btn.disabled = true;

            // 2. Show Toast
            toast.classList.remove('hidden');
            void toast.offsetWidth; // Force reflow
            toast.classList.add('animation-fade-in-down', 'opacity-100', 'translate-y-0');
            toast.classList.remove('opacity-0', '-translate-y-5');

            // 3. Mock Export Delay (Simulate async processing)
            setTimeout(() => {
                // Reset Button
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btn.disabled = false;

                // Hide Toast after a delay
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-5');
                    setTimeout(() => {
                        toast.classList.add('hidden');
                    }, 300);
                }, 3000); 
            }, 2000);
        }
    </script>
</body>
</html>
