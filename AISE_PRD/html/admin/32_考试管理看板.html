function chName(cid){ const c = CHANNEL_LIST.find(x=>x.id===cid); return c? c.name : cid; }
function proBrief(p){ if(!p) return '—';
  const parts=[];
  parts.push('摄像头:'+p.cam); parts.push('录屏:'+(p.rec||'不开启'));
  if(p.phone) parts.push('手机监考');
  parts.push('检录照片:'+p.photo);
  if(!p.score) parts.push('成绩:关');
  if(!p.detail) parts.push('分数:关');
  if(!p.read) parts.push('读题:关');
  if(p.wait>0) parts.push('候考:'+p.wait+'分');
  return parts.join('，');
}
function mockBrief(m){ if(!m||!m.on) return '<span class="text-slate-300">未开启</span>';
  const pro = m.pro ? '<span class="text-amber-600">监考:自定义</span>' : '<span class="text-slate-400">监考:同正式考</span>';
  return '<span class="text-emerald-600 font-medium">已开启</span> · '+esc(m.paper)+' · '+esc(m.limit||'')+'<div class="mt-0.5">'+pro+'</div>'; }
function examPhase(r){ const n=Date.now(); const s=Date.parse(r.examStart.replace(' ','T')); const e=Date.parse(r.examEnd.replace(' ','T')); if(n<s) return 'notstart'; if(n>e) return 'ended'; return 'ongoing'; }
function phaseText(p){ return {notstart:'未开考',ongoing:'进行中',ended:'已结束'}[p]; }
function statusPill(s, failReason){ const map={'已创建':'bg-emerald-50 text-emerald-600','创建中':'bg-amber-50 text-amber-600','未关联':'bg-slate-100 text-slate-500','创建失败':'bg-red-50 text-red-600'}; return '<span class="pill '+map[s]+'">'+s+'</span>'; }
function fmtExamTime(r){ const d1=r.examStart.slice(0,10), d2=r.examEnd.slice(0,10); if(d1===d2) return esc(d1)+' '+esc(r.examStart.slice(11))+'-'+esc(r.examEnd.slice(11)); return esc(r.examStart)+' 至 '+esc(r.examEnd); }
function fmtShowTime(r){ if(!r.showStart && !r.showEnd) return '未设置'; if(r.showStart && !r.showEnd) return esc(r.showStart)+' 起'; if(!r.showStart && r.showEnd) return esc(r.showEnd)+' 止'; return esc(r.showStart)+' ~ '+esc(r.showEnd); }
/** 考试开始后锁定的字段（含起止时间，已报名/未报名都锁，依据：20260825 §3.7 + 用户拍板2） */
function lockedFields(r){
  if(examPhase(r)==='notstart') return [];
  return ['name','examStart','examEnd','duration','submitLimit','paper','pro','mock'];
}
function fieldLockNote(){ return '考试已开始/结束，考试要素已锁定'; }
function enrolledLock(r){ return r.enrolled>0 ? ['examStart','examEnd'] : []; } // 已报名禁改起止时间（即便未开考）
function lockSet(r){ const s=new Set(lockedFields(r)); enrolledLock(r).forEach(x=>s.add(x)); return s; }
function canTouch(r){ return lockSet(r).size===0; }

/* ================= 统计 ================= */
function renderStats(){
  const total=rows.length, created=rows.filter(r=>r.status==='已创建').length, failed=rows.filter(r=>r.status==='创建失败').length,
        creating=rows.filter(r=>r.status==='创建中').length, unlinked=rows.filter(r=>r.status==='未关联').length,
        enrolled=rows.reduce((s,r)=>s+(+r.enrolled||0),0);
  const cards = [
    {label:'关联总行数', v:total, sub:rows.length? chName(rows[0].cid)+' 等 '+new Set(rows.map(r=>r.cid)).size+' 个渠道':'', c:'text-slate-800'},
    {label:'已创建', v:created, sub:'爱测评考试就绪', c:'text-emerald-600'},
    {label:'创建中/未关联', v:creating+'/'+unlinked, sub:'待完成链路', c:'text-amber-600'},
    {label:'创建失败', v:failed, sub:'需重试或补关联', c:'text-red-500'},
    {label:'总报名量', v:enrolled, sub:'全渠道累计', c:'text-brand-600'},
  ];
  $('statCards').innerHTML = cards.map(c=>`
    <div class="bg-white rounded-xl shadow-card border border-slate-100 p-4">
      <div class="text-xs text-slate-400 mb-1">${c.label}</div>
      <div class="text-2xl font-bold ${c.c}">${c.v}</div>
      <div class="text-xs text-slate-400 mt-1">${c.sub}</div>
    </div>`).join('');
}

/* ================= 筛选/排序/渲染 ================= */
let sortKey=null, sortDir=1;
function filterRows(){
  const kw=$('fKw').value.trim(), fc=$('fChannel').value, fg=$('fGroup').value, fs=$('fStatus').value, fe=$('fExam').value;
  return rows.filter(r=>{
    if(fc && r.cid!==fc) return false;
    if(fg && r.group!==fg) return false;
    if(fs && r.status!==fs) return false;
    if(fe && examPhase(r)!==fe) return false;
    if(kw && !(r.name.includes(kw)||r.aid.includes(kw)||chName(r.cid).includes(kw))) return false;
    return true;
  });
}
function onChannelFilter(){ const c=$('fChannel').value; const gs=[...new Set(rows.filter(r=>!c||r.cid===c).map(r=>r.group))]; $('fGroup').innerHTML='<option value="">全部分组</option>'+gs.map(g=>'<option>'+esc(g)+'</option>').join(''); }
function sortBy(k){ if(sortKey===k){ sortDir*=-1; } else { sortKey=k; sortDir=1; } renderTable(); }
function cmpVal(a,b){ if(a===b) return 0; return a>b?1:-1; }
function renderTable(){
  const list0=filterRows();
  let list=list0;
  if(sortKey==='examStart') list=[...list].sort((a,b)=>sortDir*cmpVal(a.examStart,b.examStart));
  if(sortKey==='fee') list=[...list].sort((a,b)=>sortDir*cmpVal(+a.fee,+b.fee));
  if(sortKey==='enrolled') list=[...list].sort((a,b)=>sortDir*cmpVal(+a.enrolled,+b.enrolled));
  const tb=$('tbody');
  if(!list.length){ tb.innerHTML='<tr><td colspan="16" class="text-center text-slate-400 py-12">当前筛选无匹配行</td></tr>'; }
  else tb.innerHTML = list.map(r=>{
    const k=esc(r._k), locked=!canTouch(r), phase=examPhase(r);
    const phasePill = phase==='ended' ? '<span class="pill bg-slate-100 text-slate-400">已结束</span>' : phase==='ongoing' ? '<span class="pill bg-blue-50 text-blue-600">进行中</span>' : '';
    const tags=(r.tags||[]).map(t=>'<span class="tag-chip">'+esc(t)+'</span>').join('');
    return '<tr class="border-b border-slate-100 hover-row" data-k="'+k+'">'
      +'<td class="py-2.5 px-3"><input type="checkbox" class="cb rowcb" data-k="'+k+'" onchange="onRowCb()"></td>'
      +'<td class="py-2.5 px-3">'+esc(chName(r.cid))+'<div class="text-xs text-slate-400 font-mono">'+esc(r.cid)+'</div></td>'
      +'<td class="py-2.5 px-3">'+(r.group==='默认'?'<span class="pill bg-slate-100 text-slate-500">默认</span>':esc(r.group))+'</td>'
      +'<td class="py-2.5 px-3 font-medium">'+esc(r.name)+'<div class="text-xs text-slate-400 font-mono">'+esc(r.aid)+'</div><div class="mt-0.5">'+tags+'</div></td>'
      +'<td class="py-2.5 px-3">'+(r.paper?esc(r.paper):'<span class="text-slate-300">未关联</span>')+'</td>'
      +'<td class="py-2.5 px-3 text-xs">'+fmtExamTime(r)+' '+phasePill+'</td>'
      +'<td class="py-2.5 px-3">'+r.duration+'分</td>'
      +'<td class="py-2.5 px-3">'+r.submitLimit+'分</td>'
      +'<td class="py-2.2 px-3 font-medium">¥'+r.fee+'</td>'
      +'<td class="py-2.5 px-3 text-xs">'+fmtShowTime(r)+'</td>'
      +'<td class="py-2.5 px-3">'+(r.show?'<span class="pill bg-emerald-50 text-emerald-600">展示中</span>':'<span class="pill bg-slate-100 text-slate-500">隐藏</span>')+'</td>'
      +'<td class="py-2.5 px-3 text-xs max-w-[240px]"><div class="truncate" title="'+esc(proBrief(r.pro))+'">'+esc(proBrief(r.pro))+'</div></td>'
      +'<td class="py-2.5 px-3 text-xs">'+mockBrief(r.mock)+'</td>'
      +'<td class="py-2.5 px-3">'+statusPill(r.status)+(r.status==='创建失败'?'<div class="text-xs text-red-400 mt-0.5">'+esc(r.failReason||'')+'</div>':'')+'</td>'
      +'<td class="py-2.5 px-3">'+(r.enrolled>0?'<b>'+r.enrolled+'</b>':'<span class="text-slate-300">0</span>')+'</td>'
      +'<td class="py-2.5 px-3 whitespace-nowrap">'
        +(r.status==='创建失败'?'<button onclick="retryRow(\''+k+'\')" class="text-brand-600 hover:text-brand-700 text-xs font-medium mr-2"><i class="fa-solid fa-rotate-right"></i> 重试</button>':'')
        +(r.status==='未关联'?'<button onclick="linkPaper(\''+k+'\')" class="text-brand-600 hover:text-brand-700 text-xs font-medium mr-2"><i class="fa-solid fa-link"></i> 补关联</button>':'')
        +'<button onclick="viewRow(\''+k+'\')" class="text-slate-500 hover:text-brand-600 text-xs mr-2"><i class="fa-solid fa-eye"></i> 详情</button>'
      +'</td></tr>';
  }).join('');
  $('footInfo').innerHTML = '<span>共 '+list.length+' 行（全平台 '+rows.length+' 行）</span><span>已选 <b id="footSel">'+selKeys().length+'</b> 行</span>';
  syncSelState();
}
function resetFilter(){ $('fKw').value=''; $('fChannel').value=''; onChannelFilter(); $('fStatus').value=''; $('fExam').value=''; renderTable(); }
function renderAll(){ renderStats(); onChannelFilter(); renderTable(); }

/* ================= 勾选 ================= */
function selKeys(){ const out=[]; document.querySelectorAll('.rowcb').forEach(c=>{ if(c.checked) out.push(c.dataset.k); }); return out; }
function onRowCb(){ syncSelState(); }
function syncSelState(){ const n=selKeys().length; $('selCount').textContent=n; $('btnBatch').disabled=n===0; const f=$('footSel'); if(f) f.textContent=n; }
function toggleAll(v){ document.querySelectorAll('.rowcb').forEach(c=>c.checked=v); syncSelState(); }

/* ================= 详情抽屉 ================= */
function viewRow(k){
  const r=rows.find(x=>x._k===k); if(!r) return;
  const lock=lockSet(r);
  const li=(lab,val,field)=>{ const locked=lock.has(field); return '<div class="flex items-start gap-2 py-1.5 text-sm"><span class="text-slate-400 w-28 flex-shrink-0">'+lab+'</span><span class="flex-1">'+val+'</span>'+(locked?' <i class="fa-solid fa-lock text-amber-500 text-xs lock-ico" title="'+fieldLockNote()+'"></i>':'')+'</div>'; };
  const html = '<div class="fixed inset-0 z-50 flex justify-end">'
    +'<div class="absolute inset-0 bg-slate-900/40 mask-enter" onclick="closeModal()"></div>'
    +'<div class="relative w-[560px] bg-white h-full shadow-popover modal-enter flex flex-col">'
    +'<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"><div class="font-bold">'+esc(r.name)+'<span class="text-xs text-slate-400 font-mono ml-2">'+esc(r.aid)+'</span></div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>'
    +'<div class="flex-1 overflow-y-auto custom-scroll px-6 py-4 space-y-5">'
      +'<div><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">渠道关联</div>'
        +li('渠道', esc(chName(r.cid))+'（'+esc(r.cid)+'）')
        +li('所属分组', r.group==='默认'?'默认（系统分组）':esc(r.group))
        +li('报名费', '¥ '+r.fee)
        +li('前端展示时间', fmtShowTime(r))
        +li('前端展示开关', r.show?'展示中':'隐藏','show')
      +'</div>'
      +'<div><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">考试要素</div>'
        +li('关联试卷', r.paper?esc(r.paper):'未关联','paper')
        +li('考试时间', fmtExamTime(r)+'（'+phaseText(examPhase(r))+'）','examStart')
        +li('时长 / 交卷限制', r.duration+' 分钟 / '+r.submitLimit+' 分钟','duration')
        +li('标签', (r.tags||[]).map(t=>'<span class="tag-chip">'+esc(t)+'</span>').join(' ')||'—')
        +li('爱测评状态', statusPill(r.status)+(r.failReason?'<div class="text-xs text-red-400 mt-1">'+esc(r.failReason)+'</div>':''))
        +li('报名量', r.enrolled+' 人')
      +'</div>'
      +'<div><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">监考配置</div>'
        +li('摄像头监考', r.pro.cam,'pro')
        +li('录屏监考', r.pro.rec,'pro')
        +li('手机监考', r.pro.phone?'开启':'关闭','pro')
        +li('检录照片', r.pro.photo,'pro')
        +li('成绩/分数/读题', (r.pro.score?'开':'关')+' / '+(r.pro.detail?'开':'关')+' / '+(r.pro.read?'开':'关'),'pro')
        +li('候考时长', r.pro.wait>0? r.pro.wait+' 分钟':'不开启','pro')
      +'</div>'
      +'<div><div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">模拟考</div>'
        +(r.mock&&r.mock.on
          ? li('模拟卷', esc(r.mock.paper),'mock')+li('模拟考时间', esc(r.mock.start)+' 至 '+esc(r.mock.end),'mock')+li('次数限制', esc(r.mock.limit),'mock')
            +li('模拟考监考', r.mock.pro?'<span class=\'text-amber-600\'>自定义</span> <span class=\'text-xs text-slate-400\'>'+esc(proBrief(r.mock.pro))+'</span>':'跟随正式考配置','mock')
          : '<div class="text-sm text-slate-400 py-1.5">未开启</div>')
      +'</div>'
    +'</div>'
    +'<div class="px-6 py-3 border-t border-slate-100 flex justify-end gap-2 flex-shrink-0">'
      +'<button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">关闭</button>'
      +'<button onclick="gotoEdit(\''+k+'\')" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white"><i class="fa-solid fa-pen mr-1"></i>去单条编辑</button>'
    +'</div></div></div>';
  $('modalRoot').innerHTML=html;
}
function gotoEdit(k){ const r=rows.find(x=>x._k===k); toast('跳转单条编辑（demo 不实际跳转）：'+r.name); }

/* ================= Toast ================= */
function toast(msg, type){
  const t=document.createElement('div');
  t.className='bg-white border shadow-popover px-4 py-2.5 rounded-lg text-sm flex items-center gap-2 '+(type==='error'?'border-red-200 text-red-600':'border-slate-200 text-slate-700');
  t.innerHTML=(type==='error'?'<i class="fa-solid fa-circle-exclamation text-red-500"></i>':'<i class="fa-solid fa-circle-check text-emerald-500"></i>')+esc(msg);
  $('toastBox').appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function closeModal(){ $('modalRoot').innerHTML=''; }

/* ================= 行操作：重试 / 补关联 ================= */
function retryRow(k){
  const r=rows.find(x=>x._k===k); if(!r) return;
  r.status='创建中'; save(); renderAll();
  setTimeout(()=>{ r.status='已创建'; delete r.failReason; save(); renderAll(); toast('重试成功：爱测评考试已创建（'+r.name+'）'); }, 1600);
}
function linkPaper(k){
  const r=rows.find(x=>x._k===k); if(!r) return;
  openModalHtml('<div class="max-w-md w-full bg-white rounded-xl shadow-popover modal-enter p-6">'
    +'<div class="font-bold mb-4">补关联爱测评试卷</div>'
    +'<div class="text-sm text-slate-500 mb-3">'+esc(r.name)+'<span class="text-xs font-mono text-slate-400 ml-2">'+esc(r.aid)+'</span></div>'
    +'<select id="lpPaper" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-4">'+PAPER_LIST.map(p=>'<option>'+p+'</option>').join('')+'</select>'
    +'<div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">取消</button>'
    +'<button onclick="doLinkPaper(\''+k+'\')" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white">保存并自动创建</button></div></div>');
}
function doLinkPaper(k){ const r=rows.find(x=>x._k===k); r.paper=$('lpPaper').value; r.status='创建中'; save(); renderAll(); closeModal();
  setTimeout(()=>{ r.status='已创建'; save(); renderAll(); toast('补关联成功：爱测评考试已创建'); }, 1600); }

function openModalHtml(h){ $('modalRoot').innerHTML='<div class="fixed inset-0 z-50 flex items-center justify-center"><div class="absolute inset-0 bg-slate-900/40 mask-enter" onclick="closeModal()"></div>'+h+'</div>'; }
</script>

<script>
/* ================= 批量修改弹窗 ================= */
const BATCH_FIELDS = [
 {f:'group',  lab:'所属分组',   type:'group'},
 {f:'fee',    lab:'报名费(元)', type:'number'},
 {f:'showStart', lab:'展示开始日期', type:'date'},
 {f:'show',   lab:'前端展示开关', type:'show'},
 {f:'name',   lab:'测评名称',   type:'text'},
 {f:'examStart', lab:'考试开始时间', type:'datetime', lock:true},
 {f:'examEnd',   lab:'考试结束时间', type:'datetime', lock:true},
 {f:'duration',  lab:'时长(分钟)', type:'number', lock:true},
 {f:'submitLimit', lab:'交卷限制(分钟)', type:'number', lock:true},
 {f:'paper',  lab:'关联试卷',   type:'paper', lock:true},
 {f:'pro',    lab:'监考配置',   type:'pro', lock:true},
 {f:'mock',   lab:'模拟考配置', type:'mock', lock:true},
];
function openBatchModal(){
  const ks=selKeys();
  const locks = ks.map(k=>lockSet(rows.find(x=>x._k===k)));
  const intersect = locks.reduce((a,s)=>new Set([...a].filter(x=>s.has(x))), new Set(BATCH_FIELDS.map(x=>x.f)));
  const items = BATCH_FIELDS.map(fd=>{
    const dis = intersect.has(fd.f);
    const ctrl = fd.type==='group' ? '<select class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" data-f="'+fd.f+'">'
        +'<option value="">不修改</option>'+ uniqueGroups().map(g=>'<option>'+esc(g)+'</option>').join('') +'</select>'
      : fd.type==='number' ? '<input type="number" class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" placeholder="不修改" data-f="'+fd.f+'">'
      : fd.type==='date' ? '<input type="date" class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" data-f="'+fd.f+'">'
      : fd.type==='datetime' ? '<input type="datetime-local" step="60" class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" placeholder="不修改" data-f="'+fd.f+'">'
      : fd.type==='show' ? '<select class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" data-f="'+fd.f+'"><option value="">不修改</option><option value="1">展示中</option><option value="0">隐藏</option></select>'
      : fd.type==='paper' ? '<select class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" data-f="'+fd.f+'"><option value="">不修改</option>'+PAPER_LIST.map(p=>'<option>'+p+'</option>').join('')+'</select>'
      : fd.type==='text' ? '<input type="text" class="bf-ctrl px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full" placeholder="不修改" data-f="'+fd.f+'">'
      : fd.type==='pro' ? '<button type="button" onclick="openProCfg(this)" class="bf-ctrl text-left px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full text-slate-400" data-f="pro" data-set="">点击配置（不修改）</button>'
      : fd.type==='mock' ? '<button type="button" onclick="openMockCfg(this)" class="bf-ctrl text-left px-2 py-1.5 rounded-lg border border-slate-200 text-sm w-full text-slate-400" data-f="mock" data-set="">点击配置（不修改）</button>'
      : '';
    return '<div class="'+(dis?'opacity-50':'')+'">'
      +'<div class="text-xs font-medium text-slate-500 mb-1 flex items-center gap-1">'+fd.lab+(dis?' <i class="fa-solid fa-lock text-amber-500 text-[10px]" title="所选行存在已开考/已报名行，该字段禁改"></i>':'')+'</div>'
      +ctrl+'</div>';
  }).join('');
  openModalHtml('<div class="bg-white rounded-xl shadow-popover modal-enter w-[640px] max-h-[86vh] flex flex-col">'
    +'<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"><div class="font-bold">批量修改 <span class="text-sm font-normal text-slate-400">已选 '+ks.length+' 行</span></div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>'
    +'<div class="flex-1 overflow-y-auto custom-scroll px-6 py-4">'
      +'<div class="bg-amber-50 border border-amber-100 text-amber-600 text-xs rounded-lg px-3 py-2 mb-4"><i class="fa-solid fa-triangle-exclamation mr-1"></i>规则：留空/「不修改」的字段保持原值；带 <i class="fa-solid fa-lock text-amber-500 text-[10px]"></i> 字段在所选行中存在考试已开始/结束或已有报名的行，本次不可改，对应行将被跳过该字段。</div>'
      +'<div class="grid grid-cols-2 gap-3">'+items+'</div>'
    +'</div>'
    +'<div class="px-6 py-3 border-t border-slate-100 flex justify-end gap-2 flex-shrink-0">'
      +'<button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-sslate-200 border-slate-200 hover:bg-slate-50">取消</button>'
      +'<button onclick="doBatch()" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">应用到 '+ks.length+' 行</button>'
    +'</div></div>');
}
function uniqueGroups(){ return [...new Set(rows.map(r=>r.group))].filter(g=>g!=='默认').concat(['默认']); }
function collectProSet(btn){ return btn.dataset.set ? JSON.parse(btn.dataset.set) : null; }

function applyCfgToBatchBtn(f, set){
  closeModal(); openBatchModal();
  const btn=document.querySelector('.bf-ctrl[data-f="'+f+'"]');
  if(btn){ btn.dataset.set=JSON.stringify(set);
    btn.className='bf-ctrl text-left px-2 py-1.5 rounded-lg border border-brand-500 text-brand-700 text-sm w-full bg-brand-50';
    btn.textContent = f==='pro' ? '已配置（点击调整）' : (set.on?('已开启模拟考'+(set.pro?'·监考自定义':'')+'（点击调整）'):'设置为不开启模拟考');
  }
}
function doBatch(){
  const ks=selKeys();
  const sets={};
  document.querySelectorAll('.bf-ctrl').forEach(el=>{
    const f=el.dataset.f; if(!f) return;
    let v;
    if(f==='pro'||f==='mock'){ v = el.dataset.set ? JSON.parse(el.dataset.set) : null; }
    else { v = el.value; }
    if(v===null || v==='') return;
    sets[f]=v;
  });
  if(!Object.keys(sets).length){ toast('未填写任何修改项','error'); return; }
  let applied=0, skipped=0;
  ks.forEach(k=>{
    const r=rows.find(x=>x._k===k); if(!r) return;
    const lock=lockSet(r); let touched=false;
    Object.entries(sets).forEach(([f,v])=>{
      if(lock.has(f)) return;
      if(f==='show') r.show = v==='1';
      else if(f==='pro') { r.pro={...r.pro,...v}; touched=true; }
      else if(f==='mock'){ r.mock={...v}; touched=true; }
      else if(f==='examStart'){ const t=v.replace('T',' '); r.examStart=t; }
      else if(f==='examEnd'){ const t=v.replace('T',' '); r.examEnd=t; }
      else r[f]=v;
      if(f!=='pro'&&f!=='mock') touched=true;
    });
    if(touched) applied++; else skipped++;
  });
  save(); renderAll();
  closeModal();
  toast('批量修改完成：'+applied+' 行已应用'+(skipped?'，'+skipped+' 行因锁定字段被跳过':''));
}

    +'<div class="flex-1 overflow-auto custom-scroll"><table class="w-full text-xs">'
      +'<thead class="bg-slate-50 sticky top-0 text-slate-500"><tr><th class="py-2 px-2 w-8"></th><th class="py-2 px-2 text-left">活动名称</th><th class="py-2 px-2 text-left">渠道</th><th class="py-2 px-2 text-left">试卷</th><th class="py-2 px-2 text-left">考试时间</th><th class="py-2 px-2 text-left">时长/交卷</th><th class="py-2 px-2 text-left">报名费</th><th class="py-2 px-2 text-left">失败原因</th></tr></thead>'
      +'<tbody>'+trs+'</tbody></table></div>'
    +'<div class="px-6 py-3 border-t border-slate-100 flex justify-between items-center flex-shrink-0">'
      +'<button onclick="upStep(2)" class="text-sm text-slate-500 hover:text-brand-600"><i class="fa-solid fa-arrow-left mr-1"></i>重新上传</button>'
      +'<button onclick="doCreate()" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium '+(okN?'':'opacity-50 pointer-events-none')+'">确认创建 '+okN+' 行</button></div></div>');
}
function doCreate(){
  const okRows=MOCK_UPLOAD_ROWS.filter(r=>r.ok);
  okRows.forEach((r,i)=>{
    const aid='HD25'+(10+i);
    rows.push({...r, aid, _k:aid+'|'+r.cid, status:'创建中', enrolled:0, tags:['Python','1级'], mock:{on:false,paper:'',start:'',end:'',limit:''}, desc:''});
  });
  save(); renderAll(); closeModal();
  toast('已提交 '+okRows.length+' 行创建任务：先建活动与渠道关联，再自动创建爱测评考试；结果见消息中心');
  setTimeout(()=>{ rows.filter(r=>r.aid==='HD2510').forEach(r=>r.status='已创建'); save(); renderAll(); }, 1800);
}

/* ================= 批量导入修改 ================= */
function openImportModal(){
  openModalHtml('<div class="bg-white rounded-xl shadow-popover modal-enter w-[640px] max-h-[86vh] flex flex-col">'
    +'<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"><div class="font-bold">批量导入修改</div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>'
    +'<div class="flex-1 overflow-y-auto custom-scroll px-6 py-6 space-y-4">'
      +'<div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center">'
        +'<i class="fa-solid fa-file-arrow-down text-3xl text-brand-500"></i>'
        +'<div class="text-sm text-slate-600 mt-3 mb-3">导出当前筛选结果为修改表（回填现有值，改动列标黄）<br><span class="text-xs text-slate-400">当前筛选：'+filterRows().length+' 行</span></div>'
        +'<button onclick="downloadTpl(\'update\')" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg"><i class="fa-solid fa-download mr-1"></i>下载修改表</button>'
      +'</div>'
      +'<div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center">'
        +'<i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300"></i>'
        +'<div class="text-sm text-slate-600 mt-3 mb-4">上传填好的修改表，按「活动ID+渠道ID」定位行，只更新填写的列</div>'
        +'<label class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg cursor-pointer">选择文件<input type="file" accept=".xlsx,.csv" class="hidden" onchange="mockImportParse(this)"></label>'
      +'</div>'
      +'<div class="bg-slate-50 border border-slate-100 rounded-lg p-3 text-xs text-slate-500 leading-relaxed">'
        +'<b class="text-slate-600">修改规则：</b>① 定位：活动ID + 渠道ID（双 ID，模板自带）；② 留空列 = 保持原值；③ 考试已开始/结束的行，考试要素列（名称/时间/时长/交卷/试卷/监考/模拟考）锁定不改；④ 已有报名的行禁改考试起止时间；⑤ 校验失败行整行跳过并标注原因。'
      +'</div>'
    +'</div></div>');
}
function mockImportParse(inp){ const f=inp.files[0]; if(!f) return; setTimeout(renderImportPreview, 300); }
const MOCK_IMPORT_ROWS = [
 {k:'HD2501|QD001', act:'报名费调价', from:'¥300', to:'¥280', ok:true},
 {k:'HD2503|QD001', act:'改分组', from:'6月批', to:'3月批', ok:true},
 {k:'HD2502|QD001', act:'改考试开始时间', from:'2026-03-21 14:00', to:'2026-03-22 14:00', ok:true},
 {k:'HD2505|QD001', act:'改关联试卷', from:'(空)', to:'C++-L1-基础卷', ok:true},
 {k:'HD2506|QD002', act:'改考试结束时间', from:'2026-03-28 11:00', to:'2026-03-29 11:00', ok:false, err:'该活动已有 145 人报名，禁改考试起止时间'},
 {k:'HD2504|QD001', act:'改时长', from:'90分钟', to:'120分钟', ok:false, err:'考试已开始/结束，考试要素已锁定（该行为演示锁定场景）'},
];
function renderImportPreview(){
  const rs=MOCK_IMPORT_ROWS.map(r=>({...r, row:rows.find(x=>x._k===r.k)}));
  const okN=rs.filter(r=>r.ok).length;
  const trs=rs.map(r=>'<tr class="border-b border-slate-100 '+(r.ok?'':'bg-red-50/50')+'">'
    +'<td class="py-2 px-2">'+(r.ok?'<i class=\'fa-solid fa-circle-check text-emerald-500\'></i>':'<i class=\'fa-solid fa-circle-xmark text-red-500\'></i>')+'</td>'
    +'<td class="py-2 px-2 font-mono text-[11px]">'+esc(r.k)+'</td>'
    +'<td class="py-2 px-2">'+esc(r.row?r.row.name:'—')+'</td>'
    +'<td class="py-2 px-2">'+esc(r.act)+'</td>'
    +'<td class="py-2 px-2 text-slate-400">'+esc(r.from)+'</td>'
    +'<td class="py-2 px-2 font-medium text-brand-700">'+esc(r.to)+'</td>'
    +'<td class="py-2 px-2 text-xs '+(r.ok?'text-slate-400':'text-red-500')+'">'+(r.ok?'—':esc(r.err))+'</td></tr>').join('');
  openModalHtml('<div class="bg-white rounded-xl shadow-popover modal-enter w-[860px] max-h-[86vh] flex flex-col">'
    +'<div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"><div class="font-bold">修改校验预览 <span class="text-sm font-normal text-slate-400">共 '+rs.length+' 行</span></div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button></div>'
    +'<div class="px-6 py-3 flex items-center gap-4 border-b border-slate-100 text-sm flex-shrink-0">'
      +'<span class="text-emerald-600 font-medium"><i class="fa-solid fa-circle-check mr-1"></i>可应用 '+okN+' 行</span>'
      +'<span class="text-red-500 font-medium"><i class="fa-solid fa-circle-xmark mr-1"></i>跳过 '+(rs.length-okN)+' 行</span></div>'
    +'<div class="flex-1 overflow-auto custom-scroll"><table class="w-full text-xs">'
      +'<thead class="bg-slate-50 sticky top-0 text-slate-500"><tr><th class="py-2 px-2 w-8"></th><th class="py-2 px-2 text-left">活动ID｜渠道ID</th><th class="py-2 px-2 text-left">活动</th><th class="py-2 px-2 text-left">修改项</th><th class="py-2 px-2 text-left">原值</th><th class="py-2 px-2 text-left">新值</th><th class="py-2 px-2 text-left">原因</th></tr></thead>'
      +'<tbody>'+trs+'</tbody></table></div>'
    +'<div class="px-6 py-3 border-t border-slate-100 flex justify-between items-center flex-shrink-0">'
      +'<span class="text-xs text-slate-400">跳过行不影响其他行应用</span>'
      +'<button onclick="doImport()" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium '+(okN?'':'opacity-50 pointer-events-none')+'">确认应用 '+okN+' 行</button></div></div>');
}
function doImport(){
  let n=0;
  MOCK_IMPORT_ROWS.forEach(r=>{ if(!r.ok) return;
    const row=rows.find(x=>x._k===r.k); if(!row) return;
    if(r.act==='报名费调价'){ row.fee=280; }
    if(r.act==='改分组'){ row.group='3月批'; }
    if(r.act==='改考试开始时间'){ row.examStart='2026-03-22 14:00'; }
    if(r.act==='改关联试卷'){ row.paper='C++-L1-基础卷'; row.status='创建中'; setTimeout(()=>{ row.status='已创建'; save(); renderAll(); }, 1800); }
    n++;
  });
  save(); renderAll(); closeModal();
  toast('批量修改已应用 '+n+' 行；触发爱测评联动的行已进入更新队列，结果见消息中心');
}

/* ================= 导出/模板下载 ================= */
function dl(name, content, mime){ const b=new Blob(['\ufeff'+content],{type:mime||'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadTpl(t){
  if(t==='create'){
    const head=['测评名称','渠道ID','渠道名称','所属分组','关联试卷','考试开始时间','考试结束时间','时长(分钟)','交卷限制(分钟)','报名费(元)','展示开始日期','展示结束日期','前端展示','摄像头监考','录屏监考','手机监考','检录照片','成绩开关','分数开关','读题开关','候考时长(分)','开启模拟考','模拟卷','模拟考开始','模拟考结束','模拟考次数','模拟考监考'];
    const demo=['Python一级·12月考期','QD001','猿编程','3月批','PY-L1-2026春-A卷','2026-12-19 09:00','2026-12-19 11:00','120','100','300','2026-10-01','','是','强制开启','强制开启','否','非强制开启','开','开','开','0','否','','','','跟随正式考'];
    dl('考试管理看板_批量新建模板.csv', [head,demo].map(r=>r.map(csvCell).join(',')).join('\n'));
    toast('模板已下载：含监考与模拟考全字段');
  } else {
    const head=['活动ID','渠道ID','测评名称','所属分组','报名费(元)','展示开始日期','展示结束日期','前端展示','关联试卷','考试开始时间','考试结束时间','时长(分钟)','交卷限制(分钟)','摄像头监考','录屏监考','手机监考','检录照片','成绩开关','分数开关','读题开关','候考时长(分)','开启模拟考','模拟卷','模拟考开始','模拟考结束','模拟考次数','模拟考监考'];
    const data=filterRows().map(r=>[r.aid,r.cid,r.name,r.group,r.fee,r.showStart,r.showEnd,r.show?'是':'否',r.paper||'',r.examStart,r.examEnd,r.duration,r.submitLimit,r.pro.cam,r.pro.rec,r.pro.phone?'开':'关',r.pro.photo,r.pro.score?'开':'关',r.pro.detail?'开':'关',r.pro.read?'开':'关',r.pro.wait,r.mock.on?'是':'否',r.mock.paper||'',r.mock.start||'',r.mock.end||'',r.mock.limit||'',r.mock.pro?'自定义':'跟随正式考']);
    dl('考试管理看板_修改表_当前筛选.csv', [head,...data].map(r=>r.map(csvCell).join(',')).join('\n'));
    toast('修改表已下载：'+data.length+' 行已回填当前值，改动列上传后生效');
  }
}
function exportCsv(){
  const head=['渠道ID','渠道名称','分组','活动ID','测评名称','关联试卷','考试开始','考试结束','时长','交卷限制','报名费','展示时间','展示','爱测评状态','报名量','摄像头','录屏','手机监考','检录照片','候考','模拟考'];
  const data=filterRows().map(r=>[r.cid,chName(r.cid),r.group,r.aid,r.name,r.paper||'',r.examStart,r.examEnd,r.duration,r.submitLimit,r.fee,(r.showStart||'')+'~'+(r.showEnd||''),r.show?'是':'否',r.status,r.enrolled,r.pro.cam,r.pro.rec,r.pro.phone?'开':'关',r.pro.photo,r.pro.wait,r.mock.on?'是':'否']);
  dl('考试管理看板_导出.csv', [head,...data].map(r=>r.map(csvCell).join(',')).join('\n'));
  toast('已导出当前筛选结果：'+data.length+' 行');
}

/* ================= 初始化 ================= */
renderAll();
</script>
