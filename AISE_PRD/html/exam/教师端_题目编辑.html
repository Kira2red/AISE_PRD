<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style class="vjs-styles-defaults">
        .video-js { width: 300px; height: 150px; }
        .vjs-fluid:not(.vjs-audio-only-mode) { padding-top: 56.25% }
    </style>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>出题后台 - AIGC 题型升级版</title>
    
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    
    <style>
        /* 保持原有页面的基础布局风格 */
        body { margin: 0; padding: 20px; background-color: #f0f2f5; font-family: "Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",Arial,sans-serif; }
        .app-container { background: #fff; padding: 20px; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0,0,0,.1); max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 16px; font-weight: 700; color: #303133; margin-bottom: 20px; border-left: 4px solid #409EFF; padding-left: 10px; }
        
        /* 题型按钮组样式 */
        .type-group-label { font-size: 14px; color: #606266; margin-right: 10px; font-weight: bold; display: inline-block; width: 80px; }
        .type-row { margin-bottom: 15px; display: flex; align-items: center; }
        
        /* 分隔符配置区样式 */
        .separator-config-box {
            border: 1px solid #DCDFE6;
            padding: 15px;
            border-radius: 4px;
            background-color: #FAFAFA;
            margin-top: 10px;
        }
        .el-tag { margin-right: 10px; margin-bottom: 5px; }
        .button-new-tag { margin-left: 10px; height: 32px; line-height: 30px; padding-top: 0; padding-bottom: 0; }
        .input-new-tag { width: 90px; margin-left: 10px; vertical-align: bottom; }
        
        /* 编辑器模拟 */
        .editor-mock { border: 1px solid #DCDFE6; border-radius: 4px; height: 200px; padding: 10px; color: #606266; background: #fff; overflow-y: auto;}
        
        /* 隐藏/显示控制 */
        .hidden { display: none; }
    </style>
</head>

<body>
    <div class="app-container">
        
        <div class="section-title">试题属性</div>
        
        <form class="el-form el-form--label-left" style="width: 100%;">
            
            <div class="el-form-item">
                <div class="type-row">
                    <span class="type-group-label">客观题类：</span>
                    <div role="group" class="el-radio-group">
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="single"><span class="el-radio-button__inner">单选题</span></label>
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="multi"><span class="el-radio-button__inner">多选题</span></label>
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="judge"><span class="el-radio-button__inner">判断题</span></label>
                    </div>
                </div>
            </div>

            <div class="el-form-item">
                <div class="type-row">
                    <span class="type-group-label">主观题类：</span>
                    <div role="group" class="el-radio-group" id="subjectiveGroup">
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="essay"><span class="el-radio-button__inner">简答题</span></label>
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="code"><span class="el-radio-button__inner">编程题</span></label>
                        
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="aigc_text"><span class="el-radio-button__inner" style="color: #67C23A; font-weight: bold;">文生文</span></label>
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="aigc_image"><span class="el-radio-button__inner" style="color: #67C23A; font-weight: bold;">文生图</span></label>
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="aigc_video"><span class="el-radio-button__inner" style="color: #67C23A; font-weight: bold;">文生视频</span></label>
                        <label class="el-radio-button el-radio-button--small"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="aigc_flow"><span class="el-radio-button__inner" style="color: #E6A23C; font-weight: bold;">工作流</span></label>
                        
                        <label class="el-radio-button el-radio-button--small is-active" id="btnHighlight"><input type="radio" class="el-radio-button__orig-radio" name="qType" value="highlight" checked><span class="el-radio-button__inner" style="color: #F56C6C; font-weight: bold; box-shadow: -1px 0 0 0 #409EFF;">划线题</span></label>
                    </div>
                </div>
            </div>

            <div class="el-form-item is-required">
                <label class="el-form-item__label" style="width: 80px;">难度：</label>
                <div class="el-form-item__content" style="margin-left: 80px;">
                    <div role="radiogroup" class="el-radio-group">
                        <label class="el-radio"><span class="el-radio__input is-checked"><span class="el-radio__inner"></span><input type="radio" class="el-radio__original" value="1"></span><span class="el-radio__label">简单</span></label>
                        <label class="el-radio"><span class="el-radio__input"><span class="el-radio__inner"></span><input type="radio" class="el-radio__original" value="2"></span><span class="el-radio__label">普通</span></label>
                        <label class="el-radio"><span class="el-radio__input"><span class="el-radio__inner"></span><input type="radio" class="el-radio__original" value="3"></span><span class="el-radio__label">困难</span></label>
                    </div>
                </div>
            </div>
        </form>

        <div class="section-title" style="margin-top: 30px;">题目内容编辑</div>
        
        <form class="el-form el-form--label-right">
            
            <div class="el-form-item is-required">
                <label class="el-form-item__label" style="width: 100px;">题干内容：</label>
                <div class="el-form-item__content" style="margin-left: 100px;">
                    <div class="editor-mock" contenteditable="true">
                        <p>请仔细阅读以下文本，点击文中标点符号分隔的错误语句：</p>
                        <p>冒泡排序是一种基础算法，它的时间复杂度通常是O(1)，这显然是错误的。</p>
                    </div>
                    <div style="font-size: 12px; color: #909399; margin-top: 5px;">支持富文本编辑，可插入图片、公式。</div>
                </div>
            </div>

            <div id="highlightConfig" class="el-form-item is-required" style="display: block;">
                <label class="el-form-item__label" style="width: 100px; color: #F56C6C; font-weight: bold;">分隔符配置：</label>
                <div class="el-form-item__content" style="margin-left: 100px;">
                    <div class="separator-config-box">
                        <div style="margin-bottom: 10px; font-size: 14px; color: #606266;">
                            <i class="el-icon-info" style="color: #409EFF;"></i> 
                            系统将使用以下符号作为界限，将题干文本切分为可点击的片段。
                        </div>
                        
                        <span class="el-tag">中文逗号 (，)<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">英文逗号 ( , )<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">中文句号 (。)<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">英文句号 ( . )<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">中文问号 (？)<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">英文问号 ( ? )<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">中文分号 (；)<i class="el-tag__close el-icon-close"></i></span>
                        <span class="el-tag">英文分号 ( ; )<i class="el-tag__close el-icon-close"></i></span>
                        
                        <button type="button" class="el-button el-button--primary el-button--small button-new-tag is-plain" onclick="addTag()">+ 新增符号</button>
                    </div>
                </div>
            </div>

            <div class="el-form-item">
                <label class="el-form-item__label" style="width: 100px;">答案解析：</label>
                <div class="el-form-item__content" style="margin-left: 100px;">
                    <textarea class="el-textarea__inner" rows="4" placeholder="请输入参考答案或解析说明..."></textarea>
                </div>
            </div>

            <div class="el-form-item">
                <label class="el-form-item__label" style="width: 100px;">可见范围：</label>
                <div class="el-form-item__content" style="margin-left: 100px;">
                    <label class="el-checkbox"><span class="el-checkbox__input is-checked"><span class="el-checkbox__inner"></span><input type="checkbox" class="el-checkbox__original" value="all" checked></span><span class="el-checkbox__label">全员可见</span></label>
                </div>
            </div>

            <div class="el-form-item">
                <div class="el-form-item__content" style="margin-left: 100px; margin-top: 30px;">
                    <button type="button" class="el-button el-button--primary"><span>保存题目</span></button>
                    <button type="button" class="el-button el-button--default"><span>取消</span></button>
                </div>
            </div>

        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var radios = document.getElementsByName('qType');
            var highlightConfig = document.getElementById('highlightConfig');
            var radioLabels = document.querySelectorAll('.el-radio-button');

            // 绑定点击事件
            for(var i = 0; i < radios.length; i++) {
                radios[i].addEventListener('change', function() {
                    // 1. 处理按钮样式 (模拟 Element UI 的 active 状态切换)
                    radioLabels.forEach(function(label) {
                        label.classList.remove('is-active');
                        // 移除阴影hack
                        var inner = label.querySelector('.el-radio-button__inner');
                        if(inner) inner.style.boxShadow = 'none';
                    });
                    this.parentElement.classList.add('is-active');
                    this.nextElementSibling.style.boxShadow = '-1px 0 0 0 #409EFF';

                    // 2. 处理“划线题”特殊逻辑
                    if (this.value === 'highlight') {
                        highlightConfig.style.display = 'block';
                        // 模拟高亮一下配置区
                        highlightConfig.style.animation = 'highlightPulse 0.5s';
                    } else {
                        highlightConfig.style.display = 'none';
                    }
                });
            }
        });

        // 模拟添加标签
        function addTag() {
            var val = prompt("请输入新的分隔符：");
            if(val) {
                var btn = document.querySelector('.button-new-tag');
                var newTag = document.createElement('span');
                newTag.className = 'el-tag';
                newTag.innerHTML = val + '<i class="el-tag__close el-icon-close"></i>';
                btn.parentNode.insertBefore(newTag, btn);
            }
        }
    </script>

    <style>
        @keyframes highlightPulse {
            0% { background-color: transparent; }
            50% { background-color: #ecf5ff; }
            100% { background-color: transparent; }
        }
    </style>
</body>
</html>
