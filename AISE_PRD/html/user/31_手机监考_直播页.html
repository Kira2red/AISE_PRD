<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手机监考</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overscroll-behavior: none;
            touch-action: manipulation;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden;
        }
        video {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; height: 100dvh;
            object-fit: cover;
        }
        .overlay-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            transition: all 0.15s;
        }
        .overlay-btn:active { background: rgba(0,0,0,0.65); transform: scale(0.93); }
        .pill {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 12px; color: #fff;
        }
        .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    </style>
</head>
<body>

    <video id="camera" autoplay playsinline muted></video>

    <!-- Fallback: no camera -->
    <div id="fallback" class="fixed inset-0 flex flex-col items-center justify-center text-slate-400 hidden bg-[#0f172a]">
        <i class="fa-solid fa-video-slash text-4xl mb-3"></i>
        <p class="text-sm font-medium mb-1">无法访问摄像头</p>
        <p class="text-xs mb-4">请检查权限设置后重试</p>
        <button onclick="startCamera()" class="px-5 py-2 bg-white/10 border border-white/20 text-white text-sm rounded-full">重试</button>
    </div>

    <!-- Top-left: recording indicator + timer -->
    <div class="fixed top-4 left-4 pill z-10">
        <span class="rec-dot"></span>
        <span>监考中</span>
        <span class="text-white/40 mx-0.5">·</span>
        <span id="timer">00:00</span>
    </div>

    <!-- Top-right: network status -->
    <div class="fixed top-4 right-4 pill z-10" id="net-pill">
        <span class="w-1.5 h-1.5 rounded-full bg-green-400" id="net-dot"></span>
        <span id="net-text">正常</span>
    </div>

    <!-- Bottom-right: flip camera -->
    <div class="fixed bottom-6 right-4 z-10">
        <button onclick="flipCamera()" class="overlay-btn">
            <i class="fa-solid fa-camera-rotate text-lg"></i>
        </button>
    </div>

    <!-- Bottom-left: stop -->
    <div class="fixed bottom-6 left-4 z-10">
        <button onclick="stopStreaming()" class="pill !text-xs cursor-pointer hover:bg-red-500/40 transition" style="padding:7px 14px;">
            <i class="fa-solid fa-stop text-[10px] mr-1"></i> 停止
        </button>
    </div>

    <script>
        let stream = null;
        let facingMode = 'environment';
        let timerInterval = null;
        let seconds = 0;

        function startCamera() {
            const video = document.getElementById('camera');
            const fallback = document.getElementById('fallback');
            const constraints = {
                video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            };
            if (stream) { stream.getTracks().forEach(t => t.stop()); }
            navigator.mediaDevices.getUserMedia(constraints)
                .then(s => {
                    stream = s;
                    video.srcObject = s;
                    video.style.display = 'block';
                    fallback.classList.add('hidden');
                    startTimer();
                })
                .catch(() => {
                    video.style.display = 'none';
                    fallback.classList.remove('hidden');
                });
        }

        function flipCamera() {
            facingMode = (facingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').textContent =
                    String(Math.floor(seconds/60)).padStart(2,'0') + ':' +
                    String(seconds%60).padStart(2,'0');
            }, 1000);
        }

        function stopStreaming() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('camera').style.display = 'none';
            document.getElementById('fallback').classList.remove('hidden');
            document.getElementById('timer').textContent = '00:00';
        }

        // Network check
        setInterval(() => {
            const dot = document.getElementById('net-dot');
            const text = document.getElementById('net-text');
            if (!navigator.onLine) {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-red-400';
                text.textContent = '断开';
                return;
            }
            const img = new Image();
            const t0 = Date.now();
            img.onload = () => {
                const ok = Date.now() - t0 < 600;
                dot.className = 'w-1.5 h-1.5 rounded-full ' + (ok ? 'bg-green-400' : 'bg-yellow-400');
                text.textContent = ok ? '正常' : '波动';
            };
            img.onerror = () => {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-yellow-400';
                text.textContent = '波动';
            };
            img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7?' + Date.now();
        }, 8000);

        // Pause timer when hidden
        document.addEventListener('visibilitychange', () => {
            document.hidden ? clearInterval(timerInterval) : startTimer();
        });

        startCamera();
    </script>
</body>
</html>
