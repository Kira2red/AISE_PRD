<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名成功 - AISE 测评报名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
    <style>body{background-color:#F1F5F9;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
        <div class="p-8 sm:p-10">

            <!-- 成功标识 -->
            <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-full bg-green-50 text-green-600 flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-circle-check text-4xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 mb-1">报名成功</h1>
                <p class="text-sm text-slate-500">支付已完成，系统已确认您的报考信息</p>
            </div>

            <!-- 报名信息摘要 -->
            <div class="bg-slate-50 rounded-xl p-5 mb-6 text-sm">
                <!-- 状态 + 准考证号 -->
                <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-3">
                    <span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-600">已确认</span>
                    <div class="text-right">
                        <span class="text-slate-400 text-xs">准考证号</span>
                        <span class="font-mono font-bold text-slate-800 ml-2">EXM2026072759000008</span>
                    </div>
                </div>
                <div class="flex justify-between py-2"><span class="text-slate-400">测评名称</span><span class="text-slate-800 font-medium">Python 程序设计（一级）</span></div>
                <div class="flex justify-between py-2 border-t border-slate-100"><span class="text-slate-400">学生姓名</span><span class="text-slate-800 font-medium">张三</span></div>
                <div class="flex justify-between py-2 border-t border-slate-100"><span class="text-slate-400">支付金额</span><span class="text-slate-800 font-medium">¥199.00</span></div>
                <div class="flex justify-between py-2 border-t border-slate-100"><span class="text-slate-400">支付时间</span><span class="text-slate-800 font-medium">2026-07-27 14:32:05</span></div>
                <div class="flex justify-between py-2 border-t border-slate-100"><span class="text-slate-400">测评时长</span><span class="text-slate-800 font-medium">60 分钟</span></div>
                <div class="flex justify-between py-2 border-t border-slate-100"><span class="text-slate-400">测评时间</span><span class="text-slate-800 font-medium">2026-08-22 20:28 — 2026-08-31 13:59</span></div>
            </div>

            <!-- 准考证按钮 -->
            <div class="flex gap-3 mb-6">
                <button class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-semibold text-sm hover:bg-slate-800 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i>下载准考证
                </button>
                <button class="flex-1 bg-white border border-slate-200 text-slate-600 py-3 rounded-xl font-medium text-sm hover:bg-slate-50 transition flex items-center justify-center gap-2">
                    <i class="fa-regular fa-eye"></i>在线查看
                </button>
            </div>

            <a href="02_测评项目.html" class="block w-full bg-white border border-slate-200 text-slate-600 py-3 rounded-xl font-medium text-sm hover:bg-slate-50 transition text-center">返回首页</a>

            <p class="text-xs text-slate-300 mt-6 text-center">退费政策：报名截止日前可全额退费，截止日后不予退费。如有疑问请联系客服。</p>
        </div>
    </div>

</body>
</html>
