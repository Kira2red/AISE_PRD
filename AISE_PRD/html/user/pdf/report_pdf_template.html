<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AISE 考级报告 PDF 模板</title>
    <style>
        /* ===== A4 打印样式（未来线上 PDF 样式基准） ===== */
        @page { size: A4; margin: 14mm 15mm 16mm; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #0f1835; font-size: 14px; line-height: 1.65; background: #fff; }
        .page { max-width: 180mm; margin: 0 auto; }
        .no-print { display: none; }

        /* 报告头 */
        .report-head { border-bottom: 3px solid #8777d3; padding-bottom: 14px; margin-bottom: 18px; }
        .report-head .topline { display: flex; justify-content: space-between; align-items: flex-start; }
        .report-title { font-size: 22px; font-weight: 800; color: #0f1835; letter-spacing: 0.5px; }
        .report-title .level { color: #705fd2; }
        .chip { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; vertical-align: middle; margin-left: 8px; }
        .chip-green { background: #e7f8f2; color: #14966f; border: 1px solid #b9ecd9; }
        .chip-pink { background: #fdecec; color: #e0484f; border: 1px solid #f6c1c3; }
        .chip-orange { background: #fdf3e3; color: #c07f16; border: 1px solid #f5dcb0; }
        .chip-blue { background: #e8edfd; color: #2555e7; border: 1px solid #c4d0f7; }
        .chip-purple { background: #f0edfb; color: #705fd2; border: 1px solid #d9d3f1; }
        .chip-gray { background: #f1f2f4; color: #606471; border: 1px solid #e0e1e5; }
        .stu-line { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
        .stu-info { font-size: 14px; color: #212845; }
        .stu-info b { font-size: 15px; color: #0f1835; }
        .score-block { text-align: right; }
        .score-block .label { font-size: 11px; color: #8a8a90; }
        .score-block .score { font-size: 26px; font-weight: 800; line-height: 1.2; }
        .score-block .grade { font-size: 17px; font-weight: 700; }

        /* 模块 */
        .mod { margin-bottom: 20px; }
        .mod-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #0f1835; margin-bottom: 10px; }
        .mod-title .bar { width: 4px; height: 16px; border-radius: 2px; background: linear-gradient(180deg, #8777d3, #705fd2); }
        .card { background: #faf9fe; border: 1px solid #e7e5f4; border-radius: 12px; padding: 14px 16px; }

        /* 成长区间 */
        .stage-track { display: flex; width: 100%; height: 34px; border-radius: 10px; overflow: hidden; position: relative; margin: 12px 0 6px; }
        .stage-seg { height: 100%; }
        .stage-labels { display: flex; }
        .stage-labels div { text-align: center; font-size: 11px; color: #8a8a90; }
        .stage-labels div.active { font-weight: 700; color: #705fd2; }
        .stage-pos { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: #705fd2; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(15,24,53,0.3); }
        .stage-note { font-size: 12px; color: #606471; margin-top: 8px; }
        .summary { background: #f5f6f8; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #212845; margin-top: 12px; }
        .summary i { color: #aaa8e1; margin-right: 6px; }

        /* 知识点 */
        .kp-group { margin-bottom: 10px; }
        .kp-group:last-child { margin-bottom: 0; }
        .kp-mod { font-size: 13px; font-weight: 700; color: #212845; margin-bottom: 4px; }
        .kp-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; }
        .kp-row .right { display: flex; align-items: center; gap: 8px; }
        .kp-pct { font-weight: 700; font-size: 12px; }
        .pct-ok { color: #14966f; }
        .pct-bad { color: #c07f16; }

        /* 表现 */
        .q-no { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .q-stem { font-size: 13.5px; color: #0f1835; margin-bottom: 8px; }
        .q-opt { display: flex; align-items: center; border: 1px solid #dddbea; border-radius: 8px; padding: 5px 10px; font-size: 13px; margin-bottom: 5px; }
        .q-opt b { margin-right: 6px; }
        .q-opt.stu { border-color: #f0646b; background: #fdecec; color: #e0484f; }
        .q-opt.cor { border-color: #14966f; background: #e7f8f2; color: #14966f; }
        .q-opt .tag { margin-left: auto; font-size: 11px; font-weight: 600; }
        .code-block { background: #1d1d1e; color: #e9e9e9; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
        .code-trunc { background: #1d1d1e; color: #8a8a90; font-size: 11px; border-radius: 0 0 10px 10px; padding: 4px 14px 10px; margin-top: -6px; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
        .q-tip { border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
        .tip-ok { background: #f0edfb; color: #705fd2; }
        .tip-bad { background: #fdecec; color: #e0484f; }

        /* 建议 */
        .adv { border: 1px solid #e7e5f4; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; background: #faf9fe; }
        .adv.course { background: #f4f8fe; border-color: #dfe7fb; }
        .adv .t { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .adv .c { font-size: 13px; color: #212845; }

        /* 空态 */
        .empty { border: 1px dashed #c2bbe1; border-radius: 10px; padding: 22px; text-align: center; color: #8a8a90; font-size: 13px; }

        /* 页脚 */
        .report-foot { margin-top: 22px; padding-top: 10px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 11px; color: #a6a7af; }
    </style>
</head>
<body>
    <div class="page" id="page"><!-- JS 渲染 --></div>
    <script>
    /* ===== 考生数据（与 29_考级报告.html 演示数据同源） ===== */
    const STUDENTS = [
    { id:'liming', name:'李明', level:'程序设计四级', date:'2026年6月', score:100,
      knowledge:[
        {mod:'Python运算', pts:[['比较运算',100],['布尔值',100],['算术运算',100]]},
        {mod:'流程控制', pts:[['条件分支',100],['循环',100],['IPO编程',100]]},
        {mod:'常用标准库', pts:[['模块导入',100]]},
        {mod:'编程基础', pts:[['变量',100],['数据类型转换',100],['数据类型',100],['input()语句',100],['print()语句',100]]}
      ],
      performance:{ full:true,
        coding:{ no:'第13题', kp:'IPO编程', code:[
          'name = input("请输入你的名字：")',
          'age = int(input("请输入你的年龄："))',
          'year = 2026 - age',
          'print(name + "，你好！")',
          'print("你大约出生于" + str(year) + "年")',
          'print("欢迎参加 AISE 考级！")'
        ]} } },
    { id:'wangfang', name:'王芳', level:'程序设计四级', date:'2026年6月', score:76,
      knowledge:[
        {mod:'Python运算', pts:[['比较运算',45],['布尔值',100],['算术运算',80]]},
        {mod:'流程控制', pts:[['条件分支',50],['循环',75],['IPO编程',100]]},
        {mod:'常用标准库', pts:[['模块导入',100]]},
        {mod:'编程基础', pts:[['变量',100],['数据类型转换',60],['数据类型',100],['input()语句',100],['print()语句',100]]}
      ],
      performance:{ full:false,
        objective:{ no:'第3题', type:'单选题', kp:'布尔值', scoreText:'0 / 4 分',
          stem:'在 Python 中，表达式 3 > 5 的运算结果是？',
          options:['True','False','3','5'], student:0, correct:1 },
        coding:{ no:'第12题', kp:'循环', scoreText:'6 / 10 分', code:[
          'count = 0',
          'while count < 5:',
          '    print(count)',
          'print("循环结束")'
        ]} } },
    { id:'zhangwei', name:'张伟', level:'程序设计四级', date:'2026年6月', score:45,
      knowledge:[
        {mod:'Python运算', pts:[['比较运算',40],['布尔值',50],['算术运算',100]]},
        {mod:'流程控制', pts:[['条件分支',30],['循环',45],['IPO编程',60]]},
        {mod:'常用标准库', pts:[['模块导入',0]]},
        {mod:'编程基础', pts:[['变量',100],['数据类型转换',40],['数据类型',80],['input()语句',50],['print()语句',100]]}
      ],
      performance:{ full:false,
        objective:{ no:'第2题', type:'单选题', kp:'条件分支', scoreText:'0 / 4 分',
          stem:'下列哪个关键字用于在 Python 中编写条件判断？',
          options:['for','if','print','input'], student:2, correct:1 },
        coding:{ no:'第11题', kp:'IPO编程', scoreText:'3 / 10 分', code:[
          'a = input()',
          'print(a)'
        ]} } },
    { id:'chenchen', name:'陈晨', level:'程序设计四级', date:'2026年6月', score:68,
      knowledge:null,
      performance:{ full:false, objectiveOnly:true,
        objective:{ no:'第5题', type:'单选题', kp:'算术运算', scoreText:'0 / 4 分',
          stem:'在 Python 中，表达式 7 % 3 的运算结果是？',
          options:['1','2','2.5','3'], student:2, correct:0 },
        coding:null } }
    ];

    const STAGES = [
        { n:'初步形成', w:30, c:15 }, { n:'稳步接近', w:30, c:45 },
        { n:'目标达成', w:20, c:70 }, { n:'熟练掌握', w:10, c:85 }, { n:'高阶表现', w:10, c:95 }
    ];
    const SUMMARY = {
        '待提升':'综合本次考级表现，本级基础正在逐步形成，建议继续巩固核心任务。',
        '合格':'综合本次考级表现，已达到本级基本要求，可继续巩固并拓展。',
        '良好':'综合本次考级表现，已较稳定达到本级要求，可进一步提升综合应用。',
        '优秀':'综合本次考级表现，已高质量完成本级主要任务，可继续挑战更复杂的综合任务。'
    };
    const ADVICE = {
        pass:{ link:'建议继续学习列表、字典及循环分支嵌套，构建更复杂的程序逻辑，衔接五级。',
               course:'建议通过更完整的项目练习，提升复杂逻辑设计和问题解决能力。' },
        fail:{ link:'建议先巩固四级，继续学习列表、字典及循环分支嵌套，练习构建复杂程序逻辑。',
               course:null }
    };
    const FULL_COMMENT = '本题目作答达到要求，完整完成任务。太棒了！';

    function gradeOf(s){
        if(s < 30) return { pass:false, grade:'待提升', stage:0 };
        if(s < 60) return { pass:false, grade:'待提升', stage:1 };
        if(s < 70) return { pass:true,  grade:'合格',   stage:2 };
        if(s < 80) return { pass:true,  grade:'良好',   stage:3 };
        return { pass:true, grade:'优秀', stage:4 };
    }
    function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function codeHtml(lines){
        const shown = lines.slice(0, 5);
        let html = '<div class="code-block">' + shown.map(esc).join('\n') + '</div>';
        if(lines.length > 5) html += '<div class="code-trunc">··· 作答代码较长，仅展示前 5 行 ···</div>';
        return html;
    }

    function render(stu){
        const g = gradeOf(stu.score);
        const chip = g.pass
            ? '<span class="chip chip-green">通过</span>'
            : '<span class="chip chip-pink">未通过</span>';
        const gc = { '待提升':'#c07f16', '合格':'#2555e7', '良好':'#14966f', '优秀':'#705fd2' }[g.grade];

        // 成长区间
        const pos = Math.min(97, stu.score === 100 ? 100 : STAGES[g.stage].c);
        let segs = '', labels = '';
        const shades = ['#e3e0f5','#cfc9ee','#aaa8e1','#8777d3','#705fd2'];
        STAGES.forEach(function(s, i){
            const active = i === g.stage;
            segs += '<div class="stage-seg" style="width:'+s.w+'%;background:'+(active ? 'linear-gradient(180deg,'+shades[i]+',#5bc8e8)' : shades[i])+';opacity:'+(active?'1':'0.45')+'"></div>';
            labels += '<div style="width:'+s.w+'%" class="'+(active?'active':'')+'">'+s.n+'</div>';
        });

        // 知识点
        let kpHtml = '';
        if(!stu.knowledge){
            kpHtml = '<div class="empty">本场考试题目暂未配置知识点标签，暂无知识点掌握数据。</div>';
        } else {
            stu.knowledge.forEach(function(m){
                const sorted = m.pts.slice().sort(function(a,b){
                    const wa = a[1] >= 60 ? 1 : 0, wb = b[1] >= 60 ? 1 : 0;
                    return wa - wb;
                });
                let rows = '';
                sorted.forEach(function(p){
                    const ok = p[1] >= 60;
                    rows += '<div class="kp-row"><span>'+esc(p[0])+'</span>'
                      + '<span class="right"><span class="kp-pct '+(ok?'pct-ok':'pct-bad')+'">'+p[1]+'%</span>'
                      + '<span class="chip '+(ok?'chip-green':'chip-orange')+'">'+(ok?'稳定掌握':'重点提升')+'</span></span></div>';
                });
                kpHtml += '<div class="kp-group"><div class="kp-mod">'+esc(m.mod)+'</div>'+rows+'</div>';
            });
        }

        // 表现
        let perfHtml = '';
        const p = stu.performance;
        if(p.full){
            if(p.coding){
                perfHtml += '<div class="q-no"><span class="chip chip-purple">'+esc(p.coding.no)+' · 编程题</span><span class="chip chip-green">满分高光</span></div>'
                  + '<div style="font-size:12px;color:#606471;margin-bottom:4px;font-weight:600;">你的作答</div>'+codeHtml(p.coding.code)
                  + '<div class="q-tip tip-ok">'+FULL_COMMENT+'</div>';
            }
        } else {
            if(p.objective){
                const o = p.objective, letters = ['A','B','C','D'];
                let opts = '';
                o.options.forEach(function(t, i){
                    let cls = '', tag = '';
                    if(i === o.student){ cls = ' stu'; tag = '<span class="tag" style="color:#e0484f">你的作答</span>'; }
                    if(i === o.correct){ cls = ' cor'; tag = '<span class="tag" style="color:#14966f">正确答案</span>'; }
                    opts += '<div class="q-opt'+cls+'"><b>'+letters[i]+'.</b>'+esc(t)+tag+'</div>';
                });
                perfHtml += '<div class="q-no"><span class="chip chip-purple">'+esc(o.no)+' · '+esc(o.type)+'</span><span class="chip chip-gray">得分 '+esc(o.scoreText)+'</span></div>'
                  + '<div class="q-stem">'+esc(o.stem)+'</div>'+opts
                  + '<div class="q-tip tip-bad">建议重点提升【'+esc(o.kp)+'】。</div>';
            }
            if(p.coding){
                perfHtml += '<div class="q-no" style="margin-top:12px;"><span class="chip chip-purple">'+esc(p.coding.no)+' · 编程题</span><span class="chip chip-gray">得分 '+esc(p.coding.scoreText)+'</span></div>'
                  + '<div style="font-size:12px;color:#606471;margin-bottom:4px;font-weight:600;">你的作答</div>'+codeHtml(p.coding.code)
                  + '<div class="q-tip tip-bad">建议重点提升【'+esc(p.coding.kp)+'】。</div>';
            }
            if(!perfHtml) perfHtml = '<div class="empty">本次考试无错题。</div>';
        }

        // 建议
        const a = g.pass ? ADVICE.pass : ADVICE.fail;
        let advHtml = '<div class="adv"><div class="t">考级衔接</div><div class="c">'+a.link+'</div></div>';
        if(a.course) advHtml += '<div class="adv course"><div class="t">课程学习建议</div><div class="c">'+a.course+'</div></div>';

        document.getElementById('page').innerHTML =
          '<div class="report-head">'
          + '<div class="topline"><div class="report-title"><span class="level">'+esc(stu.level)+'</span>考级报告'+chip+'</div>'
          + '<div style="font-size:11px;color:#8a8a90;text-align:right;">AISE 能力评定报告<br>'+esc(stu.date)+'</div></div>'
          + '<div class="stu-line"><div class="stu-info">考生：<b>'+esc(stu.name)+'</b>　·　'+esc(stu.level)+'</div>'
          + '<div class="score-block"><div class="label">正式总分</div><div class="score" style="color:'+gc+'">'+stu.score+'<span style="font-size:13px;font-weight:500;color:#8a8a90;"> 分</span></div>'
          + '<div class="grade" style="color:'+gc+'">'+g.grade+'</div></div></div></div>'

          + '<div class="mod"><div class="mod-title"><span class="bar"></span>考级结果概览</div>'
          + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;"><span class="chip chip-purple">报告等级 · '+g.grade+'</span>'
          + '<span class="chip '+(g.pass?'chip-blue':'chip-orange')+'">成长区间 · '+STAGES[g.stage].n+'</span></div>'
          + '<div class="stage-track">'+segs+'<div class="stage-pos" style="left:'+pos+'%"></div></div>'
          + '<div class="stage-labels">'+labels+'</div>'
          + '<div class="stage-note">本次考级所处阶段：<b style="color:#0f1835;">'+STAGES[g.stage].n+'</b></div>'
          + '<div class="summary">'+SUMMARY[g.grade]+'</div></div>'

          + '<div class="mod"><div class="mod-title"><span class="bar"></span>知识点掌握情况</div>'
          + '<div class="card">'+kpHtml+'</div>'
          + '<div style="font-size:11px;color:#8a8a90;margin-top:5px;">掌握率 ≥60% 为稳定掌握，&lt;60% 为重点提升</div></div>'

          + '<div class="mod"><div class="mod-title"><span class="bar"></span>考级具体表现</div>'
          + '<div class="card">'+perfHtml+'</div></div>'

          + '<div class="mod"><div class="mod-title"><span class="bar"></span>下一阶段建议</div>'+advHtml+'</div>'

          + '<div class="report-foot"><span>AISE 程序设计等级考试 · 个人报告</span><span>报告生成日期：'+stu.date+' · 本报告由考试系统自动生成</span></div>';
    }

    const id = new URLSearchParams(location.search).get('id') || 'liming';
    const stu = STUDENTS.find(function(s){ return s.id === id; }) || STUDENTS[0];
    render(stu);
    document.title = 'AISE考级报告_' + stu.name;
    </script>
</body>
</html>
