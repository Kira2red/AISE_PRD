<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试报名 - 填写信息步骤演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    },
                    boxShadow: { 'card': '0 20px 40px -10px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F1F5F9; -webkit-font-smoothing: antialiased; }
        input[type="file"] { display: none; }
        
        /* 错误震动动画 */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-1px, 0, 0); } 
            20%, 80% { transform: translate3d(2px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 
            40%, 60% { transform: translate3d(4px, 0, 0); } 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-card overflow-hidden border border-slate-100">
        
        <div class="bg-slate-50 border-b border-slate-200 p-4 flex items-center gap-4 text-sm text-slate-500">
            <span class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></div> 1. 报名须知</span>
            <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
            <span class="flex items-center gap-2 font-bold text-brand-600"><div class="w-6 h-6 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs">2</div> 填写信息</span>
            <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
            <span>3. 确认信息</span>
        </div>

        <div class="p-6 sm:p-10">
            <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-1 h-6 bg-brand-600 rounded-full"></span> 基础信息填写
            </h2>

            <form id="info-form" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">考生姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="input-name" value="张三" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">性别 <span class="text-red-500">*</span></label>
                    <select id="input-gender" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium bg-white transition">
                        <option value="男" selected>男</option>
                        <option value="女">女</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">证件信息 <span class="text-red-500">*</span></label>
                    <div class="flex shadow-sm rounded-xl" id="id-group">
                        <div class="relative w-1/3 sm:w-1/4">
                            <select id="input-id-type" class="w-full appearance-none pl-4 pr-8 py-3 bg-slate-50 border border-slate-200 border-r-0 rounded-l-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-100 focus:z-10 outline-none text-sm font-bold text-slate-700 transition" onchange="updatePlaceholder()">
                                <option value="id_cn">居民身份证</option>
                                <option value="hk_perm">香港永久居民证</option>
                                <option value="mo_id">澳门居民身份证</option>
                                <option value="passport">护照</option>
                                <option value="other">其他</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-3 top-4 text-xs text-slate-400 pointer-events-none z-20"></i>
                        </div>
                        
                        <input type="text" id="input-id-number" value="110***********1234" class="flex-1 w-2/3 px-4 py-3 border border-slate-200 rounded-r-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-100 focus:z-10 outline-none text-sm font-mono text-slate-800 transition -ml-px">
                    </div>
                    <p id="id-error-msg" class="text-xs text-red-500 mt-2 hidden flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i> <span id="id-error-text">校验未通过</span>
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">电子邮箱</label>
                    <input type="email" id="input-email" value="zhangsan@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">监护人姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="input-parent" value="李四" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">监护人电话 <span class="text-red-500">*</span></label>
                    <input type="tel" id="input-phone" value="13800138000" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-mono transition">
                </div>
            </form>

            <div class="flex justify-between pt-4 border-t border-slate-100">
                <button class="text-slate-500 px-6 py-3 rounded-xl font-medium hover:bg-slate-50 transition">上一步</button>
                <button id="btn-next" onclick="handleNextStep()" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-semibold shadow-lg hover:bg-brand-600 transition flex items-center gap-2">
                    下一步
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. Placeholder 动态更新逻辑
        function updatePlaceholder() {
            const type = document.getElementById('input-id-type').value;
            const input = document.getElementById('input-id-number');
            const placeholders = {
                'id_cn': '请输入18位身份证号',
                'hk_perm': '请输入香港永久居民证号码',
                'mo_id': '请输入澳门居民身份证号码',
                'passport': '请输入护照号码',
                'other': '请输入证件号码'
            };
            input.placeholder = placeholders[type] || '请输入证件号码';
            
            // 切换类型时，隐藏之前的错误提示
            hideError();
        }

        // 2. 隐藏错误提示
        function hideError() {
            const errorMsg = document.getElementById('id-error-msg');
            const idGroup = document.getElementById('id-group');
            errorMsg.classList.add('hidden');
            idGroup.classList.remove('ring-2', 'ring-red-500', 'border-red-500');
        }

        // 3. 显示错误提示
        function showError(msg) {
            const errorMsg = document.getElementById('id-error-msg');
            const errorText = document.getElementById('id-error-text');
            const idGroup = document.getElementById('id-group');
            
            errorText.innerText = msg;
            errorMsg.classList.remove('hidden');
            idGroup.classList.add('shake', 'ring-2', 'ring-red-500', 'border-red-500'); // 添加震动和红框
            
            // 移除震动动画类，以便下次触发
            setTimeout(() => idGroup.classList.remove('shake'), 500);
        }

        // 4. 下一步按钮处理逻辑 (核心校验)
        function handleNextStep() {
            const btn = document.getElementById('btn-next');
            const idType = document.getElementById('input-id-type').value;
            const idNumber = document.getElementById('input-id-number').value.trim();
            const name = document.getElementById('input-name').value.trim();

            // 基础非空校验
            if (!name || !idNumber) {
                alert("请补全考生姓名和证件号码");
                return;
            }

            // 逻辑分流
            if (idType === 'id_cn') {
                // 场景 A: 中国居民身份证 -> 强制触发公安实名校验
                
                // UI 进入 Loading 态
                const originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 正在进行实名核验...';
                
                // 模拟接口调用 (1.5秒延迟)
                setTimeout(() => {
                    // 模拟校验逻辑：假设输入 '111' 失败，其他通过
                    if (idNumber === '111') {
                        // 校验失败
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                        showError("实名校验未通过：身份证号与姓名不匹配，请核对。");
                    } else {
                        // 校验成功
                        btn.innerHTML = '<i class="fa-solid fa-check"></i> 核验通过';
                        btn.classList.replace('bg-slate-900', 'bg-green-500');
                        btn.classList.replace('hover:bg-brand-600', 'hover:bg-green-600');
                        
                        setTimeout(() => {
                            alert("校验通过！跳转至下一步：确认信息");
                            // 实际逻辑：window.location.href = 'next-step.html';
                            // 恢复按钮状态 (仅用于演示可重复点击)
                            btn.disabled = false;
                            btn.innerHTML = originalHtml;
                            btn.classList.replace('bg-green-500', 'bg-slate-900');
                            btn.classList.replace('hover:bg-green-600', 'hover:bg-brand-600');
                        }, 800);
                    }
                }, 1500);

            } else {
                // 场景 B: 其他证件 -> 仅做格式/非空检查
                if (idNumber.length < 5) {
                    showError("证件号码格式不正确，请检查。");
                    return;
                }
                // 直接通过
                alert("跳转至下一步：确认信息");
            }
        }
    </script>
</body>
</html>
