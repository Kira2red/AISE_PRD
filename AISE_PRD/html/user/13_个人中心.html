<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - AISE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        dark: {
                            900: '#0f172a',
                        }
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 15px -3px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC;
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* 隐藏文件上传默认样式 */
        input[type="file"] { display: none; }
        
        /* 移动端横向滚动条隐藏 */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <nav class="glass-nav fixed w-full z-50 top-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 sm:h-20">
                <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                    <div class="w-9 h-9 bg-gradient-to-br from-brand-600 to-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-md">A</div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg tracking-tight text-slate-900">AISE</span>
                    </div>
                </div>

                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-slate-500 hover:text-brand-600 font-medium text-sm transition">首页</a>
                    <a href="#" class="text-slate-500 hover:text-brand-600 font-medium text-sm transition">新闻中心</a>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 py-1 px-2 rounded-full border border-slate-100 bg-white shadow-sm cursor-pointer hover:bg-slate-50 transition">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 text-white flex items-center justify-center text-xs font-bold">张</div>
                        <span class="text-sm font-medium text-slate-700 pr-2 hidden sm:block">张三</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12 flex-grow w-full">
        <div class="flex flex-col md:flex-row gap-6 lg:gap-8">
            
            <aside class="w-full md:w-64 flex-shrink-0">
                <div class="bg-white rounded-xl shadow-card border border-slate-100 overflow-hidden md:sticky md:top-24">
                    <div class="p-4 border-b border-slate-100 md:hidden flex items-center gap-3 bg-slate-50">
                         <div class="w-10 h-10 rounded-full bg-slate-200 overflow-hidden">
                             <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ZhangSan" alt="Avatar" class="w-full h-full object-cover">
                         </div>
                         <div>
                             <p class="font-bold text-slate-900">张三</p>
                             <p class="text-xs text-slate-500">考生 ID: 20258899</p>
                         </div>
                    </div>

                    <nav class="flex md:flex-col overflow-x-auto hide-scroll p-2 md:p-3 gap-1 md:gap-2">
                        <a href="#" class="flex-shrink-0 px-4 py-3 rounded-lg bg-brand-50 text-brand-600 font-bold text-sm flex items-center gap-3 shadow-sm border border-brand-100 md:border-transparent">
                            <i class="fa-regular fa-id-card w-5 text-center"></i> 个人中心
                        </a>
                        
                        <a href="#" class="flex-shrink-0 px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-sm flex items-center gap-3 transition">
                            <i class="fa-solid fa-ticket w-5 text-center text-slate-400"></i> 我的准考证
                        </a>
                        
                        <a href="#" class="flex-shrink-0 px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-sm flex items-center gap-3 transition">
                            <i class="fa-solid fa-award w-5 text-center text-slate-400"></i> 成绩与证书
                        </a>
                    </nav>
                </div>
            </aside>

            <div class="flex-1 min-w-0">
                
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-900">编辑个人资料</h1>
                    <p class="text-sm text-slate-500 mt-1">请确保您的个人信息真实有效，这将直接影响考试报名与证书发放。</p>
                </div>

                <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
                    
                    <form id="profile-form" class="p-6 sm:p-10" onsubmit="event.preventDefault(); saveProfile();">
                        
                        <div class="flex flex-col sm:flex-row gap-8 mb-10 items-start">
                            <div class="flex-shrink-0 flex flex-col items-center mx-auto sm:mx-0">
                                <div class="relative group w-28 h-28 rounded-full bg-slate-100 border-4 border-white shadow-lg overflow-hidden cursor-pointer" onclick="document.getElementById('upload-avatar').click()">
                                    <img id="avatar-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=ZhangSan" class="w-full h-full object-cover">
                                    
                                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                        <i class="fa-solid fa-camera text-white text-xl"></i>
                                    </div>
                                    <input type="file" id="upload-avatar" accept="image/*" onchange="previewFile()">
                                </div>
                                <span class="text-xs text-slate-400 mt-3">点击更换照片</span>
                            </div>

                            <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">真实姓名</label>
                                    <input type="text" value="张三" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">性别</label>
                                    <select class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 bg-white transition">
                                        <option value="男" selected>男</option>
                                        <option value="女">女</option>
                                    </select>
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">身份证号</label>
                                    <input type="text" value="110101201501011234" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition">
                                    <p class="text-[10px] text-slate-400 mt-1">重要：此号码将作为您的唯一身份标识及初始登录密码。</p>
                                </div>
                            </div>
                        </div>

                        <div class="h-px bg-slate-100 w-full mb-8"></div>

                        <h3 class="text-base font-bold text-slate-900 mb-6 flex items-center gap-2">
                            <span class="w-1 h-4 bg-brand-500 rounded-full"></span> 联系方式
                        </h3>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">电子邮箱</label>
                                <div class="relative">
                                    <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400"></i>
                                    <input type="email" value="zhangsan@example.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">监护人姓名</label>
                                <input type="text" value="李四" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">监护人电话</label>
                                <div class="relative">
                                    <i class="fa-solid fa-phone absolute left-4 top-3.5 text-slate-400"></i>
                                    <input type="tel" value="13800138000" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition">
                                </div>
                            </div>
                        </div>

                        <div class="h-px bg-slate-100 w-full mb-8"></div>

                        <h3 class="text-base font-bold text-slate-900 mb-6 flex items-center gap-2">
                            <span class="w-1 h-4 bg-brand-500 rounded-full"></span> 寄送地址
                        </h3>

                        <div class="grid grid-cols-1 gap-6 mb-8">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">所在省市</label>
                                <input type="text" value="北京市 海淀区" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition" placeholder="省/市/区">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">详细地址</label>
                                <textarea rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-sm font-medium text-slate-800 transition resize-none" placeholder="街道、楼牌号等">中关村软件园一号楼A座</textarea>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button id="save-btn" class="w-full sm:w-auto bg-slate-900 text-white px-10 py-3.5 rounded-xl font-bold shadow-lg hover:bg-brand-600 hover:shadow-brand-500/30 transition-all duration-300 flex items-center justify-center gap-2">
                                <i class="fa-regular fa-floppy-disk"></i> 保存修改
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs">
            <p>© 2025 AISE 人工智能应用创新人才培养工程. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 头像预览
        function previewFile() {
            const preview = document.getElementById('avatar-preview');
            const file = document.querySelector('input[type=file]').files[0];
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                preview.src = reader.result;
            }, false);

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        // 保存动画
        function saveProfile() {
            const btn = document.getElementById('save-btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 保存中...';
            btn.classList.add('opacity-75', 'cursor-wait');

            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> 保存成功';
                btn.classList.remove('bg-slate-900', 'hover:bg-brand-600');
                btn.classList.add('bg-green-500', 'hover:bg-green-600');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.remove('opacity-75', 'cursor-wait', 'bg-green-500', 'hover:bg-green-600');
                    btn.classList.add('bg-slate-900', 'hover:bg-brand-600');
                }, 2000);
            }, 1000);
        }
    </script>

</body>
</html>
