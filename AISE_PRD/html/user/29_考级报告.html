           主标题 #4E39BA / 渐变条 #B6BEEF→#80C6D2 / 圆点 #5C49D6 / 代码块 #0F1A36 / 选项 #E5E8F7·#DCECEC） */
        body { background-color:#F8F8F8; -webkit-font-smoothing:antialiased; color:#333; }
        .glass-nav { background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,0.3); }

        #reportStrip { max-width:390px; margin:0 auto; }

        /* 头部卡（标题+个人信息+等级卡+总结条） */
        .head-card { background:#EEEEEE; border-radius:14px; padding:14px 14px 12px; margin-bottom:12px; }

        /* 页眉标题：两行居中 */
        .report-head { text-align:center; margin-bottom:12px; }
        .report-head .kicker { font-size:12px; color:#666; margin-bottom:6px; }
        .report-head .title { font-size:24px; font-weight:800; color:#4E39BA; line-height:1.3; }

        /* 个人信息：居中，头像+右侧文字 */
        .stu-wrap { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; }
        .stu-avatar { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,#8777D3,#705FD2); display:flex; align-items:center; justify-content:center; color:#fff; font-size:38px; flex-shrink:0; }
        .stu-info { text-align:left; }
        .stu-name { font-size:14px; font-weight:700; color:#4E39BA; display:flex; align-items:center; gap:6px; }
        .stu-age { font-size:14px; color:#FF9900; font-weight:400; }
        .stu-id { font-size:12px; color:#666; margin-top:5px; }
        .stu-school { display:inline-block; background:#F5F5F5; border:1px solid #E0E0E0; border-radius:6px; padding:4px 12px; font-size:12px; color:#666; margin-top:6px; }

        /* 等级卡：上下堆叠、浅灰底浅灰细边 */
        .grade-card { background:#F5F5F5; border:1px solid #E0E0E0; border-radius:10px; padding:8px 12px; font-size:14px; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
        .grade-card + .grade-card { margin-top:8px; }
        .grade-card .lb { color:#333; }
        .grade-card .v { font-weight:800; }
        .grade-note { border:1px dashed #D0D0D5; border-radius:6px; padding:2px 10px; font-size:12px; color:#666; margin-left:auto; width:176px; flex-shrink:0; }

        /* 总结条 */
        .summary-bar { background:#F5F5F5; border:1px solid #E0E0E0; border-radius:8px; padding:9px 12px; font-size:14px; color:#333; line-height:1.6; margin-top:8px; }

        /* 区块卡：#EEEEEE 圆角大卡（模块卡 #E2E2E2 在其中可见区分） */
        .block-card { background:#EEEEEE; border-radius:14px; padding:12px; margin-bottom:12px; }
        .mod-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
        .mod-head .bar { width:3px; height:18px; border-radius:2px; background:#4E39BA; flex-shrink:0; }
        .mod-head .t { font-size:18px; font-weight:800; color:#4E39BA; }
        .mod-head .sub { margin-left:auto; font-size:12px; color:#666; }

        /* 图表区：白底圆角 + 蓝紫实线外框 */
        .chart-card { background:#fff; border:1.5px solid #8777D3; border-radius:10px; padding:14px 12px 10px; }
        .stage-labels { display:flex; margin-top:2px; }
        .stage-labels div { text-align:center; font-size:12px; color:#666; }
        .stage-labels div.active { color:#4E39BA; font-weight:700; }

        /* 知识点模块子卡：#E2E2E2 浅灰底 + 左右亮色边缘（随模块掌握状态） */
        .kp-sub { background:#E2E2E2; border-radius:10px; border:1.5px solid #E2E2E2; border-left:3px solid #26A69A; border-right:3px solid #26A69A; padding:10px 12px; margin-bottom:8px; }
        .kp-sub.kp-warn { border-left-color:#FF9800; border-right-color:#FF9800; }
        .kp-sub:last-child { margin-bottom:0; }
        .kp-sub .m { font-size:14px; font-weight:700; color:#333; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
        .kp-pt { display:flex; align-items:center; font-size:12px; color:#666; padding:2px 0; }
        .kp-pt .tag { margin-left:auto; }
        .kp-pt .dot { width:5px; height:5px; border-radius:50%; background:#C9C9CE; margin-right:8px; flex-shrink:0; }

        /* 状态标签：圆角6 */
        .tag { display:inline-flex; align-items:center; padding:2px 10px; border-radius:6px; font-size:12px; font-weight:600; white-space:nowrap; }
        .tag-ok { background:#E0F2F1; color:#26A69A; }
        .tag-warn { background:#FFF3E0; color:#FF9800; }

        /* 题目卡：白底 */
        .q-card { background:#fff; border:1px solid #E0E0E0; border-radius:10px; padding:12px; }
        .q-card + .q-card { margin-top:12px; }
        .q-no { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
        .q-title { font-size:16px; font-weight:800; color:#333; }
        .q-stem { font-size:14px; color:#333; line-height:1.6; margin-bottom:8px; }
        .ans-label { font-size:12px; color:#999; font-weight:600; margin:10px 0 4px; }
        .q-type { display:inline-flex; align-items:center; background:#F1F2F4; color:#606471; border-radius:6px; padding:2px 10px; font-size:12px; font-weight:600; }

        /* 代码块：深海军蓝 #0F1A36 白字 */
        .code-block { background:#0F1A36; color:#fff; font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:15px; line-height:1.7; border-radius:8px; padding:10px 12px; overflow-x:auto; }
        .code-block .ln { color:#5B6280; user-select:none; display:inline-block; width:2em; margin-right:12px; text-align:right; }
        .code-block .cl { border-bottom:1px solid rgba(255,255,255,0.07); }
        .code-trunc { background:#0F1A36; color:#8A8FA8; font-size:12px; border-radius:0 0 8px 8px; padding:4px 12px 8px; margin-top:-8px; font-family:'JetBrains Mono',monospace; }

        /* 选项：2×2，标注同行右侧 */
        .opt { position:relative; display:flex; align-items:center; background:#F5F5F5; border:1px solid #E0E0E0; border-radius:8px; padding:7px 10px; font-size:14px; color:#333; }
        .opt b { margin-right:8px; }
        .opt .tag { position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:10px; font-weight:500; }
        .opt.stu { background:#E5E8F7; border:1.5px solid #4E39BA; }
        .opt.stu .tag { color:#4E39BA; }
        .opt.cor { background:#DCECEC; border:1.5px solid #14966F; }
        .opt.cor .tag { color:#14966F; font-weight:600; }

        /* 点评条 */
        .tip { background:#F5F5F5; border:1px solid #E0E0E0; border-radius:8px; padding:8px 10px; font-size:14px; color:#555; line-height:1.6; margin-top:8px; }
        .tip b { color:#FF9900; }
        .tip-ok { background:#EFEBFB; border-color:#D9D3F1; color:#705FD2; }

        /* 建议双卡 */
        .adv-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .adv-card { background:#fff; border:1px solid #E0E0E0; border-radius:10px; padding:10px 12px; }
        .adv-card .t { font-size:14px; font-weight:800; color:#4E39BA; margin-bottom:5px; }
        .adv-card .c { font-size:12px; color:#666; line-height:1.6; }

        /* 布局：PC 左报告右信息栏，手机上下 + 吸底下载 */
        .main-wrap { padding-bottom:110px; }
        .layout { display:flex; justify-content:center; align-items:flex-start; gap:40px; padding:20px 16px 40px; }
        .report-col { width:390px; flex-shrink:0; }
        .side-col { display:none; width:280px; }
        .side-card { background:#fff; border:1px solid #E5E5E5; border-radius:12px; padding:16px 18px; margin-bottom:14px; }
        .side-card .t { font-size:13px; font-weight:700; color:#4E39BA; margin-bottom:10px; }
        .side-row { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:5px 0; }
        .side-row .k { color:#999; }
        .side-row .v { color:#333; font-weight:500; }

        /* demo 调试浮球（正式版无） */

        .fab-btn { width:46px; height:46px; border-radius:50%; background:#4E39BA; color:#fff; border:0; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(78,57,186,0.35); }
        .fab-panel { display:none; background:#fff; border:1px solid #E5E5E5; border-radius:12px; padding:14px 16px; margin-bottom:12px; width:220px; }
        .fab-panel .demo-label { font-size:11px; font-weight:700; color:#4E39BA; }
        .stu-btn { display:block; width:100%; text-align:left; font-size:13px; color:#555; background:none; border:0; padding:8px 0; cursor:pointer; }
        .stu-btn .n { font-weight:600; color:#333; }
        .stu-btn .s { font-size:11px; color:#999; margin-left:6px; }
        .stu-btn::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#C9C9CE; margin-right:8px; vertical-align:1px; }
        .stu-btn.active .n { color:#4E39BA; }
        .stu-btn.active::before { background:#4E39BA; }
        @media (min-width:900px){ .demo-fab { bottom:32px; } }
        .pdf-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:11px; border-radius:10px; background:#4E39BA; color:#fff; font-size:15px; font-weight:600; cursor:pointer; border:none; transition:all .2s; }
        .pdf-btn:hover:not(:disabled) { filter:brightness(1.1); }
        .pdf-btn:disabled { opacity:.55; cursor:not-allowed; }

        .report-foot { text-align:center; font-size:12px; color:#A6A7AF; padding:4px 0 12px; line-height:1.8; }
        .empty { background:#fff; border-radius:10px; padding:18px; text-align:center; color:#8A8A90; font-size:14px; }
    </style>
</head>

    objective:{ no:'第5题', type:'单选题', title:'取余运算', kp:'算术运算', scoreText:'0 / 4 分',
      stem:'在 Python 中，表达式 7 % 3 的运算结果是？',
      options:['1','2','2.5','3'], student:2, correct:0 },
    coding:null } }
];

/* ===== 工具函数 ===== */
function gradeOf(s){
    if(s < 30) return { pass:false, grade:'待提升', stage:0 };
    if(s < 60) return { pass:false, grade:'待提升', stage:1 };
    if(s < 70) return { pass:true,  grade:'合格',   stage:2 };
    if(s < 80) return { pass:true,  grade:'良好',   stage:3 };
    return { pass:true, grade:'优秀', stage:4 };
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const GRADE_COLOR = { '待提升':'#FF9900', '合格':'#2A6CE0', '良好':'#00CC66', '优秀':'#4E39BA' };

/* ===== 分布图：起伏曲线（渐变填充）+ 中间位置圆点 + 垂直虚线 ===== */
function curveSvg(stageIdx){
    let xAcc = 0;
    const centers = STAGES.map(function(s){ const cx = xAcc + s.w * s.c / 100; xAcc += s.w; return cx; });
    const pos = centers[stageIdx];
    /* 圆点放在曲线中部高度（不在峰顶），垂直虚线落到基线 */
    const cy = 27;
    return '<svg viewBox="0 0 100 52" style="width:100%;height:auto;display:block">'
      + '<defs><linearGradient id="vgA" x1="0" y1="0" x2="1" y2="0">'
      + '<stop offset="0" stop-color="#B6BEEF"/><stop offset="1" stop-color="#80C6D2"/></linearGradient></defs>'
      + '<path d="M0,50 L0,44 C 10,26 18,18 30,18 C 40,18 44,30 52,30 C 60,30 64,14 74,14 C 84,14 88,28 96,34 C 99,37 100,41 100,44 L100,50 Z" fill="url(#vgA)" opacity="0.9"/>'
      + '<line x1="' + pos + '" y1="' + cy + '" x2="' + pos + '" y2="50" stroke="#5C49D6" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<circle cx="' + pos + '" cy="' + cy + '" r="4.5" fill="#5C49D6" stroke="#fff" stroke-width="1.5"/>'
      + '</svg>';
}
function stageLabels(stageIdx){
    let html = '';
    STAGES.forEach(function(s, i){
        html += '<div style="width:' + s.w + '%" class="' + (i === stageIdx ? 'active' : '') + '">' + s.n + '</div>';
    });
    return html;
}

/* ===== 渲染 ===== */
function renderHeadCard(stu, g){
    let html = '<div class="head-card">';
    /* 页眉标题 */
    html += '<div class="report-head">'
      + '<div class="kicker">AISE能力评定报告' + esc(stu.date) + '</div>'
      + '<div class="title">AISE' + esc(stu.level) + '能力评定报告</div></div>';
    /* 个人信息 */
    html += '<div class="stu-wrap">'
      + '<div class="stu-avatar"><i class="fa-solid fa-robot"></i></div>'
      + '<div class="stu-info">'
      + '<div class="stu-name">' + esc(stu.name) + '<i class="fa-solid fa-mars text-[13px]" style="color:#FF9900"></i><span class="stu-age">' + esc(stu.age) + '</span></div>'
      + '<div class="stu-id">' + esc(stu.idNo) + '</div>'
      + '<div class="stu-school">' + esc(stu.school) + '</div>'
      + '</div></div>';
    /* 等级卡×2 */
    const gc = GRADE_COLOR[g.grade];
    html += '<div class="grade-card"><span class="lb">本次等级：</span><span class="v" style="color:' + gc + '">' + g.grade + '</span>'
      + '<span class="grade-note">' + (g.pass ? '已达到' + esc(stu.level) + '核心要求' : '未达到本级核心要求') + '</span></div>';
    html += '<div class="grade-card"><span class="lb">同级参照：</span><span class="v" style="color:#FF9900">' + STAGES[g.stage].n + '</span>'
      + '<span class="grade-note">' + STAGE_NOTE[STAGES[g.stage].n] + '</span></div>';
    /* 总结条 */
    html += '<div class="summary-bar">' + SUMMARY[g.grade] + '</div>';
    html += '</div>';
    return html;
}

function renderViolinBlock(g){
    return '<div class="block-card">'
      + '<div class="mod-head"><span class="bar"></span><span class="t">同级参照分布</span><span class="sub">看本次表现所在区间</span></div>'
      + '<div class="chart-card">' + curveSvg(g.stage) + '<div class="stage-labels">' + stageLabels(g.stage) + '</div></div>'
      + '</div>';
}

function renderKnowledgeBlock(stu){
    let inner = '';
    if(!stu.knowledge){
        inner = '<div class="empty">本场考试题目暂未配置知识点标签，暂无知识点掌握数据。</div>';
    } else {
        stu.knowledge.forEach(function(m){
            const hasBad = m.pts.some(function(p){ return p[1] < 60; });
            /* 二级知识点排序：先「重点提升」再「稳定掌握」，同状态内保持知识树顺序 */
            const sorted = m.pts.slice().sort(function(a, b){
                const badA = a[1] < 60, badB = b[1] < 60;
                if(badA !== badB) return badA ? -1 : 1;
                return 0;
            });
            let rows = '';
            sorted.forEach(function(p){
                const bad = p[1] < 60;
                rows += '<div class="kp-pt"><span class="dot"></span><span>' + esc(p[0]) + '</span>'
                  + '<span class="tag ' + (bad ? 'tag-warn' : 'tag-ok') + '">' + (bad ? '重点提升' : '稳定掌握') + '</span></div>';
            });
            inner += '<div class="kp-sub' + (hasBad ? ' kp-warn' : '') + '"><div class="m"><span>' + esc(m.mod) + '</span></div>'
              + rows + '</div>';
        });
    }
    return '<div class="block-card">'
      + '<div class="mod-head"><span class="bar"></span><span class="t">知识点掌握情况</span></div>'
      + inner + '</div>';
}

function codeHtml(lines){
    const shown = lines.slice(0, 5);
    let rows = '';
    shown.forEach(function(l, i){ rows += '<div class="cl"><span class="ln">' + (i+1) + '</span>' + esc(l) + '</div>'; });
    let html = '<div class="code-block">' + rows + '</div>';
    if(lines.length > 5) html += '<div class="code-trunc">··· 作答代码较长，仅展示前 5 行 ···</div>';
    return html;
}

function renderPerformanceBlock(stu){
    const p = stu.performance;
    let html = '';
    /* 题头：题号 + 题目类型 */
    function qHead(q){
        return '<div class="flex items-center justify-between flex-wrap gap-2 mb-2">'
          + '<div class="q-title">' + esc(q.no) + '</div>'
          + '<span class="q-type">' + esc(q.type) + '</span></div>';
    }
    /* 题干要求 */
    function qStem(q){
        return '<div class="ans-label">题干要求</div><div class="q-stem">' + esc(q.stem) + '</div>';
    }
    if(p.full){
        if(!p.coding) return null;
        const c = p.coding;
        html = '<div class="q-card">'
          + qHead(c) + qStem(c)
          + '<div class="ans-label">你的作答</div>' + codeHtml(c.code)
          + '<div class="ans-label">标准作答</div>' + codeHtml(c.ref)
          + '<div class="tip tip-ok">' + FULL_COMMENT + '</div></div>';
    } else {
        if(p.objective){
            const o = p.objective, letters = ['A','B','C','D'];
            let opts = '';
            o.options.forEach(function(t, i){
                let cls = 'opt', tag = '';
                if(i === o.student){ cls += ' stu'; tag = '<span class="tag">·你的作答</span>'; }
                if(i === o.correct){ cls += ' cor'; tag = '<span class="tag">·参考答案</span>'; }
                opts += '<div class="' + cls + '"><b>' + letters[i] + '.</b><span>' + esc(t) + '</span>' + tag + '</div>';
            });
            html = '<div class="q-card">'
              + qHead(o) + qStem(o)
              + '<div class="ans-label">你的作答</div>'
              + '<div class="grid grid-cols-2 gap-2">' + opts + '</div>'
              + '<div class="tip">建议重点提升<b>【' + esc(o.kp) + '】</b>。</div></div>';
        }
        if(p.coding){
            const c = p.coding;
            html += '<div class="q-card">'
              + qHead(c) + qStem(c)
              + '<div class="ans-label">你的作答</div>' + codeHtml(c.code)
              + '<div class="ans-label">标准作答</div>' + codeHtml(c.ref)
              + '<div class="tip">建议重点提升<b>【' + esc(c.kp) + '】</b>。</div></div>';
        }
        if(!html) return null;
    }
    return '<div class="block-card">'
      + '<div class="mod-head"><span class="bar"></span><span class="t">本次评定表现</span><span class="sub">典型难题</span></div>'
      + html + '</div>';
}

function renderAdviceBlock(g){
    const a = g.pass ? ADVICE.pass : ADVICE.fail;
    let html = '<div class="adv-grid">'
      + '<div class="adv-card"><div class="t">考级衔接</div><div class="c">' + a.link + '</div></div>';
    if(a.course){
        html += '<div class="adv-card"><div class="t">课程学习建议</div><div class="c">' + a.course + '</div></div>';
    }
    html += '</div>';
    return '<div class="block-card">'
      + '<div class="mod-head"><span class="bar"></span><span class="t">下一阶段建议</span><span class="sub">本阶段重点</span></div>'
      + html + '</div>';
}

function renderReport(stu){
    const g = gradeOf(stu.score);
    let html = renderHeadCard(stu, g) + renderViolinBlock(g) + renderKnowledgeBlock(stu);
    const perf = renderPerformanceBlock(stu);
    if(perf) html += perf;
    html += renderAdviceBlock(g);
    document.getElementById('reportStrip').innerHTML = html;
}

/* ===== 交互 ===== */
let currentId = 'liming';
let pdfTimer = null;

/* 右侧栏：学生信息 + 考试信息（仅 PC 显示） */
function renderSideInfo(stu){
    const g = gradeOf(stu.score);
    document.getElementById('sideInfo').innerHTML =
      '<div class="side-card"><div class="t">考生信息</div>'
      + '<div class="side-row"><span class="k">姓名</span><span class="v">' + esc(stu.name) + '</span></div>'
      + '<div class="side-row"><span class="k">年龄</span><span class="v">' + esc(stu.age) + '</span></div>'
      + '<div class="side-row"><span class="k">考生ID</span><span class="v">' + esc(stu.idNo.replace('ID:','')) + '</span></div>'
      + '<div class="side-row"><span class="k">所在学校/机构</span><span class="v">' + esc(stu.school) + '</span></div>'
      + '</div>'
      + '<div class="side-card"><div class="t">考试信息</div>'
      + '<div class="side-row"><span class="k">考试项目</span><span class="v">AISE ' + esc(stu.level) + '</span></div>'
      + '<div class="side-row"><span class="k">考试时间</span><span class="v">' + esc(stu.date) + '</span></div>'
      + '<div class="side-row"><span class="k">正式总分</span><span class="v">' + stu.score + ' 分</span></div>'
      + '<div class="side-row"><span class="k">评定等级</span><span class="v">' + g.grade + ' · ' + STAGES[g.stage].n + '</span></div>'
      + '<div class="side-row"><span class="k">通过状态</span><span class="v" style="color:' + (g.pass ? '#00CC66' : '#FF9900') + '">' + (g.pass ? '已通过' : '未通过') + '</span></div>'
      + '</div>';
}

function switchStudent(id){
    currentId = id;
    const stu = STUDENTS.find(function(s){ return s.id === id; });
    if(!stu) return;
    renderReport(stu);
    renderSideInfo(stu);
    document.querySelectorAll('.stu-btn').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-id') === id);
    });
    closeFab();
    resetPdfBtn();
    window.scrollTo({ top:0, behavior:'smooth' });
}

function toggleFab(){
    const panel = document.getElementById('fabPanel');
    const btn = document.getElementById('fabBtn');
    const open = panel.style.display === 'block';
    panel.style.display = open ? 'none' : 'block';
    btn.innerHTML = open ? '<i class="fa-solid fa-flask"></i>' : '<i class="fa-solid fa-xmark"></i>';
}
function closeFab(){
    document.getElementById('fabPanel').style.display = 'none';
    document.getElementById('fabBtn').innerHTML = '<i class="fa-solid fa-flask"></i>';
}

function resetPdfBtn(){
    if(pdfTimer){ clearTimeout(pdfTimer); pdfTimer = null; }
    const btn = document.getElementById('pdfBtn');
    const btnM = document.getElementById('pdfBtnM');
    [btn, btnM].forEach(function(b){
        if(!b) return;
        b.disabled = false;
        b.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i><span>下载 PDF 报告</span>';
    });
}

function downloadPdf(){
    const btn = document.getElementById('pdfBtn');
    const btnM = document.getElementById('pdfBtnM');
    if(btn.disabled && btnM.disabled) return;
    const stu = STUDENTS.find(function(s){ return s.id === currentId; });
    if(!stu) return;
    [btn, btnM].forEach(function(b){
        if(!b) return;
        b.disabled = true;
        b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>准备下载…</span>';
    });
    pdfTimer = setTimeout(function(){
        pdfTimer = null;
        resetPdfBtn();
        const a = document.createElement('a');
        a.href = 'pdf/考级报告_' + stu.name + '_运营版.pdf';
        a.download = 'AISE考级报告_' + stu.name + '_运营版.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }, 600);
}

function initStudentBtns(){
    const box = document.getElementById('studentBtns');
    let html = '';
    STUDENTS.forEach(function(s){
        const g = gradeOf(s.score);
        const sub = s.knowledge ? (s.score + '分 · ' + g.grade) : (s.score + '分 · 无知识点');
        html += '<button class="stu-btn" data-id="' + s.id + '" onclick="switchStudent(\'' + s.id + '\')">'
          + '<span class="n">' + esc(s.name) + '</span><span class="s">' + sub + '</span></button>';
    });
    box.innerHTML = html;
}

initStudentBtns();
switchStudent('liming');
</script>
</body>
</html>
