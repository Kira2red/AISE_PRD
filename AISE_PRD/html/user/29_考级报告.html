<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考级个人报告 - AISE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' },
                        navy:  { DEFAULT:'#0f1835', soft:'#212845' },
                        violet2:{ DEFAULT:'#8777d3', deep:'#705fd2', light:'#aaa8e1', pale:'#c2bbe1' },
                        brightblue:{ DEFAULT:'#2555e7', soft:'#2957e7' },
                        pinkx: { DEFAULT:'#f0646b', soft:'#f1666d', pale:'#f39ca0' },
                    },
                    boxShadow: { 'card':'0 2px 10px -2px rgba(15,24,53,0.06)' },
                }
            }
        }
    </script>
    <style>
        body { background-color:#e9e9ea; -webkit-font-smoothing:antialiased; color:#0f1835; font-size:15px; }
        .glass-nav { background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); border-bottom:1px solid rgba(226,232,240,0.8); }
        /* 报告卡片：白底圆角16px、细描边、轻阴影 */
        .report-card { background:#fff; border-radius:16px; border:1px solid #e5e7eb; box-shadow:0 2px 10px -2px rgba(15,24,53,0.06); overflow:hidden; }
        .mod-title { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:700; color:#0f1835; }
        .mod-title .bar { width:5px; height:20px; border-radius:3px; background:linear-gradient(180deg,#8777d3,#705fd2); }
        .mod-sub { font-size:12px; color:#606471; }
        /* 状态标签 chip */
        .chip { display:inline-flex; align-items:center; gap:4px; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
        .chip-green  { background:#e7f8f2; color:#14966f; border:1px solid #b9ecd9; }
        .chip-orange { background:#fdf3e3; color:#c07f16; border:1px solid #f5dcb0; }
        .chip-pink   { background:#fdecec; color:#e0484f; border:1px solid #f6c1c3; }
        .chip-purple { background:#f0edfb; color:#705fd2; border:1px solid #d9d3f1; }
        .chip-blue   { background:#e8edfd; color:#2555e7; border:1px solid #c4d0f7; }
        .chip-gray   { background:#f1f2f4; color:#606471; border:1px solid #e0e1e5; }
        /* 代码块：深色主题 */
        .code-block { background:#1d1d1e; color:#e9e9e9; font-family:'JetBrains Mono',monospace; font-size:15px; line-height:1.7; border-radius:12px; padding:16px 18px; overflow-x:auto; }
        .code-block .ln { color:#6b6b70; user-select:none; display:inline-block; width:2em; margin-right:12px; text-align:right; }
        .code-block .kw { color:#1d90fa; }
        .code-trunc { background:#1d1d1e; color:#8a8a90; font-size:12px; border-radius:0 0 12px 12px; padding:6px 18px 12px; margin-top:-12px; font-family:'JetBrains Mono',monospace; }
        /* 操作区 */
        .ops-card { background:#fff; border-radius:16px; border:1px solid #e5e7eb; box-shadow:0 2px 10px -2px rgba(15,24,53,0.06); }
        .stu-btn { display:flex; align-items:center; gap:8px; width:100%; padding:10px 14px; border-radius:12px; border:1px solid #e5e7eb; background:#fff; font-size:15px; font-weight:500; color:#0f1835; transition:all .15s; cursor:pointer; text-align:left; }
        .stu-btn:hover { border-color:#aaa8e1; background:#faf9fe; }
        .stu-btn.active { border-color:#8777d3; background:#f0edfb; color:#705fd2; font-weight:600; box-shadow:0 0 0 1px #8777d3 inset; }
        .stu-btn .avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; flex-shrink:0; }
        .pdf-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:12px; border-radius:12px; background:linear-gradient(135deg,#2555e7,#2957e7); color:#fff; font-size:15px; font-weight:600; transition:all .2s; cursor:pointer; border:none; }
        .pdf-btn:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 6px 16px -4px rgba(37,85,231,0.4); }
        .pdf-btn:disabled { opacity:.55; cursor:not-allowed; }
        .pdf-btn.retry { background:linear-gradient(135deg,#f0646b,#f1666d); }
        /* 成长区间图 */
        .stage-track { display:flex; width:100%; height:56px; border-radius:12px; overflow:hidden; }
        .stage-seg { position:relative; }
        @media (max-width:1023px){ .mod-title{font-size:20px;} }
    </style>
</head>

<script>

const ADVICE = { // 四级文案，逐字照录需求 1.6
    pass:{ link:'建议继续学习列表、字典及循环分支嵌套，构建更复杂的程序逻辑，衔接五级。',

           course:null } // 未通过不展示课程学习建议
};
const FULL_COMMENT = '本题目作答达到要求，完整完成任务。太棒了！';

const STUDENTS = [
{ id:'liming', name:'李明', level:'程序设计四级', date:'2026年6月', score:100, color:'#705fd2',
  knowledge:[
    {mod:'Python运算', pts:[['比较运算',100],['布尔值',100],['算术运算',100]]},
    {mod:'流程控制', pts:[['条件分支',100],['循环',100],['IPO编程',100]]},

  knowledge:[

    {mod:'流程控制', pts:[['条件分支',50],['循环',75],['IPO编程',100]]},

  ],

/* ===== 渲染函数 ===== */
function gradeOf(s){
    if(s < 30) return { pass:false, grade:'待提升', stage:0 };
    if(s < 60) return { pass:false, grade:'待提升', stage:1 };
    if(s < 70) return { pass:true,  grade:'合格',   stage:2 };
    if(s < 80) return { pass:true,  grade:'良好',   stage:3 };
    return { pass:true, grade:'优秀', stage:4 };
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderHeader(stu, g){
    const chip = g.pass
        ? '<span class="chip chip-green"><i class="fa-solid fa-circle-check"></i>通过</span>'
        : '<span class="chip chip-pink"><i class="fa-solid fa-circle-exclamation"></i>未通过</span>';
    const gc = { '待提升':'#c07f16', '合格':'#2555e7', '良好':'#14966f', '优秀':'#705fd2' }[g.grade];
    document.getElementById('modHeader').innerHTML =
      '<div class="flex flex-wrap items-center justify-between gap-4">'
      + '<div class="flex items-center gap-4 min-w-0">'
      +   '<div class="w-14 h-14 rounded-2xl flex items-center justify-center text-white text-xl font-bold shrink-0" style="background:linear-gradient(135deg,#8777d3,#705fd2)">'+esc(stu.name[0])+'</div>'
      +   '<div class="min-w-0">'
      +     '<div class="flex items-center gap-3 flex-wrap"><h1 class="text-[22px] sm:text-[24px] font-extrabold text-navy leading-tight">'+esc(stu.level)+'考级报告</h1>'+chip+'</div>'
      +     '<div class="text-[15px] text-[#606471] mt-1">'+esc(stu.name)+' · '+esc(stu.date)+'</div>'
      +   '</div>'
      + '</div>'
      + '<div class="flex items-center gap-5 shrink-0">'
      +   '<div class="text-right"><div class="text-[12px] text-[#a6a7af]">正式总分</div>'
      +   '<div class="text-[34px] leading-none font-extrabold" style="color:'+gc+'">'+stu.score+'<span class="text-[15px] font-medium text-[#a6a7af]"> 分</span></div></div>'
      +   '<div class="text-right border-l border-slate-100 pl-5"><div class="text-[12px] text-[#a6a7af]">报告等级</div>'
      +   '<div class="text-[24px] leading-none font-extrabold mt-1" style="color:'+gc+'">'+g.grade+'</div></div>'
      + '</div></div>';
}

function renderOverview(stu, g){
    const pos = Math.min(97, stu.score === 100 ? 100 : STAGES[g.stage].c); // 满分取色带右端，其余固定阶段中心（clamp 防圆点溢出）
    const shades = ['#e3e0f5','#cfc9ee','#aaa8e1','#8777d3','#705fd2'];
    let segs = '';
    STAGES.forEach(function(s, i){
        const active = i === g.stage;
        segs += '<div class="stage-seg" style="width:'+s.w+'%;background:'+(active ? 'linear-gradient(180deg,'+shades[i]+',#5bc8e8)' : shades[i])+';opacity:'+(active?'1':'0.45')+'"></div>';
    });
    let labels = '';
    STAGES.forEach(function(s, i){
        labels += '<div class="text-center text-[12px] '+(i===g.stage?'font-bold text-[#705fd2]':'text-[#a6a7af]')+'" style="width:'+s.w+'%">'+s.n+'</div>';
    });
    document.getElementById('modOverview').innerHTML =
      '<div class="flex items-center gap-2 flex-wrap mb-5">'
      + '<span class="chip chip-purple">报告等级 · '+g.grade+'</span>'
      + '<span class="chip '+(g.pass?'chip-blue':'chip-orange')+'">成长区间 · '+STAGES[g.stage].n+'</span></div>'
      + '<div class="relative pt-2 pb-1"><div class="stage-track">'+segs+'</div>'
      + '<div class="absolute" style="left:'+pos+'%;top:0;transform:translateX(-50%)">'
      +   '<div class="w-4 h-4 rounded-full border-[3px] border-white shadow-md" style="background:#705fd2;margin-top:22px"></div>'
      + '</div></div>'
      + '<div class="flex mt-2">'+labels+'</div>'
      + '<div class="text-[12px] text-[#606471] mt-3"><i class="fa-solid fa-location-dot mr-1" style="color:#705fd2"></i>本次考级所处阶段：<b class="text-navy">'+STAGES[g.stage].n+'</b></div>'
      + '<div class="mt-4 rounded-xl px-5 py-4 text-[15px] leading-relaxed" style="background:#f5f6f8;color:#212845"><i class="fa-solid fa-quote-left mr-2" style="color:#aaa8e1"></i>'+SUMMARY[g.grade]+'</div>';
}

function renderKnowledge(stu){
    const box = document.getElementById('modKnowledge');
    if(!stu.knowledge){ // 空状态（需求 3.4）：知识树未配置
        box.innerHTML = '<div class="rounded-xl border border-dashed border-[#c2bbe1] bg-[#faf9fe] py-10 flex flex-col items-center justify-center text-center">'
          + '<i class="fa-solid fa-folder-open text-[28px] mb-3" style="color:#aaa8e1"></i>'
          + '<div class="text-[15px] font-semibold text-navy">暂无知识点掌握数据</div>'
          + '<div class="text-[12px] text-[#a6a7af] mt-1">本场考试题目暂未配置知识点标签</div></div>';
        return;
    }
    let html = '';
    stu.knowledge.forEach(function(m){
        // 排序：先重点提升后稳定掌握，同状态按知识树顺序（需求 1.4.3）
        const sorted = m.pts.slice().sort(function(a,b){
            const wa = a[1] >= 60 ? 1 : 0, wb = b[1] >= 60 ? 1 : 0;
            return wa - wb;
        });
        let rows = '';
        sorted.forEach(function(p){
            const ok = p[1] >= 60;
            rows += '<div class="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">'
              + '<span class="text-[15px] text-navy">'+esc(p[0])+'</span>'
              + '<span class="flex items-center gap-3 shrink-0"><span class="text-[13px] font-bold '+(ok?'text-[#14966f]':'text-[#c07f16]')+'">'+p[1]+'%</span>'
              + '<span class="chip '+(ok?'chip-green':'chip-orange')+'">'+(ok?'稳定掌握':'重点提升')+'</span></span></div>';
        });
        html += '<div class="mb-4 last:mb-0"><div class="flex items-center gap-2 mb-1">'
          + '<i class="fa-solid fa-layer-group text-[13px]" style="color:#8777d3"></i>'
          + '<span class="text-[15px] font-bold text-navy-soft">'+esc(m.mod)+'</span></div>'
          + '<div class="pl-6">'+rows+'</div></div>';
    });
    box.innerHTML = html;
}

function codeHtml(lines){
    const shown = lines.slice(0, 5); // 统一保留前 5 行后截断（需求 1.5.2）
    let rows = '';
    shown.forEach(function(l, i){ rows += '<div><span class="ln">'+(i+1)+'</span>'+esc(l)+'</div>'; });
    let html = '<div class="code-block">'+rows+'</div>';
    if(lines.length > 5) html += '<div class="code-trunc">··· 作答代码较长，仅展示前 5 行 ···</div>';
    return html;
}

function renderPerformance(stu){
    const card = document.getElementById('cardPerformance');
    const box = document.getElementById('modPerformance');
    const p = stu.performance;
    let html = '';
    if(p.full){ // 满分画像：1 道首道满分编程题，只展示作答不展示答案
        if(!p.coding){ card.style.display = 'none'; return; } // 找不到首道满分编程题则整模块不展示
        html = '<div><div class="flex items-center gap-2 flex-wrap mb-3">'
          + '<span class="chip chip-purple">'+esc(p.coding.no)+' · 编程题</span>'
          + '<span class="chip chip-green"><i class="fa-solid fa-award"></i>满分高光</span></div>'
          + '<div class="text-[12px] font-semibold text-[#606471] mb-1.5">你的作答</div>'+codeHtml(p.coding.code)
          + '<div class="mt-3 rounded-xl px-4 py-3 text-[15px]" style="background:#f0edfb;color:#705fd2"><i class="fa-solid fa-comment-dots mr-2"></i>'+FULL_COMMENT+'</div></div>';
    } else { // 非满分画像：首错客观题 + 首扣分编程题，各自独立判定，缺一展一
        if(p.objective){
            const o = p.objective, letters = ['A','B','C','D'];
            let opts = '';
            o.options.forEach(function(t, i){
                let cls = 'border-slate-200 text-navy', tag = '';
                if(i === o.student){ cls = 'border-[#f0646b] bg-[#fdecec] text-[#e0484f]'; tag = '<span class="chip chip-pink ml-2">你的作答</span>'; }
                if(i === o.correct){ cls = 'border-[#14966f] bg-[#e7f8f2] text-[#14966f]'; tag = '<span class="chip chip-green ml-2">正确答案</span>'; }
                opts += '<div class="flex items-center rounded-xl border px-4 py-2.5 text-[15px] '+cls+'"><b class="mr-2">'+letters[i]+'.</b>'+esc(t)+tag+'</div>';
            });
            html += '<div><div class="flex items-center gap-2 flex-wrap mb-3">'
              + '<span class="chip chip-purple">'+esc(o.no)+' · '+esc(o.type)+'</span>'
              + '<span class="chip chip-gray">得分 '+esc(o.scoreText)+'</span></div>'
              + '<div class="text-[15px] text-navy leading-relaxed mb-3">'+esc(o.stem)+'</div>'
              + '<div class="space-y-2">'+opts+'</div>'
              + '<div class="mt-3 rounded-xl px-4 py-3 text-[15px]" style="background:#fdecec;color:#e0484f"><i class="fa-solid fa-lightbulb mr-2"></i>建议重点提升【'+esc(o.kp)+'】。</div></div>';
        }
        if(p.coding){
            html += '<div><div class="flex items-center gap-2 flex-wrap mb-3">'
              + '<span class="chip chip-purple">'+esc(p.coding.no)+' · 编程题</span>'
              + '<span class="chip chip-gray">得分 '+esc(p.coding.scoreText)+'</span></div>'
              + '<div class="text-[12px] font-semibold text-[#606471] mb-1.5">你的作答</div>'+codeHtml(p.coding.code)
              + '<div class="mt-3 rounded-xl px-4 py-3 text-[15px]" style="background:#fdecec;color:#e0484f"><i class="fa-solid fa-lightbulb mr-2"></i>建议重点提升【'+esc(p.coding.kp)+'】。</div></div>';
        }
        if(!html){ card.style.display = 'none'; return; } // 两者均无则整模块不展示
    }
    card.style.display = '';
    box.innerHTML = html;
}

function renderAdvice(g){
    const a = g.pass ? ADVICE.pass : ADVICE.fail;
    let html = '<div class="rounded-xl border border-slate-100 px-5 py-4" style="background:#faf9fe">'
      + '<div class="flex items-center gap-2 mb-1.5"><i class="fa-solid fa-arrow-trend-up" style="color:#8777d3"></i><span class="text-[15px] font-bold text-navy">考级衔接</span></div>'
      + '<div class="text-[15px] leading-relaxed text-[#212845]">'+a.link+'</div></div>';
    if(a.course){ // 课程学习建议仅通过状态展示（需求 3.6）
        html += '<div class="rounded-xl border border-slate-100 px-5 py-4 mt-3" style="background:#f4f8fe">'
          + '<div class="flex items-center gap-2 mb-1.5"><i class="fa-solid fa-book-open" style="color:#2555e7"></i><span class="text-[15px] font-bold text-navy">课程学习建议</span></div>'
          + '<div class="text-[15px] leading-relaxed text-[#212845]">'+a.course+'</div></div>';
    }
    document.getElementById('modAdvice').innerHTML = html;
}

function renderReport(stu){
    const g = gradeOf(stu.score);
    renderHeader(stu, g);
    renderOverview(stu, g);
    renderKnowledge(stu);
    renderPerformance(stu);
    renderAdvice(g);
}
/* ===== 交互与初始化 ===== */
let currentId = 'liming';
let pdfTimer = null;

function switchStudent(id){
    currentId = id;
    const stu = STUDENTS.find(function(s){ return s.id === id; });
    if(!stu) return;
    renderReport(stu);
    const g = gradeOf(stu.score);
    document.getElementById('opsAvatar').textContent = stu.name[0];
    document.getElementById('opsStudentName').textContent = stu.name + ' · ' + stu.level;
    document.getElementById('opsStudentMeta').textContent = stu.date + ' · ' + g.grade + ' · ' + stu.score + ' 分';
    document.querySelectorAll('.stu-btn').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-id') === id);
    });
    resetPdfBtn();
    window.scrollTo({ top:0, behavior:'smooth' });
}

function resetPdfBtn(){
    if(pdfTimer){ clearTimeout(pdfTimer); pdfTimer = null; }
    const btn = document.getElementById('pdfBtn');
    btn.disabled = false;
    btn.classList.remove('retry');
    btn.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i><span>下载 PDF 报告</span>';
}

function downloadPdf(){
    const btn = document.getElementById('pdfBtn');
    if(btn.disabled) return;
    const stu = STUDENTS.find(function(s){ return s.id === currentId; });
    if(!stu) return;
    // 真实下载：指向预生成的 PDF（样式与线上报告一致；未来线上由服务端实时渲染）
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>准备下载…</span>';
    pdfTimer = setTimeout(function(){
        pdfTimer = null;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i><span>下载 PDF 报告</span>';
        const a = document.createElement('a');
        a.href = 'pdf/考级报告_' + stu.name + '.pdf';
        a.download = 'AISE考级报告_' + stu.name + '.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }, 600);
}

function initStudentBtns(){
    const box = document.getElementById('studentBtns');
    let html = '';
    STUDENTS.forEach(function(s){
        const g = gradeOf(s.score);
        const sub = s.knowledge ? (s.score + ' 分 · ' + g.grade) : (s.score + ' 分 · 知识点未配置');
        html += '<button class="stu-btn" data-id="'+s.id+'" onclick="switchStudent(\''+s.id+'\')">'
          + '<span class="avatar" style="background:linear-gradient(135deg,#8777d3,#705fd2)">'+esc(s.name[0])+'</span>'
          + '<span class="min-w-0"><span class="block truncate">'+esc(s.name)+'</span>'
          + '<span class="block text-[12px] font-normal text-[#a6a7af]">'+sub+'</span></span></button>';
    });
    box.innerHTML = html;
}

initStudentBtns();
switchStudent('liming');
</script>
