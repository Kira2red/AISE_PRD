    if (score < 60) return '待提升';

        name: '程序设计六级',
        score: 92,
        modules: [
            {name:'算法基础',points:[{name:'枚举算法',correct:3,total:3},{name:'模拟算法',correct:2,total:2},{name:'排序',correct:2,total:3}]},

        perfectQ: [{type:'编程题',num:4,title:'找素数',sa:'def is_prime(n):\n    if n < 2: return False\n    for i in range(2, int(n**0.5)+1):\n        if n % i == 0: return False\n    return True\n...',comment:'本题目作答达到要求，完整完成任务。太棒了！',kp:'枚举算法'}],

let currentLevel = 4;
let currentExamType = 'kaoji'; // 'kaoji' | 'mokao'

function switchLevel(level) {
    currentLevel = level;
    renderLevelButtons();
    renderAll();
}

function switchExamType(type) {
    currentExamType = type;
    document.getElementById('btn-kaoji').className = type === 'kaoji'
        ? 'flex-1 py-2 rounded-md text-sm font-semibold transition bg-white text-brand-700 shadow-sm'
        : 'flex-1 py-2 rounded-md text-sm font-semibold transition text-slate-500';
    document.getElementById('btn-mokao').className = type === 'mokao'
        ? 'flex-1 py-2 rounded-md text-sm font-semibold transition bg-white text-brand-700 shadow-sm'
        : 'flex-1 py-2 rounded-md text-sm font-semibold transition text-slate-500';
    renderAll();
}

function renderLevelButtons() {
    let html = '';
    for (let i = 1; i <= 8; i++) {
        html += '<button onclick="switchLevel(' + i + ')" class="level-btn py-2 rounded-lg text-xs font-semibold transition border border-slate-200 ' + (i === currentLevel ? 'active' : 'bg-white text-slate-600 hover:bg-slate-50') + '">' + LEVEL_NUM_MAP[i] + '级</button>';
    }
    document.getElementById('level-buttons').innerHTML = html;
}

function renderAll() {
    const ld = LEVEL_DATA[currentLevel];
    const isMock = currentExamType === 'mokao';
    const score = ld.score;
    const stageIdx = scoreToStage(score);
    const passed = score >= 60;
    const isPerfect = score === 100;

    // §1 Top info
    document.getElementById('exam-info').textContent = ld.name + ' · ' + (isMock ? '模考' : '考级') + ' · 2026年6月';
    document.getElementById('applied-level').textContent = ld.name;

    if (isMock) {
        document.getElementById('badge-pass').classList.add('hidden');
        document.getElementById('badge-fail').classList.add('hidden');
        document.getElementById('badge-mokao').classList.remove('hidden');
        document.getElementById('achieved-row').classList.add('hidden');
    } else {
        document.getElementById('badge-mokao').classList.add('hidden');
        document.getElementById('badge-pass').classList.toggle('hidden', !passed);
        document.getElementById('badge-fail').classList.toggle('hidden', passed);
        document.getElementById('achieved-row').classList.remove('hidden');
        document.getElementById('achieved-level').textContent = passed
            ? ld.name + '（' + scoreToLabel(score) + '）'
            : '最高通过：' + getHighestPassedLevel();
    }
    document.getElementById('total-score').textContent = score;

    // §2 Overview
    document.getElementById('level-badge').textContent = LEVEL_NUM_MAP[currentLevel];
    document.getElementById('level-title').textContent = ld.name;
    if (isMock) {
        document.getElementById('level-sub').textContent = '模考成绩 · ' + STAGES[stageIdx];
        document.getElementById('summary-text').textContent = SUMMARIES.mokao;
    } else {
        const lbl = scoreToLabel(score);
        document.getElementById('level-sub').textContent = (passed ? '获得「' + lbl + '」等级' : '未通过') + ' · ' + STAGES[stageIdx];
        if (!passed) document.getElementById('summary-text').textContent = SUMMARIES.pending;
        else if (score < 70) document.getElementById('summary-text').textContent = SUMMARIES.qualified;
        else if (score < 80) document.getElementById('summary-text').textContent = SUMMARIES.good;
        else document.getElementById('summary-text').textContent = SUMMARIES.excellent;
    }

    // Violin marker
    const cx = STAGE_CX[stageIdx];
    document.getElementById('marker-line').setAttribute('x1', cx);
    document.getElementById('marker-line').setAttribute('x2', cx);
    document.getElementById('marker-arrow').setAttribute('points', cx + ',16 ' + (cx-6) + ',26 ' + (cx+6) + ',26');
    document.getElementById('marker-label-bg').setAttribute('x', cx - 30);
    document.getElementById('marker-label').setAttribute('x', cx);
    ELLIPSE_IDS.forEach((id, i) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (i === stageIdx) {
            el.setAttribute('fill', '#3b82f6'); el.setAttribute('opacity', '0.8');
            el.setAttribute('stroke', '#2563eb'); el.setAttribute('stroke-width', '2');
        } else {
            el.setAttribute('fill', ELLIPSE_HIGHLIGHT[i]); el.setAttribute('opacity', '0.5');
            el.removeAttribute('stroke'); el.removeAttribute('stroke-width');
        }
    });

    // §3 Knowledge
    renderKnowledge(ld);
    // §4 Performance
    renderPerformance(ld, isPerfect, isMock);
    // §5 Next stage
    renderNextStage(isMock, passed);
}

function getHighestPassedLevel() {
    // For demo: if current level failed, highest passed is one below
    if (currentLevel <= 1) return '无';
    return LEVEL_DATA[currentLevel - 1].name;
}

function renderKnowledge(ld) {
    let html = '';
    ld.modules.forEach(mod => {
        html += '<div class="mb-4 last:mb-0"><p class="text-sm font-bold text-slate-700 mb-2">' + mod.name + '</p><div class="space-y-1.5">';
        mod.points.forEach(pt => {
            const pct = pt.total > 0 ? Math.round((pt.correct / pt.total) * 100) : 0;
            const weak = pct < 60;
            html += '<div class="flex items-center justify-between py-1.5 px-3 rounded-lg ' + (weak ? 'bg-red-50' : 'bg-green-50') + '">';
            html += '<div class="flex items-center gap-2"><span class="text-sm font-medium ' + (weak ? 'text-red-700' : 'text-green-700') + '">' + pt.name + '</span>';
            html += '<span class="tag-mastery ' + (weak ? 'tag-need-improve' : 'tag-stable') + '">' + (weak ? '重点提升' : '稳定掌握') + '</span></div>';
            html += '<span class="text-xs font-bold ' + (weak ? 'text-red-500' : 'text-green-600') + '">' + pt.correct + '/' + pt.total + '</span></div>';
        });
        html += '</div></div>';
    });
    document.getElementById('knowledge-matrix').innerHTML = html;
}

function renderPerformance(ld, isPerfect, isMock) {
    const titleEl = document.getElementById('perf-title');
    if (isMock) {
        titleEl.innerHTML = '<i class="fa-solid fa-magnifying-glass-chart text-brand-500"></i> 作答表现';
        if (ld.perfQ && ld.perfQ.length > 0) {
            document.getElementById('exam-performance').innerHTML = buildPerfHTML(ld.perfQ.slice(0, 2));
        } else {
            document.getElementById('exam-performance').innerHTML = '<p class="text-sm text-slate-400 text-center py-8">暂无答题记录</p>';
        }
        return;
    }
    titleEl.innerHTML = '<i class="fa-solid fa-magnifying-glass-chart text-brand-500"></i> 考级具体表现';
    if (isPerfect && ld.perfectQ) {
        document.getElementById('exam-performance').innerHTML = buildPerfectHTML(ld.perfectQ[0]);
    } else if (ld.perfQ) {
        document.getElementById('exam-performance').innerHTML = buildPerfHTML(ld.perfQ.slice(0, 2));
    } else {
        document.getElementById('exam-performance').innerHTML = '<p class="text-sm text-slate-400 text-center py-8">暂无答题记录</p>';
    }
}

function buildPerfectHTML(q) {
    return '<div class="bg-gradient-to-br from-amber-50 to-yellow-50 border border-amber-200 rounded-xl p-4"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-star text-amber-500"></i><span class="text-sm font-bold text-amber-700">高光时刻</span></div><p class="text-xs text-amber-600 mb-2">满分通过！以下为首道满分' + q.type + '作答展示。</p><div class="bg-white rounded-lg p-3 border border-amber-100"><div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold text-slate-500">第' + q.num + '题</span><span class="text-xs text-slate-400">|</span><span class="text-xs text-slate-600">' + q.title + '</span></div><pre class="text-xs font-mono text-slate-700 bg-slate-50 p-3 rounded overflow-x-auto whitespace-pre-wrap">' + q.sa + '</pre></div><p class="text-sm text-amber-700 mt-2 font-medium">' + q.comment + '</p></div>';
}

function buildPerfHTML(questions) {
    let html = '<div class="bg-red-50 border border-red-100 rounded-xl p-4"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-triangle-exclamation text-red-500"></i><span class="text-sm font-bold text-red-700">重点错题回顾</span></div>';
    questions.forEach(q => {
        html += '<div class="bg-white rounded-lg p-3 border border-red-100 mb-2 last:mb-0"><div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold text-slate-500">第' + q.num + '题</span><span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-500">' + q.type + '</span><span class="text-xs text-slate-400">|</span><span class="text-xs text-slate-600">' + q.title + '</span></div>';
        html += '<div class="grid grid-cols-2 gap-3 text-xs"><div><p class="text-red-400 font-bold mb-1">你的作答</p><pre class="font-mono text-red-700 bg-red-50 p-2 rounded whitespace-pre-wrap">' + q.sa + '</pre></div><div><p class="text-green-500 font-bold mb-1">正确答案</p><pre class="font-mono text-green-700 bg-green-50 p-2 rounded whitespace-pre-wrap">' + q.ca + '</pre></div></div>';
        html += '<p class="text-sm text-red-600 mt-2 font-medium">' + q.comment + '</p></div>';
    });
    html += '</div>';
    return html;
}

function renderNextStage(isMock, passed) {
    let html = '';
    if (isMock) {
        html += '<div class="bg-white border border-slate-200 rounded-xl p-4 mb-3"><p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">学习建议</p><p class="text-sm text-slate-700 leading-relaxed">本次模考仅供参考，建议针对「重点提升」知识点加强练习，巩固薄弱环节。</p></div>';
    } else {
        const adv = NEXT_STAGE_MAP[currentLevel] || NEXT_STAGE_MAP[4];
        const entry = passed ? adv.pass : adv.fail;
        html += '<div class="bg-white border border-slate-200 rounded-xl p-4 mb-3"><p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">考级衔接</p><p class="text-sm text-slate-700 leading-relaxed">' + entry.link + '</p></div>';
        if (entry.course) {
            html += '<div class="bg-white border border-slate-200 rounded-xl p-4"><p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">课程学习建议</p><p class="text-sm text-slate-700 leading-relaxed">' + entry.course + '</p></div>';
        }
    }
    document.getElementById('next-stage').innerHTML = html;
}

// Init
renderLevelButtons();
renderAll();
</script>
