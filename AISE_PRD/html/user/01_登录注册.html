<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AISE 人工智能应用创新人才培养工程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        dark: {
                            900: '#0f172a',
                        }
                    },
                    backgroundImage: {
                        'premium-gradient': 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)',
                    },
                    boxShadow: {
                        'card': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        /* 动画类 */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 背景样式复用 */
        .hero-bg {
            background-color: #0f172a;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
        }
        
        .grid-pattern {
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.2;
        }

        /* 自定义滚动条，防止注册页过长时滚动条太丑 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

        /* 渠道选择弹窗 */
        .channel-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.6);
            backdrop-filter: blur(4px); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        .channel-overlay.active { opacity: 1; pointer-events: auto; }
        .channel-modal {
            background: #fff; border-radius: 16px; width: 440px; max-width: 90vw;
            max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform: translateY(12px); transition: transform 0.25s;
        }
        .channel-overlay.active .channel-modal { transform: translateY(0); }
        .channel-modal-header {
            padding: 24px 28px 16px; border-bottom: 1px solid #e2e8f0;
        }
        .channel-modal-header h3 { font-size: 18px; font-weight: 700; color: #0f172a; margin: 0 0 4px; }
        .channel-modal-header p { font-size: 13px; color: #94a3b8; margin: 0; }
        .channel-list {
            flex: 1; overflow-y: auto; padding: 12px 28px;
        }
        .channel-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-radius: 12px;
            border: 2px solid #e2e8f0; cursor: pointer;
            transition: all 0.15s; margin-bottom: 10px;
        }
        .channel-card:hover { border-color: #93c5fd; }
        .channel-card.selected {
            border-color: #2563eb; background: #eff6ff;
        }
        .channel-card:last-child { margin-bottom: 0; }
        .channel-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: #e2e8f0; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
            font-size: 18px; font-weight: 600; color: #475569;
        }
        .channel-info { flex: 1; min-width: 0; }
        .channel-info .name { font-size: 15px; font-weight: 600; color: #0f172a; }
        .channel-info .channel { font-size: 12px; color: #64748b; margin-top: 2px; }
        .channel-meta { text-align: right; flex-shrink: 0; }
        .channel-meta .meta-row { font-size: 11px; color: #94a3b8; line-height: 1.6; }
        .channel-meta .meta-row span { color: #475569; }
        .channel-modal-footer {
            padding: 16px 28px 24px; border-top: 1px solid #e2e8f0;
            display: flex; gap: 12px;
        }
        .btn-cancel {
            flex: 1; padding: 10px 0; border-radius: 10px;
            border: 1px solid #e2e8f0; background: #fff;
            color: #64748b; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
        }
        .btn-cancel:hover { background: #f8fafc; }
        .btn-confirm {
            flex: 2; padding: 10px 0; border-radius: 10px;
            border: none; background: #e2e8f0; color: #94a3b8;
            font-size: 14px; font-weight: 600; cursor: not-allowed;
            transition: all 0.15s;
        }
        .btn-confirm.active {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff; cursor: pointer;
        }
        .btn-confirm.active:hover { opacity: 0.9; }
    </style>
</head>
<body class="hero-bg flex items-center justify-center p-4 sm:p-8">
    <div class="absolute inset-0 grid-pattern pointer-events-none"></div>

    <div class="bg-white w-full max-w-5xl h-[600px] sm:h-[700px] rounded-3xl shadow-card overflow-hidden flex relative z-10">
        
        <div class="hidden md:flex w-5/12 bg-slate-900 relative flex-col justify-between p-12 text-white overflow-hidden">
            <img src="https://images.unsplash.com/photo-1620712943543-bcc4688e7485?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" class="absolute inset-0 w-full h-full object-cover opacity-40 mix-blend-overlay" alt="AI Art">
            <div class="absolute inset-0 bg-gradient-to-b from-slate-900/20 to-slate-900/90"></div>
            
            <div class="relative z-10 flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 backdrop-blur rounded-lg flex items-center justify-center text-white font-bold text-xl border border-white/20">A</div>
                <span class="font-bold text-xl tracking-tight">AISE</span>
            </div>

            <div class="relative z-10">
                <h2 class="text-3xl font-bold mb-4 leading-tight">探索智能科技的<br>无限边界</h2>
                <p class="text-slate-300 text-sm font-light leading-relaxed">
                    加入 AISE，开启您的应用创新人才认证之旅。<br>
                    权威测评 · 国际标准 · 赋能未来
                </p>
            </div>
        </div>

        <div class="w-full md:w-7/12 bg-white relative overflow-hidden">
            
            <div id="form-login" class="absolute inset-0 p-8 sm:p-12 overflow-y-auto custom-scroll flex flex-col justify-center fade-in">
                <div class="max-w-sm mx-auto w-full">
                    <h3 class="text-2xl font-bold text-slate-900 mb-2">欢迎回来</h3>
                    <p class="text-slate-500 text-sm mb-8">请登录您的考生账号以继续</p>

                    <form onsubmit="event.preventDefault(); handleLogin();">
                        <div class="mb-5">
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">账号 / 身份证号</label>
                            <div class="relative">
                                <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
                                <input type="text" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-0 outline-none transition text-sm text-slate-800 placeholder-slate-400" placeholder="请输入身份证号或手机号">
                            </div>
                        </div>

                        <div class="mb-5">
                            <div class="flex justify-between mb-2">
                                <label class="block text-xs font-semibold text-slate-600 uppercase">密码</label>
                                <span class="text-xs text-slate-400">默认密码为身份证后6位</span>
                            </div>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                                <input type="password" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-0 outline-none transition text-sm text-slate-800 placeholder-slate-400" placeholder="请输入密码">
                            </div>
                        </div>

                        <div class="mb-8">
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">验证码</label>
                            <div class="flex gap-3">
                                <div class="relative flex-1">
                                    <i class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-slate-400"></i>
                                    <input type="text" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 focus:ring-0 outline-none transition text-sm text-slate-800 placeholder-slate-400" placeholder="输入右侧数字">
                                </div>
                                <div class="w-28 h-[46px] bg-slate-100 rounded-xl border border-slate-200 flex items-center justify-center text-lg font-mono font-bold text-slate-500 tracking-widest italic select-none cursor-pointer hover:bg-slate-200 transition" title="点击刷新">
                                    83K5
                                </div>
                            </div>
                        </div>

                        <button class="w-full bg-premium-gradient text-white font-semibold py-3.5 rounded-xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all duration-300 mb-6">
                            立即登录
                        </button>
                    </form>

                    <div class="flex items-center justify-between text-sm">
                        <button onclick="switchForm('register')" class="text-slate-600 hover:text-brand-600 font-medium transition">
                            没有账号？注册新账号
                        </button>
                        <button onclick="switchForm('reset')" class="text-slate-400 hover:text-slate-600 transition">
                            忘记密码
                        </button>
                    </div>
                </div>
            </div>

            <div id="form-register" class="hidden absolute inset-0 p-8 sm:p-12 overflow-y-auto custom-scroll">
                <div class="max-w-sm mx-auto w-full py-4">
                    <button onclick="switchForm('login')" class="text-slate-400 hover:text-slate-600 text-sm mb-6 flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> 返回登录
                    </button>
                    
                    <h3 class="text-2xl font-bold text-slate-900 mb-6">注册考生账号</h3>

                    <form>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">真实姓名</label>
                                <input type="text" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">身份证号</label>
                                <input type="text" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">手机号码</label>
                            <div class="flex gap-2">
                                <input type="tel" class="flex-1 px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="11位手机号">
                                <button type="button" class="px-3 py-2.5 bg-slate-50 text-slate-600 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 whitespace-nowrap">获取验证码</button>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                             <label class="block text-xs font-semibold text-slate-600 mb-1">短信验证码</label>
                             <input type="text" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="6位数字">
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">电子邮箱</label>
                            <input type="email" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm">
                        </div>

                        <div class="mb-4">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">设置密码</label>
                            <input type="password" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="至少8位字符">
                        </div>
                        <div class="mb-8">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">确认密码</label>
                            <input type="password" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="再次输入密码">
                        </div>

                        <button class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl hover:bg-slate-800 transition mb-4 shadow-lg">
                            完成注册
                        </button>
                    </form>
                </div>
            </div>

            <div id="form-reset" class="hidden absolute inset-0 p-8 sm:p-12 overflow-y-auto custom-scroll flex flex-col justify-center">
                <div class="max-w-sm mx-auto w-full">
                    <button onclick="switchForm('login')" class="text-slate-400 hover:text-slate-600 text-sm mb-6 flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> 返回登录
                    </button>

                    <h3 class="text-2xl font-bold text-slate-900 mb-2">重置密码</h3>
                    <p class="text-slate-500 text-sm mb-8">验证手机号以设置新密码</p>

                    <form>
                        <div class="mb-5">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">注册手机号</label>
                            <div class="flex gap-2">
                                <input type="tel" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="请输入手机号">
                                <button type="button" class="px-4 py-3 bg-slate-50 text-slate-600 text-xs font-medium rounded-xl border border-slate-200 hover:bg-slate-100 whitespace-nowrap">获取验证码</button>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">短信验证码</label>
                            <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="请输入6位验证码">
                        </div>

                        <div class="mb-5">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">新密码</label>
                            <input type="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="新密码">
                        </div>
                        
                        <div class="mb-8">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">确认新密码</label>
                            <input type="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-800 outline-none text-sm" placeholder="再次输入新密码">
                        </div>

                        <button class="w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl hover:bg-slate-800 transition shadow-lg">
                            确认修改并登录
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- 渠道选择弹窗 -->
    <div class="channel-overlay" id="channelOverlay" onclick="if(event.target===this)closeChannelModal()">
        <div class="channel-modal">
            <div class="channel-modal-header">
                <h3>检测到多个关联账号</h3>
                <p>请选择您要登录的渠道身份</p>
            </div>
            <div class="channel-list" id="channelList">
            </div>
            <div class="channel-modal-footer">
                <button class="btn-cancel" onclick="closeChannelModal()">取消</button>
                <button class="btn-confirm" id="btnConfirm" onclick="confirmChannel()">以该身份登录</button>
            </div>
        </div>
    </div>

    <script>
        function switchForm(formId) {
            // 隐藏所有表单
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('form-reset').classList.add('hidden');

            // 移除淡入动画类，以便下次重新触发
            document.getElementById('form-login').classList.remove('fade-in');
            document.getElementById('form-register').classList.remove('fade-in');
            document.getElementById('form-reset').classList.remove('fade-in');

            // 显示目标表单并添加动画
            const target = document.getElementById('form-' + formId);
            target.classList.remove('hidden');
            target.classList.add('fade-in');
        }

        // 模拟渠道数据（每个渠道有独立密码）
        const allChannelAccounts = [
            { channelId: 'aise_official', channelName: 'AISE 官网', userName: '张三', password: 'a', avatar: null, firstRegisterTime: '2024-03-15 10:30', lastLoginTime: '2026-07-28 14:22' },
            { channelId: 'zuoyebang', channelName: '作业帮', userName: '张三', password: 'a', avatar: null, firstRegisterTime: '2025-01-10 09:00', lastLoginTime: '2026-07-20 18:45' },
            { channelId: 'xueersi', channelName: '学而思', userName: '张三', password: 'c', avatar: null, firstRegisterTime: '2025-06-01 16:30', lastLoginTime: '2026-06-15 11:00' },
        ];
        
        let currentMatchedAccounts = [];
        let selectedChannelIndex = -1;

        function handleLogin() {
            const btn = document.querySelector('#form-login button');
            const pwdInput = document.querySelector('#form-login input[type="password"]');
            const inputPassword = pwdInput ? pwdInput.value.trim() : '';
            
            const originalText = btn.innerText;
            btn.innerText = "检测中...";
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-wait');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-wait');

                // 以「用户名 + 密码」组合过滤匹配的渠道
                currentMatchedAccounts = allChannelAccounts.filter(function(acct) {
                    return acct.password === inputPassword;
                });

                if (currentMatchedAccounts.length === 1) {
                    // 只匹配 1 个渠道 → 直接登录
                    alert("模拟登录成功！（密码匹配 1 个渠道：「" + currentMatchedAccounts[0].channelName + "」，直接登录）");
                } else if (currentMatchedAccounts.length >= 2) {
                    // 匹配 2+ 个渠道 → 弹窗选择
                    showChannelModal(currentMatchedAccounts);
                } else {
                    // 密码不匹配任何渠道
                    alert("账号或密码错误");
                }
            }, 800);
        }

        function showChannelModal(accounts) {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            selectedChannelIndex = -1;
            document.getElementById('btnConfirm').classList.remove('active');
            
            accounts.forEach((acct, idx) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = function() { selectChannel(idx); };
                
                const initial = acct.userName ? acct.userName.charAt(0) : '?';
                
                card.innerHTML = 
                    '<div class="channel-avatar">' + initial + '</div>' +
                    '<div class="channel-info">' +
                        '<div class="name">' + acct.userName + '</div>' +
                        '<div class="channel">' + acct.channelName + '</div>' +
                    '</div>' +
                    '<div class="channel-meta">' +
                        '<div class="meta-row">首次注册 <span>' + acct.firstRegisterTime + '</span></div>' +
                        '<div class="meta-row">最近登录 <span>' + acct.lastLoginTime + '</span></div>' +
                    '</div>';
                list.appendChild(card);
            });
            
            document.getElementById('channelOverlay').classList.add('active');
        }

        function selectChannel(index) {
            selectedChannelIndex = index;
            const cards = document.querySelectorAll('.channel-card');
            cards.forEach((c, i) => { c.classList.toggle('selected', i === index); });
            document.getElementById('btnConfirm').classList.add('active');
        }

        function closeChannelModal() {
            document.getElementById('channelOverlay').classList.remove('active');
        }

        function confirmChannel() {
            if (selectedChannelIndex < 0) return;
            const account = currentMatchedAccounts[selectedChannelIndex];
            closeChannelModal();
            alert("模拟登录成功！（已选择「" + account.channelName + "」渠道）");
        }
    </script>
</body>
</html>
