<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元创S营报名 - 提交成功</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    },
                    boxShadow: { 'card': '0 20px 40px -10px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F1F5F9; -webkit-font-smoothing: antialiased; }
        
        /* 成功图标动画 */
        .success-check {
            animation: checkBounce 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes checkBounce {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 脉冲圆环动画 */
        .pulse-ring {
            animation: pulseRing 2s ease-out infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* loading 点动画 */
        .loading-dot {
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* 卡片滑入动画 */
        .card-enter {
            animation: cardSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full card-enter">
        
        <div class="bg-white rounded-2xl shadow-card overflow-hidden border border-slate-100 p-8 sm:p-10 text-center">
            
            <!-- 成功图标 -->
            <div class="mb-6 flex justify-center">
                <div class="relative inline-flex">
                    <div class="w-20 h-20 rounded-full bg-green-50 flex items-center justify-center success-check pulse-ring">
                        <i class="fa-solid fa-check text-4xl text-green-500"></i>
                    </div>
                </div>
            </div>

            <!-- 大标题 -->
            <h1 class="text-2xl font-bold text-slate-900 mb-3">报名信息已提交</h1>

            <!-- 说明文案 -->
            <p class="text-sm text-slate-500 mb-8 leading-relaxed max-w-sm mx-auto">
                您的报名信息已成功提交，请耐心等待审核。<br>审核结果将通过消息通知您。
            </p>

            <!-- 审核状态 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-8">
                <div class="flex items-center justify-center gap-3">
                    <div class="flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-amber-400 loading-dot inline-block"></span>
                        <span class="w-2 h-2 rounded-full bg-amber-400 loading-dot inline-block"></span>
                        <span class="w-2 h-2 rounded-full bg-amber-400 loading-dot inline-block"></span>
                    </div>
                    <span class="text-sm font-semibold text-amber-600">当前状态：审核中</span>
                </div>
                <p class="text-xs text-slate-400 mt-2">预计审核时间为 1-3 个工作日</p>
            </div>

            <!-- 按钮 -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button onclick="window.location.href='26_我的报名.html'" class="flex-1 px-6 py-3 bg-brand-600 text-white rounded-xl font-semibold shadow-lg hover:bg-brand-700 transition flex items-center justify-center gap-2 min-h-[44px]">
                    <i class="fa-solid fa-file-lines"></i> 查看我的报名
                </button>
                <button onclick="window.location.href='index.html'" class="flex-1 px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-medium hover:bg-slate-50 transition flex items-center justify-center gap-2 min-h-[44px]">
                    <i class="fa-solid fa-house"></i> 返回首页
                </button>
            </div>
        </div>

        <!-- 底部提示 -->
        <p class="text-center text-xs text-slate-400 mt-6">
            如有疑问，请联系客服：400-123-4567
        </p>
    </div>

    <script>
        // 页面加载后自动开始审核状态动画计时
        document.addEventListener('DOMContentLoaded', function() {
            // 模拟审核状态变更（仅演示用）
            let seconds = 0;
            setInterval(function() {
                seconds++;
                // 可在此处模拟状态变更通知
            }, 1000);
        });
    </script>
</body>
</html>
