<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 组织后台中心 (AISE Org Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 font-sans h-screen flex relative overflow-hidden text-slate-800">

    <!-- 背景装饰 -->
    <div class="absolute inset-0 z-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-20">
    </div>
    <div
        class="absolute -top-40 -right-40 w-96 h-96 bg-brand-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30">
    </div>
    <div
        class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30">
    </div>

    <div class="w-full max-w-5xl mx-auto flex items-center justify-center relative z-10 px-6">
        <div class="bg-white rounded-2xl shadow-2xl flex w-full overflow-hidden min-h-[560px]">

            <!-- 左侧品牌展示区 (可替换为实际机构海报或系统亮点) -->
            <div
                class="hidden md:flex flex-col w-5/12 bg-gradient-to-br from-brand-600 to-indigo-800 text-white p-10 relative">
                <div
                    class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10">
                </div>

                <div class="relative z-10 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-3 mb-10">
                            <div
                                class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center font-bold text-2xl shadow-sm border border-white/20">
                                O</div>
                            <span class="font-bold tracking-wider text-xl">AISE / OrgCenter</span>
                        </div>

                        <h2 class="text-3xl font-bold leading-tight mb-4">连接机构生态<br>构建一体化能力测评</h2>
                        <p class="text-brand-100 text-sm leading-relaxed mb-8">
                            专为机构开发者与管理者打造的工作台。在此配置业务与 API，轻松将优质测评体系融入您的业务版图。
                        </p>

                        <div class="space-y-4">
                            <div class="flex items-start gap-3">
                                <i class="fa-solid fa-code text-brand-300 mt-0.5"></i>
                                <div>
                                    <h4 class="font-bold text-sm">标准对接协议</h4>
                                    <p class="text-xs text-brand-200 mt-1">丰富的 API 与实时 Webhook 回调推送。</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-3">
                                <i class="fa-solid fa-chart-pie text-brand-300 mt-0.5"></i>
                                <div>
                                    <h4 class="font-bold text-sm">业务数据闭环</h4>
                                    <p class="text-xs text-brand-200 mt-1">随时掌握本机构报名进度与考评记录。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧登录表单区 -->
            <div class="w-full md:w-7/12 p-10 lg:p-14 flex items-center bg-white relative">

                <div class="w-full max-w-sm mx-auto">
                    <div class="mb-10 text-center md:text-left">
                        <h3 class="text-2xl font-bold text-slate-800 mb-2">欢迎登录组织后台</h3>
                        <p class="text-sm text-slate-500">请输入运营人员为您分配的租户账户与密码</p>
                    </div>

                    <form action="./首页_概览.html" class="space-y-6">
                        <!-- 账号 -->
                        <div class="space-y-1">
                            <label class="text-xs text-slate-500 font-bold uppercase tracking-wider block">登录账号</label>
                            <div class="relative">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-regular fa-user"></i>
                                </div>
                                <input type="text"
                                    class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                                    placeholder="输入机构账号 (如 admin_ypb2025)">
                            </div>
                        </div>

                        <!-- 密码 -->
                        <div class="space-y-1">
                            <div class="flex items-center justify-between">
                                <label class="text-xs text-slate-500 font-bold uppercase tracking-wider">密码</label>
                            </div>
                            <div class="relative">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-lock text-sm"></i>
                                </div>
                                <input type="password" id="pwd"
                                    class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                                    placeholder="请输入密码">
                                <button type="button" onclick="togglePwd()"
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand-600 focus:outline-none">
                                    <i class="fa-regular fa-eye" id="eye-icon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 其他选项 -->
                        <div class="flex items-center justify-between mt-4">
                            <label class="flex items-center">
                                <input type="checkbox"
                                    class="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500">
                                <span class="ml-2 text-sm text-slate-600">记住账号</span>
                            </label>
                            <a href="#" class="text-xs text-brand-600 hover:text-brand-800 font-medium">忘记密码?
                                需联系平台运营</a>
                        </div>

                        <!-- 提交按钮 -->
                        <div class="pt-4">
                            <button type="submit"
                                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                                登录进入控制台 <i class="fa-solid fa-arrow-right ml-2 mt-0.5"></i>
                            </button>
                        </div>
                    </form>

                    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                        <p class="text-xs text-slate-400"><i class="fa-solid fa-shield-halved mr-1"></i>
                            您正在登录受到安全策略保护的组织专网</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function togglePwd() {
            const pwdInput = document.getElementById('pwd');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>

</html>
