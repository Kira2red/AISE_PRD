<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台概览 - 组织后台中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' }, // 定制化主色调: Teal青色
                    },
                    boxShadow: { 'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .nav-item.active {
            background-color: #f0fdfa;
            color: #0d9488;
            font-weight: 600;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10%;
            height: 80%;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background-color: #0d9488;
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden text-slate-800 font-sans">

    <!-- 侧边栏 (组织后台专属) -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 z-20 transition-all duration-300">

        <!-- 组织品牌区 -->
        <div class="h-[72px] flex items-center px-6 border-b border-slate-800 bg-slate-950/50">
            <div
                class="w-8 h-8 bg-gradient-to-br from-brand-500 to-emerald-600 rounded flex items-center justify-center text-white font-bold text-lg mr-3 shadow-lg">
                Y</div>
            <div class="flex-1 min-w-0">
                <h1 class="font-bold text-sm text-white truncate">猿编程教育科技</h1>
                <p class="text-[10px] text-slate-500 font-mono truncate">ID: YPB2025</p>
            </div>
        </div>

        <!-- 导航菜单 -->
        <nav class="flex-1 overflow-y-auto py-6 space-y-1 custom-scroll px-3 cursor-pointer">

            <div class="px-3 pb-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">业务数据中心</div>
            <a href="03_学生列表.html"
                class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative group">
                <i class="fa-solid fa-users w-5 text-center group-hover:text-brand-400 transition-colors"></i><span
                    class="text-sm">本渠道学生</span>
            </a>
            <a href="04_报名列表.html"
                class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative group">
                <i
                    class="fa-solid fa-clipboard-list w-5 text-center group-hover:text-brand-400 transition-colors"></i><span
                    class="text-sm">成绩与进度查询</span>
            </a>

            <div class="px-3 pb-2 pt-6 text-[10px] font-bold text-slate-500 uppercase tracking-wider">系统与开发者</div>
            <a href="05_密钥与Webhook.html"
                class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg transition relative group">
                <i class="fa-solid fa-key w-5 text-center text-brand-500"></i><span class="text-sm text-brand-700">配置与密钥
                    (API)</span>
            </a>
            <a href="06_联调日志.html"
                class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative group">
                <i
                    class="fa-solid fa-satellite-dish w-5 text-center group-hover:text-brand-400 transition-colors"></i><span
                    class="text-sm">联调与接口日志</span>
            </a>

        </nav>

        <!-- 底部用户信息 -->
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3 hover:bg-slate-800 p-2 rounded-lg cursor-pointer transition">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=AdminUser"
                    class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700">
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold text-slate-200 truncate">admin_ypb2025</p>
                    <p class="text-[10px] text-slate-500 truncate">管理员</p>
                </div>
                <i
                    class="fa-solid fa-arrow-right-from-bracket text-slate-500 hover:text-red-400 transition text-sm"></i>
            </div>
        </div>
    </aside>

    <!-- 主右侧内容区 -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50/50 relative">

        <!-- 顶部通栏 -->
        <header
            class="h-[72px] bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-10 sticky top-0 backdrop-blur-md bg-white/90">
            <div class="flex items-center gap-4">
                <h2 class="text-lg font-bold text-slate-800">开发者配置</h2>
                <span
                    class="bg-brand-50 text-brand-600 text-xs px-2.5 py-1 rounded-full font-medium border border-brand-100 flex items-center gap-1.5"><span
                        class="w-1.5 h-1.5 bg-brand-500 rounded-full"></span> API 服务运行中</span>
            </div>

            <div class="flex items-center gap-5">
                <button
                    class="text-slate-400 hover:text-brand-600 transition flex items-center gap-2 text-sm font-medium">
                    <i class="fa-solid fa-book-open text-brand-500"></i> 开发文档中心
                </button>
                <div class="w-px h-5 bg-slate-200"></div>
                <button class="relative text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500 border-2 border-white"></span>
                    </span>
                </button>
            </div>
        </header>

        <!-- 滚动内容容器 -->
        <div class="flex-1 overflow-y-auto p-8 custom-scroll">
            <div class="max-w-6xl mx-auto space-y-6">

                <!-- 占位提示 -->
                <div class="bg-white rounded-xl shadow-card border border-slate-200 p-12 text-center text-slate-500">
                    <p>页面模板结构载入成功。请在此区域填充具体的组织后台模块内容。</p>
                </div>

            </div>
        </div>

    </main>

</body>

</html>
