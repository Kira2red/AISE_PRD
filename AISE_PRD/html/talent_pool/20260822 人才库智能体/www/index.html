<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品上传 - 人工智能人才资源库</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <div class="brand"><img src="aise-logo.png" alt="AISE"> 人工智能人才资源库</div>
    <nav class="tabs">
        <a href="index.html" class="active">作品上传</a>
        <a href="card.html">人才卡</a>
        <a href="report.html">画像分析</a>
    </nav>
    <span class="mode-badge" id="modeBadge">…</span>
</div>

<div class="upload-card" style="margin-top:24px">
    <div class="upload-card-title">作品上传</div>
    <div class="upload-card-sub">上传你的学习作品（代码 / 图片 / PDF），智能体将自动预审，经后台人工终审后归档入库</div>
    <div id="modeNotice"></div>

    <label>作品名称（必填）</label>
    <input type="text" class="basic-input" id="name" placeholder="如：智能计算器小程序">

    <label>作品描述（选填，辅助智能体理解作品）</label>
    <textarea id="desc" rows="3" placeholder="一句话说明作品做了什么"></textarea>

    <label>作品文件（必选，≤10MB，类型自动识别）</label>
    <div class="file-box" id="fileBox">
        <input type="file" id="file" accept=".py,.js,.java,.c,.cpp,.html,.css,.txt,.md,.png,.jpg,.jpeg,.webp,.pdf">
        <div>点击选择文件</div>
        <div style="font-size:12px;margin-top:6px" id="fileHint"></div>
    </div>
    <div style="margin-top:10px">
        已识别类型：<span class="type-tag" id="typeTag">待选择文件</span>
    </div>

    <div style="margin-top:20px">
        <button class="btn" id="submitBtn">提交审核</button>
        <span class="notice" id="submitMsg" style="margin-left:12px"></span>
    </div>
</div>

<div class="upload-card">
    <div class="upload-card-title">我的作品</div>
    <div class="upload-card-sub">审核状态：审核中 → 审核完成（未通过可重新提交）</div>
    <div id="workList"><div class="empty">暂无提交记录</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const typeNames = { code: '代码', image: '图片', pdf: 'PDF' };
// 扩展名 → 类型（自动识别）
const extToType = {};
['py','js','java','c','cpp','html','css','txt','md'].forEach(e => extToType[e] = 'code');
['png','jpg','jpeg','webp'].forEach(e => extToType[e] = 'image');
['pdf'].forEach(e => extToType[e] = 'pdf');

fetch('/api/health').then(r => r.json()).then(m => {
    const b = $('#modeBadge');
    b.textContent = m.mode === 'real' ? 'AI 真实模式' : 'Mock 模拟模式';
    if (m.mode !== 'real') b.classList.add('mock');
    if (m.mode !== 'real') {
        $('#modeNotice').innerHTML = '<div class="mock-note">当前为 <b>Mock 模拟模式</b>：智能体预审返回显式标注「模拟结果」的预设结论，全链路照常演示。配置 .env 中的 DEEPSEEK_API_KEY 后重启即可切换真实模式。</div>';
    }
});

let fileData = null, fileName = '', detectedType = null;
$('#fileBox').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const typ = extToType[ext];
    const tag = $('#typeTag');
    if (!typ) {
        tag.textContent = '不支持的类型（.ext）'.replace('ext', ext);
        tag.style.background = '#FEE2E2'; tag.style.color = '#991B1B';
        $('#fileHint').innerHTML = '支持：代码（.py .js .java .c .cpp .html .css .txt .md）、图片（.png .jpg .jpeg .webp）、PDF（.pdf）';
        return;
    }
    if (f.size > 10 * 1024 * 1024) { $('#fileHint').innerHTML = '文件超过 10MB'; return; }
    fileName = f.name;
    detectedType = typ;
    tag.textContent = typeNames[typ];
    tag.style.background = '#F0EDFF'; tag.style.color = '#5037cd';
    const rd = new FileReader();
    rd.onload = () => {
        fileData = rd.result.split(',')[1];
        $('#fileBox').classList.add('done');
        $('#fileHint').innerHTML = f.name + '（' + (f.size / 1024).toFixed(1) + 'KB）已就绪，识别为「' + typeNames[typ] + '」';
    };
    rd.readAsDataURL(f);
});

$('#submitBtn').addEventListener('click', async () => {
    const name = $('#name').value.trim();
    const msg = $('#submitMsg');
    if (!name) { msg.textContent = '请填写作品名称'; return; }
    if (!fileData) { msg.textContent = '请选择作品文件'; return; }
    $('#submitBtn').disabled = true; msg.textContent = '提交中…';
    try {
        const r = await fetch('/api/works', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, type: detectedType, desc: $('#desc').value.trim(),
                                   filename: fileName, content_b64: fileData })
        });
        const j = await r.json();
        if (!r.ok) { msg.textContent = j.error || '提交失败'; $('#submitBtn').disabled = false; return; }
        msg.textContent = '提交成功，作品进入审核中';
        $('#name').value = ''; $('#desc').value = '';
        fileData = null; fileName = ''; detectedType = null;
        $('#fileBox').classList.remove('done'); $('#fileHint').textContent = '';
        $('#typeTag').textContent = '待选择文件';
        loadWorks();
        setTimeout(() => { msg.textContent = ''; }, 3000);
    } catch (e) { msg.textContent = '网络错误，请重试'; }
    $('#submitBtn').disabled = false;
});

const statusCls = { '审核中': 'badge-pending', '审核完成': 'badge-approved', '未通过': 'badge-rejected' };
async function loadWorks() {
    const list = await (await fetch('/api/works')).json();
    const box = $('#workList');
    if (!list.length) { box.innerHTML = '<div class="empty">暂无提交记录</div>'; return; }
    box.innerHTML = '<table><thead><tr><th>作品名称</th><th>类型</th><th>提交时间</th><th>审核状态</th><th>说明</th></tr></thead><tbody>' +
        list.map(w => {
            const note = w.status === '未通过' ? '<span class="notice">驳回原因：' + (w.reject_reason || '—') + '，可修改后重新提交</span>' : '';
            return '<tr><td><b>' + w.name + '</b></td><td>' + typeNames[w.type] + '</td><td>' + w.created + '</td>' +
                '<td><span class="entry-status-badge ' + (statusCls[w.status] || 'badge-pending') + '">' + w.status + '</span></td><td>' + note + '</td></tr>';
        }).join('') + '</tbody></table>';
}
loadWorks();
setInterval(loadWorks, 4000);
</script>
</body>
</html>
