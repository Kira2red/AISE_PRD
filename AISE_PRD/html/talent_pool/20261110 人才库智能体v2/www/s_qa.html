<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>问答助手 · 学员端</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="wrap">
  <h1 class="page-title">问答助手</h1>
  <p class="page-sub">基于你自己在人才库的数据回答问题 · 超出范围的问题会被拦截</p>

  <div class="quick-q">
    <button onclick="ask('我在最近一次测评中考得怎么样？')">我在最近一次测评中考得怎么样？</button>
    <button onclick="ask('我哪个知识点最薄弱？该怎么提高？')">我哪个知识点最薄弱？该怎么提高？</button>
    <button onclick="ask('我的人才卡上有哪些特长标签？')">我的人才卡上有哪些特长标签？</button>
    <button class="probe" onclick="ask('帮我写一篇 300 字的作文')">⚠ 帮我写一篇 300 字的作文（越界测试）</button>
    <button class="probe" onclick="ask('明天天气怎么样？')">⚠ 明天天气怎么样？（越界测试）</button>
  </div>

  <div class="card chat-box">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input">
      <input type="text" id="qInput" placeholder="输入问题，例如：我的作品得了多少分？" onkeydown="if(event.key==='Enter')send()">
      <button class="btn" id="btnSend" onclick="send()">发送</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
async function init() { await guard('student'); addBot('你好！我是人才库问答助手，只基于你自己的人才库数据回答问题。你可以问我测评成绩、知识点掌握情况、作品评价和成长建议。'); }
function addUser(text) {
  const log = document.getElementById('chatLog');
  log.insertAdjacentHTML('beforeend', '<div class="msg user">' + esc(text) + '</div>');
  log.scrollTop = log.scrollHeight;
}
function addBot(text, refuse, scopeLabel) {
  const log = document.getElementById('chatLog');
  log.insertAdjacentHTML('beforeend',
    '<div class="msg bot' + (refuse ? ' refuse' : '') + '">' + esc(text) +
    (scopeLabel ? '<span class="scope">来源：' + esc(scopeLabel) + '</span>' : '') + '</div>');
  log.scrollTop = log.scrollHeight;
}
function ask(q) { document.getElementById('qInput').value = q; send(); }
async function send() {
  const input = document.getElementById('qInput');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addUser(q);
  addBot('思考中…', false, '');
  const btn = document.getElementById('btnSend'); btn.disabled = true;
  try {
    const r = await post('/api/qa', { question: q });
    const log = document.getElementById('chatLog');
    log.lastElementChild.remove();
    addBot(r.answer, r.scope === 'refuse', r.scopeLabel);
  } catch (e) {
    const log = document.getElementById('chatLog');
    log.lastElementChild.remove();
    addBot('出错了：' + e.message, true, '');
  }
  btn.disabled = false; input.focus();
}
init();
</script>
</body>
</html>
