<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>画像分析报告 · 学员端</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="wrap">
  <h1 class="page-title">画像分析报告</h1>
  <p class="page-sub">综合 AISE 测评记录、逐题作答、入库作品评价与简历材料生成 · 由智能体生成，内容经审核后提供</p>
  <div id="content"></div>
</div>

<script src="/common.js"></script>
<script>
let pollTimer = null;

async function init() {
  await guard('student');
  await load();
  pollTimer = setInterval(async () => {
    if (document.getElementById('generating')) await load();
  }, 4000);
}

async function load() {
  const el = document.getElementById('content');
  const r = await api('/api/student/report');
  if (r.empty) {
    el.innerHTML = '<div class="notice warn">暂未关联 AISE 测评数据，如已参加 AISE 测评请联系管理员</div>';
    return;
  }
  const rep = r.report;
  if (!rep || rep.error) {
    el.innerHTML =
      '<div class="card"><h2>生成画像分析报告</h2>' +
      (rep && rep.error ? '<div class="notice warn">上次生成失败：' + esc(rep.error) + '</div>' : '') +
      '<p class="muted">点击下方按钮，智能体将基于你的测评记录、逐题作答与入库作品生成个人画像分析。</p>' +
      '<div class="mt16"><button class="btn" onclick="generate()">生成画像分析报告</button></div></div>';
    return;
  }
  const c = rep.content || {};
  el.innerHTML =
    '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<h2 style="margin:0">画像概览</h2>' +
    '<span class="muted">生成时间 ' + esc(rep.generatedAt) + ' · 模型 ' + esc(rep.model) +
    ' <button class="btn ghost sm" style="margin-left:8px" onclick="generate(true)">重新生成</button></span></div>' +
    '<p class="mt8">' + esc(c.summary || '') + '</p></div>' +
    '<div class="grid2">' +
    '<div class="card"><h2>能力优势</h2><ul>' + (c.strengths || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
    '<div class="card"><h2>能力短板</h2><ul>' + (c.weaknesses || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
    '</div>' +
    '<div class="card"><h2>下一阶段建议</h2><ol>' + (c.suggestions || []).map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></div>' +
    '<div class="card"><h2>知识点掌握明细 <span class="hint">来自 AISE 逐题作答统计（≥60% 稳定掌握，&lt;60% 重点提升）</span></h2>' +
    '<table class="tb"><thead><tr><th>知识点</th><th style="width:34%">掌握度</th><th>错误类型</th></tr></thead><tbody id="knList"></tbody></table></div>';
  const aise = r.student.aise;
  document.getElementById('knList').innerHTML = (aise && aise.knowledge || []).map(k => {
    const pct = Math.round(k.mastery);
    const cls = pct >= 60 ? 'ok' : 'bad';
    return '<tr><td>' + esc(k.point) + '</td>' +
      '<td><div style="background:#eef1f6;border-radius:99px;height:14px;position:relative">' +
      '<div style="position:absolute;left:0;top:0;bottom:0;width:' + pct + '%;background:' +
      (pct >= 60 ? 'var(--ok)' : 'var(--bad)') + ';border-radius:99px"></div></div>' +
      '<span class="muted" style="font-size:12px">' + pct + '%</span></td>' +
      '<td>' + (k.errType ? '<span class="badge ' + (k.errType === '粗心' ? 'warn' : 'bad') + '">' + esc(k.errType) + '</span>' : '<span class="badge ok">稳定掌握</span>') + '</td></tr>';
  }).join('');
}

async function generate(isRegen) {
  await post('/api/student/report/generate');
  document.getElementById('content').innerHTML =
    '<div class="card"><h2 id="generating"><span class="pulse"></span>智能体正在生成画像分析报告…</h2>' +
    '<p class="muted">通常需要 20-60 秒，页面会自动刷新结果。</p></div>';
}
init();
</script>
</body>
</html>
