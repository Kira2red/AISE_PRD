<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>画像分析报告 · 学员端</title>
<link rel="stylesheet" href="/style.css">
<style>
    :root {
        --r-blue: #2563eb;
        --r-blue-deep: #1d4ed8;
        --r-ink: #0f172a;
        --r-ink2: #475569;
        --r-muted: #94a3b8;
        --r-line: #e8edf4;
        --r-bg: #f6f8fb;
    }
    body { background: var(--r-bg); }
    .rp-wrap { max-width: 1120px; margin: 20px auto 60px; padding: 0 24px; }

    /* ===== 顶栏 Hero：总体评价 ===== */
    .hero {
        border-radius: 22px; overflow: hidden; color: #fff; position: relative;
        background: linear-gradient(128deg, #1e40af 0%, #2563eb 46%, #3b82f6 78%, #60a5fa 100%);
        box-shadow: 0 12px 32px rgba(37,99,235,.28);
    }
    .hero::after {
        content: ""; position: absolute; right: -60px; top: -80px; width: 300px; height: 300px;
        border-radius: 50%; background: rgba(255,255,255,.08);
    }
    .hero::before {
        content: ""; position: absolute; right: 90px; bottom: -110px; width: 220px; height: 220px;
        border-radius: 50%; background: rgba(255,255,255,.06);
    }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 26px 32px 0; position: relative; z-index: 1; }
    .hero-id { display: flex; align-items: center; gap: 14px; }
    .hero-avatar {
        width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.18);
        display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;
        backdrop-filter: blur(4px); flex-shrink: 0;
    }
    .hero-id h1 { font-size: 21px; font-weight: 700; letter-spacing: .5px; }
    .hero-id p { font-size: 12.5px; opacity: .85; margin-top: 2px; }
    .btn-regen {
        border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.14); color: #fff;
        border-radius: 10px; padding: 8px 18px; font-size: 13px; cursor: pointer;
        backdrop-filter: blur(4px); transition: background .15s; font-family: inherit; flex-shrink: 0;
    }
    .btn-regen:hover { background: rgba(255,255,255,.26); }
    .hero-quote { padding: 18px 32px 32px; position: relative; z-index: 1; }
    .hero-quote .tagline {
        display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: 1.5px;
        opacity: .85; margin-bottom: 8px; font-weight: 600;
    }
    .hero-quote p { font-size: 16.5px; line-height: 1.75; font-weight: 500; max-width: 920px; }

    /* ===== 指标卡 ===== */
    .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin: 20px 0 26px; }
    .stat {
        background: #fff; border-radius: 16px; padding: 18px 18px 16px;
        box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 18px rgba(15,23,42,.05);
        transition: transform .15s, box-shadow .15s;
    }
    .stat:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(15,23,42,.06), 0 12px 26px rgba(15,23,42,.09); }
    .stat .lb { font-size: 11.5px; color: var(--r-muted); letter-spacing: 1px; margin-bottom: 8px; }
    .stat .num { font-size: 30px; font-weight: 800; color: var(--r-ink); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat .num small { font-size: 13px; font-weight: 600; color: var(--r-ink2); margin-left: 2px; }
    .stat .sub { font-size: 11px; color: var(--r-muted); margin-top: 9px; }

    /* ===== 区块卡片 ===== */
    .sec {
        background: #fff; border-radius: 18px; padding: 24px 28px 22px; margin-bottom: 18px;
        box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 18px rgba(15,23,42,.05);
    }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
    .sec-head .eyebrow { font-size: 11px; letter-spacing: 2px; color: var(--r-muted); font-weight: 700; display: block; margin-bottom: 4px; }
    .sec-head h2 { font-size: 17px; font-weight: 700; color: var(--r-ink); }
    .sec-head .meta { font-size: 12px; color: var(--r-muted); }

    /* AI 点评条 */
    .ai-note {
        display: flex; gap: 10px; align-items: flex-start;
        background: linear-gradient(90deg, #eef4ff, #f6f9ff 70%);
        border-left: 3px solid var(--r-blue); border-radius: 10px;
        padding: 12px 16px; margin-top: 18px; font-size: 13.5px; line-height: 1.65; color: #1e3a8a;
    }
    .ai-note .star { color: var(--r-blue); font-weight: 900; flex-shrink: 0; }
    .ai-note b { font-weight: 700; margin-right: 8px; }

    /* 考试记录 */
    .exam-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .exam-card {
        border: 1px solid var(--r-line); border-radius: 14px; padding: 16px 18px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        transition: border-color .15s, transform .15s;
    }
    .exam-card:hover { border-color: #bfdbfe; transform: translateY(-1px); }
    .exam-card .lvl { font-size: 15px; font-weight: 700; color: var(--r-ink); }
    .exam-card .sub { font-size: 12px; color: var(--r-muted); margin-top: 4px; }
    .exam-score { text-align: right; flex-shrink: 0; }
    .exam-score .n { font-size: 26px; font-weight: 800; color: var(--r-blue-deep); font-variant-numeric: tabular-nums; }
    .exam-score .n small { font-size: 12px; color: var(--r-muted); font-weight: 500; }
    .grade-chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 99px; margin-top: 4px; }
    .grade-chip.good { background: #ecfdf5; color: #047857; }
    .grade-chip.fair { background: #fffbeb; color: #b45309; }

    /* 趋势图 */
    .trend-svg { width: 100%; max-height: 150px; margin-top: 14px; }

    /* 双栏容器 */
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 900px) { .duo { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(3, 1fr); } }

    /* 知识点掌握条 */
    .kn-row { display: grid; grid-template-columns: 170px 1fr 56px; gap: 14px; align-items: center; padding: 9px 0; }
    .kn-row .nm { font-size: 13.5px; color: var(--r-ink); font-weight: 500; }
    .kn-track { height: 12px; background: #eef2f7; border-radius: 99px; overflow: hidden; }
    .kn-fill { height: 100%; border-radius: 99px; transition: width .4s; }
    .kn-fill.ok { background: linear-gradient(90deg, #34d399, #10b981); }
    .kn-fill.low { background: linear-gradient(90deg, #f87171, #ef4444); }
    .kn-pct { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
    .kn-pct.low { color: var(--r-red, #ef4444); }
    .kn-pct.ok { color: #047857; }
    .err-chip { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; margin-left: 8px; vertical-align: 1px; }
    .tl-item.honor::before { border-color: #f59e0b !important; }
    .err-chip.careless { background: #fffbeb; color: #b45309; }
    .err-chip.confuse { background: #fef2f2; color: #b91c1c; }
    .err-chip.unlearned { background: #fef2f2; color: #991b1b; }

    /* 雷达 */
    .radar-flex { display: flex; align-items: center; gap: 10px; justify-content: center; }
    .radar-flex svg { width: 265px; height: 240px; }
    .radar-legend { font-size: 12.5px; color: var(--r-ink2); flex: 1; max-width: 180px; }
    .radar-legend .rl { display: flex; justify-content: space-between; gap: 26px; padding: 5px 0; border-bottom: 1px dashed var(--r-line); }
    .radar-legend .rl:last-child { border-bottom: none; }
    .radar-legend .rl b { font-variant-numeric: tabular-nums; color: var(--r-blue-deep); }

    /* 错误归因 donut */
    .err-flex { display: flex; align-items: center; gap: 36px; justify-content: center; }
    .donut { width: 150px; height: 150px; flex-shrink: 0; }
    .donut-center-num { font-size: 26px; font-weight: 800; fill: #0f172a; }
    .err-legend { font-size: 13px; color: var(--r-ink2); flex: 1; max-width: 220px; }
    .err-legend .el { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .err-dot { width: 10px; height: 10px; border-radius: 4px; flex-shrink: 0; }
    .err-legend b { font-variant-numeric: tabular-nums; margin-left: auto; }

    /* 逐题作答 */
    .q-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed var(--r-line); font-size: 13.5px; }
    .q-row:last-child { border-bottom: none; }
    .q-idx { width: 24px; height: 24px; border-radius: 8px; background: #f1f5f9; color: var(--r-ink2); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .q-result { margin-left: auto; flex-shrink: 0; padding-right: 2px; }
    .chip-ok { background: #ecfdf5; color: #047857; }
    .chip-bad { background: #fef2f2; color: #b91c1c; }
    .chip-ok, .chip-bad { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 99px; }

    /* 作品卡 */
    .work-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .work-card { border: 1px solid var(--r-line); border-radius: 14px; padding: 15px 17px; }
    .work-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .work-card .nm { font-size: 14.5px; font-weight: 700; color: var(--r-ink); }
    .work-card .score { font-size: 22px; font-weight: 800; color: var(--r-blue-deep); font-variant-numeric: tabular-nums; }
    .work-card .score small { font-size: 11px; color: var(--r-muted); font-weight: 500; }
    .work-card .wtags { margin: 8px 0 6px; }
    .work-card .wtags span { display: inline-block; font-size: 11px; background: #eef4ff; color: var(--r-blue-deep); border-radius: 99px; padding: 2px 10px; margin: 0 4px 4px 0; font-weight: 600; }
    .work-card .cmt { font-size: 12.5px; color: var(--r-ink2); line-height: 1.6; }

    /* 成长时间线 */
    .tl { position: relative; padding-left: 28px; }
    .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: #e2e8f0; border-radius: 2px; }
    .tl-item { position: relative; padding: 6px 0 18px; }
    .tl-item::before { content: ""; position: absolute; left: -25px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2.5px solid var(--r-blue); }
    .tl-item .t { font-size: 11.5px; color: var(--r-muted); }
    .tl-item .n { font-size: 13.5px; color: var(--r-ink); font-weight: 600; margin-top: 1px; }
    .tl-item .n span { font-weight: 400; color: var(--r-ink2); font-size: 12.5px; }

    /* 建议 */
    .sug-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .sug-card { border: 1px solid var(--r-line); border-radius: 14px; padding: 15px 17px; display: flex; gap: 12px; transition: border-color .15s, transform .15s; }
    .sug-card:hover { border-color: #bfdbfe; transform: translateY(-1px); }
    .sug-num {
        width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
        background: linear-gradient(135deg, #2563eb, #60a5fa); color: #fff;
        font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .sug-card p { font-size: 13.5px; line-height: 1.65; color: var(--r-ink2); }

    .foot-note { text-align: center; font-size: 11.5px; color: var(--r-muted); margin-top: 26px; }

    /* 生成中 */
    .gen-hero { text-align: center; padding: 90px 0; }
    .gen-hero .pulse-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--r-blue); display: inline-block; animation: rp 1.1s infinite; margin-right: 10px; }
    @keyframes rp { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="rp-wrap" id="content"></div>

<script src="/common.js"></script>
<script>
const AI = (txt) => !txt ? '' :
    '<div class="ai-note"><span class="star">✦</span><span><b>AI 点评</b>' + esc(txt) + '</span></div>';

function stat(lb, num, unit, sub) {
    return '<div class="stat"><div class="lb">' + lb + '</div><div class="num">' + num + '<small>' + unit + '</small></div><div class="sub">' + sub + '</div></div>';
}

function dateCn(s) {
    const m = /^(\d{4})-(\d{2})$/.exec(s || '');
    return m ? m[1] + '年' + parseInt(m[2], 10) + '月' : (s || '');
}

function trendSvg(exams) {
    const W = 1000, H = 280, padX = 100, padTop = 60, padBot = 70;
    const n = exams.length;
    const min = 60, max = 100;
    const pts = exams.map((e, i) => [
        n === 1 ? W / 2 : padX + i * (W - 2 * padX) / (n - 1),
        H - padBot - (e.score - min) / (max - min) * (H - padTop - padBot)
    ]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - padBot) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - padBot) + ' Z';
    let g = '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>';
    [70, 80, 90, 100].forEach(v => {
        const y = H - padBot - (v - min) / (max - min) * (H - padTop - padBot);
        g += '<line x1="' + padX * 0.6 + '" y1="' + y + '" x2="' + (W - padX * 0.4) + '" y2="' + y + '" stroke="#eef2f7" stroke-width="1"/>'
           + '<text x="' + (padX * 0.6 - 16) + '" y="' + (y + 5) + '" text-anchor="end" font-size="20" fill="#94a3b8">' + v + '</text>';
    });
    g += '<path d="' + area + '" fill="url(#tg)"/>';
    g += '<path d="' + line + '" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach((p, i) => {
        const e = exams[i];
        g += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="12" fill="#fff" stroke="#2563eb" stroke-width="5"/>'
           + '<text x="' + p[0] + '" y="' + (p[1] - 36) + '" text-anchor="middle" font-size="27" font-weight="800" fill="#1d4ed8">' + e.score + '</text>'
           + '<text x="' + p[0] + '" y="' + (H - padBot + 48) + '" text-anchor="middle" font-size="22" fill="#64748b">' + esc(dateCn(e.date)) + ' · ' + esc(e.level) + '</text>';
    });
    return '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
}

function radarSvg(dims) {
    const cx = 105, cy = 100, R = 68;
    const keys = Object.keys(dims), n = keys.length;
    const pt = (i, r) => {
        const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
        return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    };
    let g = '';
    [1, .75, .5, .25].forEach(k => {
        const ps = keys.map((kk, i) => { const [x, y] = pt(i, R * k); return x.toFixed(1) + ',' + y.toFixed(1); }).join(' ');
        g += '<polygon points="' + ps + '" fill="none" stroke="#e8edf4" stroke-width="1"/>';
    });
    keys.forEach((k, i) => { const [x, y] = pt(i, R); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="#eef2f7"/>'; });
    const ps = keys.map((k, i) => { const [x, y] = pt(i, R * dims[k] / 100); return x.toFixed(1) + ',' + y.toFixed(1); }).join(' ');
    g += '<polygon points="' + ps + '" fill="rgba(37,99,235,.14)" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>';
    keys.forEach((k, i) => {
        const [x, y] = pt(i, R * dims[k] / 100);
        g += '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="2"/>';
    });
    keys.forEach((k, i) => {
        const [x, y] = pt(i, R + 24);
        g += '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">' + k + '</text>';
    });
    return '<svg viewBox="0 0 210 200">' + g + '</svg>';
}

function donutSvg(dist) {
    const total = dist.reduce((s, d) => s + d.count, 0) || 1;
    const r = 56, C = 2 * Math.PI * r;
    let off = 0, g = '';
    dist.forEach(d => {
        const len = d.count / total * C;
        g += '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="' + d.color + '" stroke-width="22"'
           + ' stroke-dasharray="' + Math.max(len - 3, 1).toFixed(1) + ' ' + Math.max(C - len + 3, 1).toFixed(1) + '"'
           + ' stroke-dashoffset="' + (-off).toFixed(1) + '" transform="rotate(-90 75 75)" stroke-linecap="round"/>';
        off += len;
    });
    g += '<text x="75" y="72" text-anchor="middle" class="donut-center-num">' + total + '</text>'
       + '<text x="75" y="94" text-anchor="middle" font-size="13" fill="#94a3b8">失题数</text>';
    return '<svg class="donut" viewBox="0 0 150 150">' + g + '</svg>';
}

const ERR_META = {
    '粗心': { color: '#f59e0b', cls: 'careless' },
    '概念混淆': { color: '#ef4444', cls: 'confuse' },
    '未掌握': { color: '#dc2626', cls: 'unlearned' },
};

async function load() {
    const el = document.getElementById('content');
    const r = await api('/api/student/report');
    if (r.empty) {
        el.innerHTML = '<div class="notice warn" style="margin-top:24px">暂未关联 AISE 测评数据，如已参加 AISE 测评请联系管理员</div>';
        return;
    }
    const rep = r.report;
    if (!rep || rep.error) {
        el.innerHTML = '<div class="sec gen-hero" style="margin-top:24px">'
            + (rep && rep.error ? '<div class="notice warn" style="margin-bottom:16px">上次生成失败：' + esc(rep.error) + '</div>' : '')
            + '<div style="font-size:17px;font-weight:700;color:#0f172a;margin-bottom:8px">还没有画像分析报告</div>'
            + '<p style="color:#94a3b8;font-size:13.5px;margin-bottom:20px">智能体将综合测评成绩、逐题作答、知识点掌握与入库作品生成你的专属报告</p>'
            + '<button class="btn-regen" style="border-color:#2563eb;background:#2563eb" onclick="generate()">生成画像分析报告</button></div>';
        return;
    }
    const c = rep.content || {};
    const stu = r.student, aise = stu.aise || {};
    const exams = aise.exams || [];
    const kn = aise.knowledge || [];
    const answers = aise.answers || [];
    const profile = await api('/api/student/profile');
    const works = profile.works || [];
    // 客观统计
    const totalQ = exams.reduce((s, e) => s + (e.questionCount || 0), 0);
    const avg = exams.length ? Math.round(exams.reduce((s, e) => s + e.score, 0) / exams.length) : 0;
    const best = exams.length ? Math.max(...exams.map(e => e.score)) : 0;
    const workAvg = works.length ? Math.round(works.reduce((s, w) => s + (w.score || 0), 0) / works.length) : 0;
    // 错误归因分布
    const errMap = {};
    kn.forEach(k => { if (k.errType) errMap[k.errType] = (errMap[k.errType] || 0) + 1; });
    answers.forEach(a => { if (a.result === '错' && a.errType) errMap[a.errType] = (errMap[a.errType] || 0) + 1; });
    const dist = Object.keys(ERR_META).filter(t => errMap[t]).map(t => ({ type: t, count: errMap[t], color: ERR_META[t].color }));
    const wrongCount = dist.reduce((s, d) => s + d.count, 0);
    const activities = aise.activities || [];
    const mats = stu.materials || {};

    el.innerHTML =
    // —— Hero 顶栏：总体评价 ——
    '<div class="hero">' +
      '<div class="hero-top">' +
        '<div class="hero-id"><div class="hero-avatar">' + esc((stu.name || '学')[0]) + '</div>' +
          '<div><h1>' + esc(stu.name) + ' · 画像分析报告</h1>' +
          '<p>' + esc(stu.school) + ' ' + esc(stu.grade) + ' · 人才库编号 ' + esc((stu.basic || {}).cardNo || '—') +
          ' · 生成于 ' + esc(rep.generatedAt) + ' · ' + esc(rep.model) + '</p></div></div>' +
        '<button class="btn-regen" onclick="generate(true)">重新生成</button>' +
      '</div>' +
      '<div class="hero-quote"><span class="tagline">✦ 总体评价 · AI GENERATIVE PROFILE</span>' +
      '<p>' + esc(c.summary || '') + '</p></div>' +
    '</div>' +

    // —— 指标卡 ——
    '<div class="stats">' +
      stat('考试场次', exams.length, '场', '最近 ' + (exams.length ? esc(dateCn(exams[exams.length - 1].date)) : '—')) +
      stat('累计测评题数', totalQ, '题', '涵盖 ' + exams.map(e => esc(e.level)).join('、')) +
      stat('涵盖知识点', kn.length, '个', 'AI 基础 · 编程思维') +
      stat('涵盖能力域', Object.keys(stu.card.radar || {}).length, '个', '认知/应用/创新/责任') +
      stat('平均得分', avg, '分', '最高 ' + best + ' 分') +
      stat('入库作品', works.length, '份', '平均 ' + workAvg + ' 分') +
    '</div>' +

    // —— 考试成绩与趋势 ——
    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">EXAM RECORDS</span><h2>考试成绩与趋势</h2></div>' +
    '<span class="meta">客观记录 · 来自 AISE 测评平台</span></div>' +
    '<div class="exam-list">' + exams.map(e =>
      '<div class="exam-card"><div><div class="lvl">人工智能应用创新能力测评 · ' + esc(e.level) + '</div>' +
      '<div class="sub">' + esc(dateCn(e.date)) + ' · ' + (e.questionCount || '—') + ' 题 · ' + esc(e.duration || '') + '</div></div>' +
      '<div class="exam-score"><span class="n">' + e.score + '<small> /' + e.total + '</small></span><br>' +
      '<span class="grade-chip ' + (e.grade === '优秀' ? 'good' : 'fair') + '">' + esc(e.grade) + '</span></div></div>').join('') +
    '</div>' + trendSvg(exams) + AI(c.examComment) + '</div>' +

    // —— 知识点 + 能力雷达 双栏 ——
    '<div class="duo">' +
    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">KNOWLEDGE</span><h2>知识点掌握情况</h2></div>' +
    '<span class="meta">≥60% 稳定掌握</span></div>' +
    kn.map(k => {
      const pct = Math.round(k.mastery), low = pct < 60;
      const chip = k.errType ? '<span class="err-chip ' + (ERR_META[k.errType] || {}).cls + '">' + esc(k.errType) + '</span>' : '';
      return '<div class="kn-row"><span class="nm">' + esc(k.point) + chip + '</span>' +
        '<div class="kn-track"><div class="kn-fill ' + (low ? 'low' : 'ok') + '" style="width:' + pct + '%"></div></div>' +
        '<span class="kn-pct ' + (low ? 'low' : 'ok') + '">' + pct + '%</span></div>';
    }).join('') + AI(c.knowledgeComment) + '</div>' +

    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">ABILITIES</span><h2>能力维度分析</h2></div>' +
    '<span class="meta">综合测评与作品评价</span></div>' +
    '<div class="radar-flex">' + radarSvg(stu.card.radar || {}) +
    '<div class="radar-legend">' + Object.keys(stu.card.radar || {}).map(k =>
      '<div class="rl"><span>' + k + '</span><b>' + stu.card.radar[k] + '</b></div>').join('') + '</div></div>' +
    AI(c.radarComment) + '</div></div>' +

    // —— 错误归因 + 逐题 双栏 ——
    '<div class="duo">' +
    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">ERROR ANALYSIS</span><h2>错误归因分析</h2></div>' +
    '<span class="meta">汇总逐题与知识点 · ' + wrongCount + ' 失题</span></div>' +
    '<div class="err-flex">' + donutSvg(dist) +
    '<div class="err-legend">' + dist.map(d =>
      '<div class="el"><span class="err-dot" style="background:' + d.color + '"></span>' + esc(d.type) + '<b>×' + d.count + '</b></div>').join('') +
    '</div></div>' + AI(c.errorComment) + '</div>' +

    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">ANSWER SHEET</span><h2>逐题作答明细</h2></div>' +
    '<span class="meta">最近一次测评 · ' + answers.length + ' 题</span></div>' +
    '<div style="max-height:238px;overflow-y:auto;padding-right:4px">' +
    answers.map((a, i) =>
      '<div class="q-row"><span class="q-idx">' + (i + 1) + '</span><span>' + esc((a.q || '').replace(/^第\d+题·/, '')) + '</span>' +
      '<span class="q-result">' + (a.errType ? '<span class="err-chip ' + (ERR_META[a.errType] || {}).cls + '" style="margin-right:6px">' + esc(a.errType) + '</span>' : '') +
      '<span class="chip-' + (a.result === '对' ? 'ok' : 'bad') + '">' + (a.result === '对' ? '答对' : '答错') + '</span></span></div>').join('') +
    '</div></div></div>' +

    // —— 作品表现 ——
    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">PORTFOLIO</span><h2>作品表现</h2></div>' +
    '<span class="meta">已入库 ' + works.length + ' 份 · 平均 ' + workAvg + ' 分</span></div>' +
    '<div class="work-cards">' + works.map(w =>
      '<div class="work-card"><div class="top"><span class="nm">' + esc(w.name) + '</span>' +
      '<span class="score">' + (w.score != null ? w.score : '—') + '<small> 分</small></span></div>' +
      '<div class="wtags">' + (w.tags || []).map(t => '<span>' + esc(t) + '</span>').join('') + '</div>' +
      '<div class="cmt">' + esc(w.comment || '') + '</div></div>').join('') +
    '</div>' + AI(c.workComment) + '</div>' +

    // —— 成长足迹 ——
    (activities.length || (mats.honors || []).length ?
    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">GROWTH</span><h2>成长足迹</h2></div>' +
    '<span class="meta">培养活动与荣誉</span></div><div class="tl">' +
    activities.map(a => '<div class="tl-item"><div class="t">' + esc(a.date) + ' · AISE 培养活动</div>' +
      '<div class="n">' + esc(a.name) + ' <span>成绩 ' + esc(a.result) + '</span></div></div>').join('') +
    (mats.honors || []).map(x => '<div class="tl-item honor"><div class="t">' + esc(x.time || '') + ' · 荣誉</div>' +
      '<div class="n">' + esc(x.name) + ' <span>' + esc(x.honor || '') + '</span></div></div>').join('') +
    '</div></div>' : '') +

    // —— 建议 ——
    '<div class="sec"><div class="sec-head"><div><span class="eyebrow">NEXT STEP</span><h2>下一阶段建议</h2></div>' +
    '<span class="meta">AI 生成 · 经审核后提供</span></div>' +
    '<div class="sug-grid">' + (c.suggestions || []).map((s, i) =>
      '<div class="sug-card"><span class="sug-num">' + (i + 1) + '</span><p>' + esc(s) + '</p></div>').join('') +
    '</div></div>' +

    '<div class="foot-note">本报告由人才库画像分析智能体生成，内容经质量审核后对外提供 · 知识点掌握度口径与个人报告一致（得分和÷满分和）</div>';
}

async function generate(isRegen) {
    await post('/api/student/report/generate');
    document.getElementById('content').innerHTML =
      '<div class="sec gen-hero" style="margin-top:24px"><div><span class="pulse-dot"></span><span style="font-size:17px;font-weight:700">智能体正在生成画像分析报告…</span></div>' +
      '<p style="color:#94a3b8;font-size:13.5px;margin-top:10px">正在综合测评成绩、逐题作答、知识点掌握与作品评价，通常需要 20-60 秒</p></div>';
}

let pollTimer = null;
async function init() {
    await guard('student');
    await load();
    pollTimer = setInterval(async () => {
        if (document.getElementById('content').textContent.includes('正在生成')) await load();
    }, 4000);
}
init();
</script>
</body>
</html>
