<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱测评 - 试卷详情</title>
<link rel="stylesheet" href="爱测评线上样式.css">
<style>
html, body { margin: 0; padding: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }

/* 线上容器：浅蓝渐变背景 */
.container {
  min-height: 100vh;
  width: 100%;
  min-width: 1280px;
  background: linear-gradient(0deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.4) 100%), radial-gradient(158.01% 139.35% at 0% 0%, #D9F2FF 0%, #F2F0FC 27.87%, #BFD8FF 100%);
}
/* 线上顶栏：透明+毛玻璃，64px，满宽 */
.header { height: 64px; width: 100%; position: sticky; top: 0; left: 0; backdrop-filter: blur(10px); background: rgba(0,0,0,0); }

/* 页面容器（线上 .home） */
.home { width: 1280px; margin: 20px auto; padding: 20px 10px; }

/* 试卷头部：退出 + 试卷详情 */
.paper-header { margin: 12px 0; display: flex; align-items: center; color: #64666B; font-size: 14px; }
.paper-header .header_title { font-size: 16px; color: #333; font-weight: 600; }
.paper-header .ant-divider-vertical { margin: 0 12px; }

/* 试卷标题输入 */
.paper-title { margin: 12px 0; }
.paper-title .ant-input {
  border-radius: 8px; height: 68px; font-size: 24px; color: #323335; text-align: center;
  border-width: medium; border-style: none; border-color: currentcolor; border-image: none; outline: none; box-shadow: none;
  font-family: PingFang SC; font-weight: 600; width: 100%; background: #fff;
}
.paper-title .ant-input::placeholder { color: #bfbfbf; font-weight: 400; }

/* 题目内容区（空白卡片） */
.paper-content { border-radius: 8px; min-height: 65vh; height: calc(100vh - 200px); overflow: auto; background: #fff; }

/* 右侧信息面板 */
.paper-sider { flex: 0 0 320px; max-width: 320px; min-width: 320px; width: 320px; overflow: hidden auto; margin-left: 12px; }
.question-index { text-align: left; border: none; border-radius: 8px; margin-bottom: 20px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.question-index .paper-info h3 { color: #323335; font-family: "PingFang SC"; font-size: 16px; font-style: normal; font-weight: 500; margin: 0 0 12px; }
.question-index .paper-info .total-label { color: #898B8F; font-family: "PingFang SC"; font-size: 14px; font-style: normal; font-weight: 400; }
.question-index .paper-info .total-num { color: #252931; font-family: OPPOSans, "PingFang SC"; font-size: 14px; font-style: normal; font-weight: 400; }
.paperQuestionBox { max-height: calc(100vh - 500px); overflow: auto; border-top: 1px dashed #1618230F; margin-top: 8px !important; }

/* 底部操作区 */
.paper-operation .ant-btn { border-radius: 20px; height: 40px; width: 100%; }
.paper-operation .ant-btn.answer-hidden { background: #2A55E5; border-color: #2A55E5; color: #fff; }
.paper-operation .ant-select-selection { border-radius: 20px; min-height: 40px; height: 40px; }
.paper-operation .ant-select-selection .ant-select-selection__rendered { line-height: 38px; padding: 0 16px; }
.paper-operation .ant-select-selection .ant-select-selection-selected-value { line-height: 40px; }

/* 通用下拉 */
.opt-dropdown { position: absolute; top: 42px; left: 0; right: 0; z-index: 200; background: #fff; border: 1px solid #e8e8e8; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-height: 260px; overflow: auto; display: none; }
.opt-dropdown .kp-opt { padding: 8px 16px; font-size: 13px; color: #323335; cursor: pointer; }
.opt-dropdown .kp-opt:hover, .opt-dropdown .kp-opt.active { background: #E5F5FF; color: #2A55E5; }

.scrollbarStyle { scrollbar-width: thin; scrollbar-color: transparent transparent; }
.scrollbarStyle:hover { scrollbar-color: rgba(0,0,0,.2) transparent; }

.demo-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 14px; z-index: 9999; display: none; }
</style>
</head>
<body>
<div class="demo-toast" id="demoToast"></div>
<div class="container">
  <!-- ===== 顶部导航 ===== -->
  <div style="position: sticky; top: 0; z-index: 999;">
    <div class="header">
      <div class="ant-row-flex ant-row-flex-middle" style="display:flex;align-items:center;">
        <div class="brand ant-col" style="flex: 0 0 300px; display:flex; align-items:center; padding-left:24px;">
          <img src="assets/logo.png" alt="logo" style="height:36px;">
          <div role="separator" class="ant-divider ant-divider-vertical"></div>
          <div class="levelLogo"><img src="assets/level-logo.png" alt="" style="height:30px;"></div>
        </div>
        <div class="menu ant-col" style="flex: 1 1 0%;">
          <ul role="menu" class="ant-menu ant-menu-horizontal ant-menu-root ant-menu-light">
            <li role="menuitem" class="ant-menu-item"><a href="/index"><span>首页</span></a></li>
            <li role="menuitem" class="ant-menu-submenu ant-menu-submenu-horizontal ant-menu-submenu-selected"><div class="ant-menu-submenu-title"><span style="display:flex;align-items:center;cursor:pointer;"><span>测评管理</span></span><i class="ant-menu-submenu-arrow"></i></div></li>
            <li role="menuitem" class="ant-menu-item"><a href="/dataReport"><span>测评报告</span></a></li>
          </ul>
        </div>
        <div style="padding-right:24px; display:flex; align-items:center; gap:8px;">
          <span class="ant-avatar" style="background:#2A55E5;">A</span>
          <span style="font-size:14px;color:#323335;">AISE管理员</span>
          <i class="anticon anticon-down" style="color:#999;">▾</i>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 页面内容 ===== -->
  <div class="home">
    <div id="paper-root">
      <section class="ant-layout" theme="light">
        <!-- 试卷头部：退出 + 试卷详情 -->
        <div class="paper-header">
          <span style="cursor: pointer;" onclick="location.href='14_试卷管理.html'">
            <i aria-label="图标: left" class="anticon anticon-left" style="margin-right:4px;">←</i>退出
          </span>
          <div role="separator" class="ant-divider ant-divider-vertical"></div>
          <span class="header_title" style="font-weight: 600;">试卷详情</span>
        </div>

        <section class="ant-layout ant-layout-has-sider" style="display:flex;">
          <!-- 左侧主区：标题 + 题目列表 -->
          <main class="scrollbarStyle ant-layout-content" style="flex: 1 1 0%; min-width: 0;">
            <div class="paper-title" style="margin-top: 0px;">
              <input placeholder="请填写试卷名称" type="text" class="ant-input" id="paperName">
            </div>
            <div class="paper-content scrollbarStyle ant-card" id="scrollContainer"></div>
          </main>

          <!-- 右侧信息面板 -->
          <aside class="ant-layout-sider paper-sider">
            <div class="ant-layout-sider-children">
              <div class="question-index ant-card ant-card-bordered">
                <div class="ant-card-body" style="padding:16px;">
                  <div class="paper-info">
                    <h3>试卷信息</h3>
                    <div class="ant-row" style="display:flex;">
                      <div class="ant-col ant-col-12" style="width:50%;"><span class="total-label">题数：</span><span class="total-num" id="qCount">0</span></div>
                      <div class="ant-col ant-col-12" style="width:50%;"><span class="total-label">总分：</span><span class="total-num" id="qScore">0</span></div>
                    </div>
                  </div>
                  <div class="paperQuestionBox scrollbarStyle ant-row" style="display:flex;flex-wrap:wrap;margin:-6px;min-height:160px;margin-top:8px;"></div>
                </div>
              </div>

              <div class="paper-operation ant-row" style="display:flex;flex-wrap:wrap;margin:-8px;">
                <div class="ant-col ant-col-12" style="width:50%;padding:8px;">
                  <button type="button" class="ant-btn" id="hideAnswerBtn" onclick="toggleHideAnswer()" style="border-width:medium;border-style:none;border-color:currentcolor;border-image:none;"><span>隐藏答案</span></button>
                </div>
                <div class="ant-col ant-col-12" style="width:50%;padding:8px;position:relative;">
                  <div tabindex="0" class="ant-select ant-select-enabled" style="border-width:medium;border-style:none;border-color:currentcolor;border-image:none;width:100%;" onclick="toggleDropdown('diffDropdown')">
                    <div role="combobox" aria-autocomplete="list" aria-haspopup="true" class="ant-select-selection ant-select-selection--single">
                      <div class="ant-select-selection__rendered">
                        <div unselectable="on" class="ant-select-selection__placeholder" id="diffVal" style="display:block;user-select:none;color:#bfbfbf;">试卷难度</div>
                      </div>
                      <span unselectable="on" class="ant-select-arrow" style="user-select:none;">▾</span>
                    </div>
                    <div class="opt-dropdown" id="diffDropdown">
                      <div class="kp-opt" onclick="pickOption(this,'diffVal','diffDropdown')">简单</div>
                      <div class="kp-opt" onclick="pickOption(this,'diffVal','diffDropdown')">中等</div>
                      <div class="kp-opt" onclick="pickOption(this,'diffVal','diffDropdown')">困难</div>
                    </div>
                  </div>
                </div>
                <div class="ant-col ant-col-24" style="width:100%;padding:8px;position:relative;">
                  <div tabindex="0" class="ant-select ant-select-enabled" style="width:100%;" onclick="toggleDropdown('visDropdown')">
                    <div role="combobox" aria-autocomplete="list" aria-haspopup="true" class="ant-select-selection ant-select-selection--single">
                      <div class="ant-select-selection__rendered">
                        <div unselectable="on" class="ant-select-selection__placeholder" id="visPlaceholder" style="display:none;user-select:none;">请选择试卷可见范围</div>
                        <div title="仅自己可见" class="ant-select-selection-selected-value" id="visVal" style="display:block;opacity:1;">仅自己可见</div>
                      </div>
                      <span unselectable="on" class="ant-select-arrow" style="user-select:none;">▾</span>
                    </div>
                    <div class="opt-dropdown" id="visDropdown">
                      <div class="kp-opt active" onclick="pickOption(this,'visVal','visDropdown')">仅自己可见</div>
                      <div class="kp-opt" onclick="pickOption(this,'visVal','visDropdown')">本组织可见</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('demoToast');
  t.textContent = msg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
}

/* ============ 隐藏答案开关 ============ */
var answerHidden = false;
function toggleHideAnswer() {
  answerHidden = !answerHidden;
  document.getElementById('hideAnswerBtn').classList.toggle('answer-hidden', answerHidden);
  toast(answerHidden ? '已隐藏答案（演示）' : '已显示答案（演示）');
}

/* ============ 下拉 ============ */
function toggleDropdown(id) {
  document.querySelectorAll('.opt-dropdown').forEach(function (d) { if (d.id !== id) d.style.display = 'none'; });
  var dd = document.getElementById(id);
  dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
}
function pickOption(el, valId, ddId) {
  var val = document.getElementById(valId);
  val.textContent = el.textContent;
  val.style.color = '#323335';
  var dd = document.getElementById(ddId);
  dd.querySelectorAll('.kp-opt').forEach(function (o) { o.classList.remove('active'); });
  el.classList.add('active');
  dd.style.display = 'none';
  if (valId === 'visVal') toast('可见范围已设为「' + el.textContent + '」（演示）');
}
document.addEventListener('click', function (e) {
  if (!e.target.closest('.ant-select')) {
    document.querySelectorAll('.opt-dropdown').forEach(function (d) { d.style.display = 'none'; });
  }
});

/* ============ 从试卷管理带入名称 ============ */
(function () {
  var m = location.search.match(/[?&]name=([^&]+)/);
  if (m) {
    var name = decodeURIComponent(m[1]);
    document.getElementById('paperName').value = name;
    document.title = '爱测评 - ' + name;
  }
})();
</script>
</body>
</html>
