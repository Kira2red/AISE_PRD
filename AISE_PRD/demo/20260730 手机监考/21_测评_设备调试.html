<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备检测 - AISE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e8ecf1;
            background-image: radial-gradient(circle, rgba(148,163,184,0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .test-card {
            background: #f8f9fb;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 24px 16px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .test-card .btn-test {
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .test-card .btn-test.done {
            color: #16a34a;
            border-color: #86efac;
            background: #f0fdf4;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-untested { background: #cbd5e1; }
        .status-passed { background: #22c55e; }
        .status-failed { background: #ef4444; }
    </style>
</head>
<body class="p-4">

    <div class="w-full max-w-[700px] bg-white rounded-2xl shadow-lg overflow-hidden">
        
        <!-- Header -->
        <div class="px-8 sm:px-10 pt-10 pb-6">
            <h2 class="text-2xl font-bold text-slate-900">设备检测</h2>
            <p class="text-sm text-slate-400 mt-1.5">完成设备调试后即可进入考试</p>
        </div>

        <!-- Environment Check Banner -->
        <div class="mx-8 sm:mx-10 mb-8 px-4 py-3 bg-green-50 border border-green-200 rounded-lg flex items-center gap-3">
            <div class="w-5 h-5 rounded-full bg-green-500 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <span class="text-sm font-medium text-green-700">浏览器环境检测通过</span>
        </div>

        <!-- Test Modules -->
        <div class="px-8 sm:px-10 pb-3">
            <!-- Card labels row -->
            <div class="flex gap-4 mb-2">
                <div class="flex-1 text-center">
                    <span class="inline-flex items-center gap-1.5 text-xs text-slate-500">
                        <span class="status-dot status-untested" id="dot-cam"></span>摄像头调试
                    </span>
                </div>
                <div class="flex-1 text-center">
                    <span class="inline-flex items-center gap-1.5 text-xs text-slate-500">
                        <span class="status-dot status-untested" id="dot-screen"></span>录屏调试
                    </span>
                </div>
                <div class="flex-1 text-center">
                    <span class="inline-flex items-center gap-1.5 text-xs text-slate-500">
                        <span class="status-dot status-untested" id="dot-mobile"></span>手机监考
                    </span>
                </div>
            </div>
            <!-- Cards row -->
            <div class="flex gap-4 mb-8">
                
                <!-- Camera Test -->
                <div class="test-card">
                    <div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center mb-3">
                        <i class="fa-solid fa-video text-green-500 text-xl"></i>
                    </div>
                    <button onclick="testCamera()" id="cam-btn"
                        class="btn-test px-4 py-1.5 border border-slate-300 text-slate-500 text-sm rounded-lg hover:border-brand-500 hover:text-brand-600 transition cursor-pointer bg-white">
                        点击测试
                    </button>
                </div>

                <!-- Screen Recording Test -->
                <div class="test-card">
                    <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center mb-3">
                        <i class="fa-solid fa-desktop text-blue-500 text-xl"></i>
                    </div>
                    <button onclick="testScreen()" id="screen-btn"
                        class="btn-test px-4 py-1.5 border border-slate-300 text-slate-500 text-sm rounded-lg hover:border-brand-500 hover:text-brand-600 transition cursor-pointer bg-white">
                        点击测试
                    </button>
                </div>

                <!-- Mobile Proctoring -->
                <div class="test-card">
                    <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center mb-3">
                        <i class="fa-solid fa-mobile-screen-button text-slate-400 text-xl"></i>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-lg p-1.5 mb-2" style="width:88px;height:88px;">
                        <canvas id="qr-canvas" width="82" height="82"></canvas>
                    </div>
                    <p class="text-xs text-slate-500 text-center leading-relaxed px-1">
                        电脑没有摄像头？<br>手机扫码开启视频监考
                    </p>
                </div>

            </div>
        </div>

        <!-- CTA Button -->
        <div class="px-8 sm:px-10 pb-10">
            <button onclick="enterExam()" id="enter-btn"
                class="w-full py-3.5 bg-slate-300 text-white font-semibold rounded-xl transition cursor-not-allowed flex items-center justify-center gap-2"
                disabled>
                → 进入测评
            </button>
        </div>

    </div>

    <script>
        let testsPassed = { cam: false, screen: false };

        function updateEnterBtn() {
            const btn = document.getElementById('enter-btn');
            if (testsPassed.cam && testsPassed.screen) {
                btn.disabled = false;
                btn.classList.remove('bg-slate-300', 'text-white', 'cursor-not-allowed');
                btn.classList.add('bg-brand-600', 'text-white', 'cursor-pointer', 'hover:bg-brand-700', 'shadow-md');
            }
        }

        function updateDot(id, status) {
            const dot = document.getElementById(id);
            dot.classList.remove('status-untested', 'status-passed', 'status-failed');
            dot.classList.add('status-' + status);
        }

        function drawQR() {
            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');
            const size = 82;
            const mod = 3.417; // 24 rows x ~3.417px
            const n = 24;
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, size, size);
            
            // Finder patterns
            drawFinder(ctx, 2, 2, 3.417);
            drawFinder(ctx, size - 7*3.417 - 2, 2, 3.417);
            drawFinder(ctx, 2, size - 7*3.417 - 2, 3.417);
            
            // Data modules
            const seed = 42;
            for (let row = 0; row < n; row++) {
                for (let col = 0; col < n; col++) {
                    if (row < 8 && col < 8) continue;
                    if (row < 8 && col >= n - 8) continue;
                    if (row >= n - 8 && col < 8) continue;
                    const val = (seed * 31 + row * 17 + col * 13) % 100;
                    if (val < 38) {
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(col * mod, row * mod, Math.ceil(mod), Math.ceil(mod));
                    }
                }
            }
        }
        
        function drawFinder(ctx, x, y, m) {
            const s = 7 * m;
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x, y, s, s);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + m, y + m, 5*m, 5*m);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x + 2*m, y + 2*m, 3*m, 3*m);
        }
        
        drawQR();

        function testCamera() {
            const btn = document.getElementById('cam-btn');
            btn.textContent = '检测中…';
            btn.disabled = true;
            btn.classList.add('cursor-wait');
            setTimeout(() => {
                btn.textContent = '✓ 摄像头正常';
                btn.classList.add('done');
                btn.classList.remove('cursor-wait');
                btn.disabled = false;
                testsPassed.cam = true;
                updateDot('dot-cam', 'passed');
                updateEnterBtn();
            }, 1200);
        }

        function testScreen() {
            const btn = document.getElementById('screen-btn');
            btn.textContent = '请求中…';
            btn.disabled = true;
            btn.classList.add('cursor-wait');
            setTimeout(() => {
                btn.textContent = '✓ 已授权';
                btn.classList.add('done');
                btn.classList.remove('cursor-wait');
                btn.disabled = false;
                testsPassed.screen = true;
                updateDot('dot-screen', 'passed');
                updateEnterBtn();
            }, 1000);
        }

        function enterExam() {
            if (!testsPassed.cam || !testsPassed.screen) return;
            // Demo: redirect placeholder
            alert('进入考试（Demo）');
        }

        // Simulate mobile connection after QR scan (for demo)
        // In production this would be server-pushed via WebSocket
        document.getElementById('qr-canvas').parentElement.addEventListener('click', function() {
            const dot = document.getElementById('dot-mobile');
            if (!dot.classList.contains('status-passed')) {
                dot.classList.remove('status-untested');
                dot.classList.add('status-passed');
                // In real scenario, mobile connection also counts for camera check
                testsPassed.cam = true;
                updateDot('dot-cam', 'passed');
                const camBtn = document.getElementById('cam-btn');
                camBtn.textContent = '✓ 手机已连接';
                camBtn.classList.add('done');
                camBtn.disabled = true;
                updateEnterBtn();
            }
        });
    </script>
</body>
</html>
